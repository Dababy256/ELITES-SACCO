<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elites SACCO Ultimate Master</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body{font-family:'Segoe UI', sans-serif; background:#F3E9D2; margin:0; color:#111}
    header{background:#111; color:#fff; padding:15px; display:flex; align-items:center; gap:12px; border-bottom:4px solid #B08D57}
    #logoSlot img{height:55px; width:55px; border-radius:50%; border:2px solid #B08D57; background:#fff; object-fit:cover}
    .container{padding:16px; max-width:1100px; margin:auto}
    .card{background:#fff; padding:20px; border-radius:12px; margin-bottom:16px; box-shadow:0 4px 10px rgba(0,0,0,0.1)}
    h2{margin-top:0; color:#111; border-bottom:2px solid #B08D57; padding-bottom:8px}
    table{width:100%; border-collapse:collapse; font-size:12px}
    th,td{border:1px solid #eee; padding:10px; text-align:left}
    th{background:#B08D57; color:#000}
    button{padding:8px 12px; border:none; border-radius:6px; background:#111; color:#fff; cursor:pointer; font-weight:bold; margin:2px}
    button.gold{background:#B08D57; color:#000}
    button.del{background:#ff4d4d; color:white; padding:4px 8px; font-size:10px}
    input,select{padding:10px; width:100%; margin-bottom:10px; border:1px solid #ccc; border-radius:8px}
    .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px}
    .stat-box{padding:12px; border-radius:8px; background:#f9f9f9; border:1px solid #ddd; color:#111}
    .status-cleared{color:#2E7D32; font-weight:bold}
    .status-pending{color:#C62828; font-weight:bold}
    .arrears-banner{background:#FFF3E0; border:2px solid #FF9800; padding:15px; border-radius:8px; margin-bottom:15px}
</style>
</head>
<body>

<header>
    <div id="logoSlot"></div>
    <div style="flex-grow:1"><strong>ELITES SACCO</strong><br><small id="userLabel">Synchronizing...</small></div>
</header>

<div class="container" id="app"></div>

<script>
const BIN_ID = "6971f3eb43b1c97be94154dc"; 
const MASTER_KEY = "$2a$10$83AEiP9GsrLhSQIC8.nuW.6QtHG5XVzJElaL67zasDR0h8BYGLsQu";
const PRIMARY_ADMIN = "Apule Gerald Humble";
const SECONDARY_ADMIN = "Ameny Ronald";

let user = null;
let data = {};

async function loadData() {
    try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {headers:{'X-Master-Key':MASTER_KEY}});
        const json = await res.json();
        data = json.record;
        if(data.logo) document.getElementById("logoSlot").innerHTML = `<img src="${data.logo}">`;
        render();
    } catch (e) { console.error("Sync Error"); }
}

async function saveData() {
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method:'PUT', headers:{'Content-Type':'application/json','X-Master-Key':MASTER_KEY},
        body: JSON.stringify(data)
    });
    render();
}

function getExpectedBase(monthStr) {
    return (new Date(monthStr + "-01") < new Date("2024-08-01")) ? 80000 : 100000;
}

function render() {
    const app = document.getElementById("app");
    if(!user) {
        let h = `<div class="card" style="text-align:center"><h2>Login</h2><div class="grid">`;
        data.members.forEach(m => h += `<button onclick="checkLogin('${m}')">${m}</button>`);
        app.innerHTML = h + `</div></div>`;
        return;
    }

    const isAdmin = user.name === PRIMARY_ADMIN || user.name === SECONDARY_ADMIN;
    const target = isAdmin ? document.getElementById("viewMem")?.value || user.name : user.name;
    const today = new Date().toISOString().split('T')[0];

    // FINANCE TOTALS
    let tSav = 0, tLoa = 0, tInv = 0, tExp = 0;
    data.members.forEach(m => {
        data[m].contributions.forEach(c => tSav += Number(c.amt));
        data[m].loans.forEach(l => tLoa += Number(l.bal));
    });
    data.investments.forEach(i => tInv += Number(i.amt));
    data.expenses.forEach(e => tExp += Number(e.amt));
    const cash = tSav - (tLoa + tInv + tExp);

    // TARGET CALCULATIONS
    let mySavingsTotal = data[target].contributions.reduce((acc, curr) => acc + Number(curr.amt), 0);
    let myLoanBalance = data[target].loans.reduce((acc, curr) => acc + Number(curr.bal), 0);
    let totalOwed = 0;
    let loopD = new Date("2024-02-01");
    while(loopD <= new Date()) {
        let mS = loopD.toISOString().slice(0,7);
        let paid = data[target].contributions.find(c => c.month === mS);
        if(!paid) totalOwed += getExpectedBase(mS);
        else {
            let due = new Date(mS + "-10"), pD = new Date(paid.date);
            if(pD > due) {
                let weeks = Math.ceil((pD - due) / (1000*60*60*24*7));
                totalOwed += Math.min(weeks * 5000, 15000);
            }
        }
        loopD.setMonth(loopD.getMonth() + 1);
    }

    app.innerHTML = `
        <div class="card" style="background:#111; color:#fff">
            <h2>CASH AT HAND: UGX ${cash.toLocaleString()}</h2>
            <div class="grid">
                <div class="stat-box">SACCO Savings: ${tSav.toLocaleString()}</div>
                <div class="stat-box">Invested: ${tInv.toLocaleString()}</div>
                <div class="stat-box">Total Loans Out: ${tLoa.toLocaleString()}</div>
            </div>
            ${isAdmin ? `<button class="gold" onclick="exportCSV()">Export to Excel</button>` : ''}
        </div>

        <div class="arrears-banner">
            <h3 style="margin:0">Dashboard: ${target}</h3>
            <div class="grid" style="margin-top:10px">
                <div class="stat-box" style="background:#E8F5E9"><strong>My Savings:</strong><br>UGX ${mySavingsTotal.toLocaleString()}</div>
                <div class="stat-box" style="background:#FFEBEE"><strong>Outstanding Arrears:</strong><br>UGX ${totalOwed.toLocaleString()}</div>
                <div class="stat-box" style="background:#E3F2FD"><strong>My Loan Balance:</strong><br>UGX ${Math.max(0, myLoanBalance).toLocaleString()}</div>
            </div>
            <div style="margin-top:15px">
                <button onclick="changePIN()" style="background:#444; font-size:11px">Change PIN</button>
                <button onclick="user=null;render()" style="background:#666; font-size:11px">Logout</button>
            </div>
        </div>`;

    if(isAdmin) {
        app.innerHTML += `
        <div class="card" style="border:2px solid #B08D57">
            <h2>Admin Entry Hub</h2>
            <div class="grid">
                <div>
                    <h3>Inflow</h3>
                    <select id="mI">${data.members.map(m=>`<option>${m}</option>`)}</select>
                    <select id="tI"><option value="S">Monthly Savings</option><option value="R">Loan Repayment</option></select>
                    <input type="month" id="moI" value="2024-02">
                    <input type="date" id="daI" placeholder="Auto-Date if blank">
                    <input type="number" id="amI" placeholder="Amount">
                    <button class="gold" onclick="postInflow()">Post</button>
                </div>
                <div>
                    <h3>Outflow</h3>
                    <select id="tO"><option value="L">Loan</option><option value="E">Expense</option><option value="I">Invest</option></select>
                    <select id="mL_out">${data.members.map(m=>`<option ${m===target?'selected':''}>${m}</option>`)}</select>
                    <input type="date" id="daO" value="${today}">
                    <input type="text" id="reO" placeholder="Description">
                    <input type="number" id="amO" placeholder="Amount">
                    <button class="gold" onclick="postOutflow()">Post</button>
                </div>
            </div>
        </div>`;
    }

    let statusHTML = `<div class="card"><h2>Clearance & Statement</h2>
        ${isAdmin ? `<select id="viewMem" onchange="render()">${data.members.map(m => `<option ${m===target?'selected':''}>${m}</option>`)}</select>` : ''}
        <table><tr><th>Month</th><th>Status</th><th>Paid On</th><th>Late Fee</th></tr>`;
    
    let reportD = new Date("2024-02-01");
    while(reportD <= new Date()) {
        let mStr = reportD.toISOString().slice(0,7), paid = data[target].contributions.find(c => c.month === mStr), fee = 0;
        if(paid) {
            let due = new Date(mStr + "-10"), pDate = new Date(paid.date);
            if(pDate > due) fee = Math.min(Math.ceil((pDate-due)/(1000*60*60*24*7)) * 5000, 15000);
        }
        statusHTML += `<tr><td>${mStr}</td><td class="${paid?'status-cleared':'status-pending'}">${paid?'CLEARED':'PENDING'}</td><td>${paid?paid.date:'-'}</td><td>${fee>0?'UGX '+fee.toLocaleString():'None'}</td></tr>`;
        reportD.setMonth(reportD.getMonth() + 1);
    }
    app.innerHTML += statusHTML + `</table></div>`;

    if(isAdmin) {
        let audit = `<div class="card"><h2>Audit Table</h2><table>`;
        data.members.forEach(m => {
            data[m].contributions.forEach((c,i) => audit += `<tr><td>${m}</td><td>Savings</td><td>${c.amt}</td><td><button class="del" onclick="del('S','${m}',${i})">X</button></td></tr>`);
            data[m].loans.forEach((l,i) => audit += `<tr><td>${m}</td><td>${l.type}</td><td>${l.amt}</td><td><button class="del" onclick="del('L','${m}',${i})">X</button></td></tr>`);
        });
        data.expenses.forEach((e,i) => audit += `<tr><td>SACCO</td><td>Expense</td><td>${e.amt}</td><td><button class="del" onclick="del('E',null,i)">X</button></td></tr>`);
        data.investments.forEach((inv,i) => audit += `<tr><td>SACCO</td><td>Invest</td><td>${inv.amt}</td><td><button class="del" onclick="del('I',null,i)">X</button></td></tr>`);
        app.innerHTML += audit + `</table></div>`;
    }
}

function postInflow() {
    const m = document.getElementById("mI").value, t = document.getElementById("tI").value, amt = Number(document.getElementById("amI").value), mon = document.getElementById("moI").value;
    let date = document.getElementById("daI").value;
    if(!date && t==='S') {
        const base = getExpectedBase(mon), fee = amt - base;
        if(fee <= 0) date = mon + "-10"; else if(fee <= 5000) date = mon + "-11"; else if(fee <= 10000) date = mon + "-18"; else date = mon + "-25";
    } else if(!date) date = new Date().toISOString().split('T')[0];
    if(t==='S') data[m].contributions.push({amt, date, month:mon}); else data[m].loans.push({amt, date, bal:-amt, type:'REPAYMENT'});
    saveData();
}

function postOutflow() {
    const t = document.getElementById("tO").value, amt = Number(document.getElementById("amO").value), re = document.getElementById("reO").value, date = document.getElementById("daO").value;
    if(t==='L') { const m = document.getElementById("mL_out").value; data[m].loans.push({amt, date, bal:amt, type:'LOAN'}); }
    else if(t==='E') data.expenses.push({amt, reason:re, date});
    else if(t==='I') data.investments.push({amt, reason:re, date});
    saveData();
}

function del(cat, mem, idx) { if(confirm("Delete?")){ if(cat==='S')data[mem].contributions.splice(idx,1); else if(cat==='L')data[mem].loans.splice(idx,1); else if(cat==='E')data.expenses.splice(idx,1); else data.investments.splice(idx,1); saveData();}}
function changePIN() { let p = prompt("New 4-digit PIN:"); if(p && p.length===4){data[user.name].pin=p; saveData(); alert("Saved!");} }
function checkLogin(n) { let p = prompt("PIN:"); if(p===data[n].pin){user={name:n};render();}else alert("Error"); }
function exportCSV() { let csv = "Date,Entity,Type,Amt\n"; data.members.forEach(m=>{data[m].contributions.forEach(c=>csv+=`${c.date},${m},Savings,${c.amt}\n`); data[m].loans.forEach(l=>csv+=`${l.date},${m},${l.type},${l.amt}\n`)}); data.expenses.forEach(e=>csv+=`${e.date},SACCO,Expense,${e.amt}\n`); data.investments.forEach(i=>csv+=`${i.date},SACCO,Invest,${i.amt}\n`); window.open('data:text/csv;charset=utf-8,' + encodeURI(csv)); }
loadData();
</script>
</body>
</html>
