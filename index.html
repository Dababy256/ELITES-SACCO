<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elites SACCO Final Master</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body{font-family:'Segoe UI', sans-serif; background:#F3E9D2; margin:0; color:#111}
    header{background:#111; color:#fff; padding:15px; display:flex; align-items:center; gap:12px; border-bottom:4px solid #B08D57}
    #logoSlot img{height:55px; width:55px; border-radius:50%; border:2px solid #B08D57; background:#fff; object-fit:cover}
    .container{padding:16px; max-width:1100px; margin:auto}
    .card{background:#fff; padding:20px; border-radius:12px; margin-bottom:16px; box-shadow:0 4px 10px rgba(0,0,0,0.1)}
    h2{margin-top:0; color:#111; border-bottom:2px solid #B08D57; padding-bottom:8px}
    table{width:100%; border-collapse:collapse; font-size:11px; margin-bottom:15px}
    th,td{border:1px solid #eee; padding:8px; text-align:left}
    th{background:#B08D57; color:#000}
    button{padding:8px 12px; border:none; border-radius:6px; background:#111; color:#fff; cursor:pointer; font-weight:bold; margin:2px}
    button.gold{background:#B08D57; color:#000}
    button.del{background:#ff4d4d; color:white; padding:2px 6px; font-size:10px; border-radius:4px}
    input,select{padding:10px; width:100%; margin-bottom:10px; border:1px solid #ccc; border-radius:8px}
    .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px}
    .stat-box{padding:12px; border-radius:8px; background:#f9f9f9; border:1px solid #ddd; color:#111}
    .status-cleared{color:#2E7D32; font-weight:bold}
    .status-partial{color:#EF6C00; font-weight:bold}
    .status-pending{color:#C62828; font-weight:bold}
    .arrears-banner{background:#FFF3E0; border:2px solid #FF9800; padding:15px; border-radius:8px; margin-bottom:15px}
</style>
</head>
<body>

<header>
    <div id="logoSlot"></div>
    <div style="flex-grow:1"><strong>ELITES SACCO</strong><br><small id="userLabel">Synchronizing...</small></div>
</header>

<div class="container" id="app"></div>

<script>
const BIN_ID = "6971f3eb43b1c97be94154dc"; 
const MASTER_KEY = "$2a$10$83AEiP9GsrLhSQIC8.nuW.6QtHG5XVzJElaL67zasDR0h8BYGLsQu";
const PRIMARY_ADMIN = "Apule Gerald Humble";
const SECONDARY_ADMIN = "Ameny Ronald";

let user = null;
let data = {};
let lastSelectedMember = null;
let currentInflowType = "S";

async function loadData() {
    try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {headers:{'X-Master-Key':MASTER_KEY}});
        const json = await res.json();
        data = json.record;
        if(data.logo) document.getElementById("logoSlot").innerHTML = `<img src="${data.logo}">`;
        render();
    } catch (e) { console.error("Sync Error"); }
}

async function saveData() {
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method:'PUT', headers:{'Content-Type':'application/json','X-Master-Key':MASTER_KEY},
        body: JSON.stringify(data)
    });
    render();
}

function getExpectedBase(monthStr) {
    return (new Date(monthStr + "-01") < new Date("2024-08-01")) ? 80000 : 100000;
}

function render() {
    const app = document.getElementById("app");
    if(!user) {
        let h = `<div class="card" style="text-align:center"><h2>Login</h2><div class="grid">`;
        data.members.forEach(m => h += `<button onclick="checkLogin('${m}')">${m}</button>`);
        app.innerHTML = h + `</div></div>`;
        return;
    }

    const isAdmin = user.name === PRIMARY_ADMIN || user.name === SECONDARY_ADMIN;
    const target = isAdmin ? document.getElementById("viewMem")?.value || user.name : user.name;
    const activeMember = lastSelectedMember || target;
    const today = new Date();

    // TREASURY CALCULATION
    let totalSavings = 0, totalRepayments = 0, totalDisbursed = 0, totalInvested = 0, totalExpenses = 0, globalInterest = 0;

    data.members.forEach(m => {
        data[m].contributions.forEach(c => totalSavings += Number(c.amt));
        
        let mLoans = data[m].loans.filter(l => l.type === 'LOAN');
        let mRepays = data[m].loans.filter(l => l.type === 'REPAYMENT');
        
        mLoans.forEach((loan, idx) => {
            let id = idx + 1;
            totalDisbursed += Number(loan.amt);
            let paidOnThis = mRepays.filter(r => r.loanId == id).reduce((a, b) => a + Number(b.amt), 0);
            totalRepayments += paidOnThis;
            
            // Calculate Interest: Anything paid beyond the original principal
            if(paidOnThis > Number(loan.amt)) {
                globalInterest += (paidOnThis - Number(loan.amt));
            }
        });
    });

    data.investments.forEach(i => totalInvested += Number(i.amt));
    data.expenses.forEach(e => totalExpenses += Number(e.amt));

    let cashAtHand = (totalSavings + totalRepayments) - (totalDisbursed + totalInvested + totalExpenses);

    // PERSONAL LOAN BALANCE (CAPPED AT 0)
    let myLoans = data[target].loans.filter(l => l.type === 'LOAN');
    let myRepays = data[target].loans.filter(l => l.type === 'REPAYMENT');
    let myDebt = 0;
    myLoans.forEach((l, i) => {
        let paid = myRepays.filter(r => r.loanId == (i+1)).reduce((a,b) => a + Number(b.amt), 0);
        let bal = Number(l.amt) - paid;
        if(bal > 0) myDebt += bal;
    });

    // SAVINGS ARREARS (LOCKED)
    let pendingSavings = 0;
    let loopD = new Date("2024-02-01");
    while(loopD <= today) {
        let mS = loopD.toISOString().slice(0,7);
        let paid = data[target].contributions.find(c => c.month === mS);
        let base = getExpectedBase(mS);
        if(!paid) {
            pendingSavings += base;
            let d10 = new Date(mS + "-10");
            if(today > d10) pendingSavings += Math.min(Math.ceil((today-d10)/(1000*60*60*24*7))*5000, 15000);
        } else if(Number(paid.amt) < base) pendingSavings += (base - Number(paid.amt));
        loopD.setMonth(loopD.getMonth() + 1);
    }

    app.innerHTML = `
        <div class="card" style="background:#111; color:#fff">
            <h2>CASH AT HAND: UGX ${cashAtHand.toLocaleString()}</h2>
            <div class="grid">
                <div class="stat-box">Total Savings: ${totalSavings.toLocaleString()}</div>
                <div class="stat-box" style="border: 1px solid #B08D57">Interest Earned: ${globalInterest.toLocaleString()}</div>
                <div class="stat-box">Loans Out: ${(totalDisbursed - totalRepayments < 0 ? 0 : totalDisbursed - totalRepayments).toLocaleString()}</div>
            </div>
        </div>

        <div class="arrears-banner">
            <h3>Account: ${target}</h3>
            <div class="grid">
                <div class="stat-box" style="background:#E8F5E9"><strong>My Savings:</strong><br>UGX ${data[target].contributions.reduce((a,b)=>a+Number(b.amt),0).toLocaleString()}</div>
                <div class="stat-box" style="background:#FFEBEE"><strong>My Pending:</strong><br>UGX ${pendingSavings.toLocaleString()}</div>
                <div class="stat-box" style="background:#E3F2FD"><strong>My Loan Debt:</strong><br>UGX ${myDebt.toLocaleString()}</div>
            </div>
        </div>`;

    if(isAdmin) {
        app.innerHTML += `
        <div class="card" style="border:2px solid #B08D57">
            <h2>Admin Entry Hub</h2>
            <div class="grid">
                <div>
                    <h3>Inflow</h3>
                    <select id="mI" onchange="lastSelectedMember=this.value; render()">
                        ${data.members.map(m => `<option value="${m}" ${m === activeMember ? 'selected' : ''}>${m}</option>`).join('')}
                    </select>
                    <select id="tI" onchange="currentInflowType=this.value; render()">
                        <option value="S" ${currentInflowType==='S'?'selected':''}>Monthly Savings</option>
                        <option value="R" ${currentInflowType==='R'?'selected':''}>Loan Repayment</option>
                    </select>
                    ${currentInflowType === 'R' ? `
                        <select id="lID">
                            ${data[activeMember].loans.filter(l=>l.type==='LOAN').length > 0 
                                ? data[activeMember].loans.filter(l=>l.type==='LOAN').map((l,i)=>`<option value="${i+1}">Loan ${i+1} (UGX ${l.amt})</option>`).join('')
                                : `<option disabled>No Loans Found</option>`}
                        </select>` : `<input type="month" id="moI" value="2024-02">`}
                    <input type="date" id="daI">
                    <input type="number" id="amI" placeholder="Amount">
                    <button class="gold" onclick="postInflow()">Post Inflow</button>
                </div>
                <div>
                    <h3>Outflow</h3>
                    <select id="tO"><option value="L">Loan Disbursed</option><option value="E">Expense</option><option value="I">Investment</option></select>
                    <input type="date" id="daO" value="${today.toISOString().split('T')[0]}">
                    <input type="text" id="reO" placeholder="Note">
                    <input type="number" id="amO" placeholder="Amount">
                    <button class="gold" onclick="postOutflow()">Post Outflow</button>
                </div>
            </div>
        </div>`;
    }

    // STATEMENTS & AUDIT (LOCKED)
    let sHTML = `<div class="card"><h2>Monthly Statement</h2><table><tr><th>Month</th><th>Status</th><th>Amt</th></tr>`;
    let rd = new Date("2024-02-01");
    while(rd <= today) {
        let mS = rd.toISOString().slice(0,7), p = data[target].contributions.find(c => c.month === mS);
        let st = p ? (Number(p.amt) >= getExpectedBase(mS) ? 'CLEARED' : 'PARTIAL') : 'PENDING';
        let cl = p ? (Number(p.amt) >= getExpectedBase(mS) ? 'status-cleared' : 'status-partial') : 'status-pending';
        sHTML += `<tr><td>${mS}</td><td class="${cl}">${st}</td><td>${p?p.amt:'-'}</td></tr>`;
        rd.setMonth(rd.getMonth() + 1);
    }
    
    let lHTML = `<h2>Loan Records</h2><table><tr><th>ID</th><th>Principal</th><th>Paid</th><th>Status</th></tr>`;
    myLoans.forEach((l, i) => {
        let id = i + 1, paid = myRepays.filter(r => r.loanId == id).reduce((a,b) => a + Number(b.amt), 0);
        let bal = Number(l.amt) - paid;
        let cl = bal <= 0 ? "status-cleared" : (paid > 0 ? "status-partial" : "status-pending");
        lHTML += `<tr><td>Loan ${id}</td><td>${Number(l.amt).toLocaleString()}</td><td>${paid.toLocaleString()}</td><td class="${cl}">${bal<=0?'PAID':'ACTIVE'}</td></tr>`;
    });
    app.innerHTML += sHTML + `</table>` + lHTML + `</table></div>`;
    
    if(isAdmin) {
        let audit = `<div class="card"><h2>Audit Ledger</h2><table><tr><th>Member</th><th>Type</th><th>Details</th><th>Amt</th><th>Action</th></tr>`;
        data.members.forEach(m => {
            data[m].contributions.forEach((c,i) => audit += `<tr><td>${m}</td><td>Savings</td><td>${c.month}</td><td>${c.amt}</td><td><button class="del" onclick="del('S','${m}',${i})">X</button></td></tr>`);
            data[m].loans.forEach((l,i) => audit += `<tr><td>${m}</td><td>${l.type}</td><td>${l.type==='REPAYMENT'?'Loan '+l.loanId:l.date}</td><td>${l.amt}</td><td><button class="del" onclick="del('L','${m}',${i})">X</button></td></tr>`);
        });
        app.innerHTML += audit + `</table></div>`;
    }
}

function postInflow() {
    const m = document.getElementById("mI").value, t = currentInflowType, amt = Number(document.getElementById("amI").value);
    let date = document.getElementById("daI").value || new Date().toISOString().split('T')[0];
    lastSelectedMember = m;
    if(t === 'S') {
        const mon = document.getElementById("moI").value;
        data[m].contributions.push({amt, date, month:mon});
        let dObj = new Date(mon + "-01"); dObj.setMonth(dObj.getMonth() + 1);
        saveData().then(() => { if(document.getElementById("moI")) document.getElementById("moI").value = dObj.toISOString().slice(0,7); });
    } else {
        const lIdSelect = document.getElementById("lID");
        if(lIdSelect && lIdSelect.value !== "No Loans Found") {
            data[m].loans.push({amt, date, type:'REPAYMENT', loanId: lIdSelect.value});
            saveData();
        }
    }
}

function postOutflow() {
    const t = document.getElementById("tO").value, amt = Number(document.getElementById("amO").value, date = document.getElementById("daO").value);
    const m = document.getElementById("mI").value;
    if(t==='L') data[m].loans.push({amt, date, type:'LOAN'});
    else if(t==='E') data.expenses.push({amt, reason:document.getElementById("reO").value, date});
    else if(t==='I') data.investments.push({amt, reason:document.getElementById("reO").value, date});
    saveData();
}

function del(cat, mem, idx) { if(confirm("Delete?")){ if(cat==='S')data[mem].contributions.splice(idx,1); else data[mem].loans.splice(idx,1); saveData();}}
function changePIN() { let p = prompt("New PIN:"); if(p && p.length===4){data[user.name].pin=p; saveData();} }
function checkLogin(n) { let p = prompt("PIN:"); if(p===data[n].pin){user={name:n};render();}else alert("Error"); }
loadData();
</script>
</body>
</html>
