<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elites SACCO Master Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body{font-family:'Segoe UI', sans-serif; background:#F3E9D2; margin:0; color:#111}
    header{background:#111; color:#fff; padding:15px; display:flex; align-items:center; gap:12px; border-bottom:4px solid #B08D57}
    #logoSlot img{height:55px; width:55px; border-radius:50%; border:2px solid #B08D57; background:#fff; object-fit:cover}
    .container{padding:16px; max-width:1100px; margin:auto}
    .card{background:#fff; padding:20px; border-radius:12px; margin-bottom:16px; box-shadow:0 4px 10px rgba(0,0,0,0.1)}
    h2{margin-top:0; color:#111; border-bottom:2px solid #B08D57; padding-bottom:8px}
    table{width:100%; border-collapse:collapse; font-size:12px}
    th,td{border:1px solid #eee; padding:10px; text-align:left}
    th{background:#B08D57; color:#000}
    button{padding:10px 18px; border:none; border-radius:6px; background:#111; color:#fff; cursor:pointer; font-weight:bold; margin:2px}
    button.gold{background:#B08D57; color:#000}
    input,select{padding:10px; width:100%; margin-bottom:10px; border:1px solid #ccc; border-radius:8px}
    .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:15px}
    .status{padding:4px 10px; border-radius:4px; font-size:11px; font-weight:bold}
    .paid{background:#d4edda; color:#155724}
    .pending{background:#f8d7da; color:#721c24}
    .report-area{background:#eee; padding:15px; border-radius:8px; white-space:pre-wrap; font-family:monospace; margin-top:10px; display:none}
    .stat-box{padding:15px; border-radius:8px; background:#f9f9f9; border:1px solid #ddd}
</style>
</head>
<body>

<header>
    <div id="logoSlot"></div>
    <div style="flex-grow:1"><strong>ELITES SACCO</strong><br><small id="userLabel">Synchronizing System...</small></div>
</header>

<div class="container" id="app"></div>

<script>
const BIN_ID = "6971f3eb43b1c97be94154dc"; 
const MASTER_KEY = "$2a$10$83AEiP9GsrLhSQIC8.nuW.6QtHG5XVzJElaL67zasDR0h8BYGLsQu";
const PRIMARY_ADMIN = "Apule Gerald Humble";
const SECONDARY_ADMIN = "Ameny Ronald";

let user = null;
let data = {};

async function loadData() {
    try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {headers:{'X-Master-Key':MASTER_KEY}});
        const json = await res.json();
        data = json.record;
        // Initialize new fields if they don't exist
        if(!data.expenses) data.expenses = [];
        if(!data.investments) data.investments = [];
        
        if(data.logo) document.getElementById("logoSlot").innerHTML = `<img src="${data.logo}">`;
        render();
    } catch (e) { console.error("Sync Error"); }
}

async function saveData() {
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method:'PUT', headers:{'Content-Type':'application/json','X-Master-Key':MASTER_KEY},
        body: JSON.stringify(data)
    });
    render();
}

function getExpectedAmount(monthStr) {
    const date = new Date(monthStr + "-01");
    return date < new Date("2024-08-01") ? 80000 : 100000;
}

function calculateLateFee(monthStr, paidDateStr) {
    const dueDate = new Date(monthStr + "-10");
    const paidDate = new Date(paidDateStr);
    if (paidDate <= dueDate) return 0;
    const diffWeeks = Math.ceil(Math.abs(paidDate - dueDate) / (1000 * 60 * 60 * 24 * 7));
    return Math.min(diffWeeks * 5000, 15000);
}

function calculateLoanInterest(loan) {
    if(loan.type !== 'LOAN') return 0;
    const start = new Date(loan.date);
    const now = new Date();
    const months = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
    return months > 0 ? Math.round(loan.amt * 0.05 * months) : 0;
}

function render() {
    const app = document.getElementById("app");
    document.getElementById("userLabel").textContent = user ? `Member: ${user.name}` : "Portal Locked";
    app.innerHTML = "";

    if(!user) {
        let h = `<div class="card" style="text-align:center"><h2>Member Login</h2><div class="grid">`;
        data.members.forEach(m => h += `<button onclick="checkLogin('${m}')">${m}</button>`);
        app.innerHTML = h + `</div></div>`;
        return;
    }

    const isAdmin = user.name === PRIMARY_ADMIN || user.name === SECONDARY_ADMIN || data[user.name].isExtraAdmin;

    // --- CALCULATE GLOBAL TOTALS ---
    let totalSavings = 0, totalLateFees = 0, totalLoansOut = 0, totalInvested = 0, totalExpenses = 0;
    
    data.members.forEach(m => {
        data[m].contributions.forEach(c => {
            totalSavings += Number(c.amt);
            totalLateFees += calculateLateFee(c.month, c.date);
        });
        data[m].loans.forEach(l => totalLoansOut += Number(l.bal));
    });
    data.investments.forEach(i => totalInvested += Number(i.amt));
    data.expenses.forEach(e => totalExpenses += Number(e.amt));

    const availableCash = (totalSavings + totalLateFees) - (totalLoansOut + totalInvested + totalExpenses);

    // --- UI: TOP SUMMARY ---
    app.innerHTML += `
        <div class="card" style="background:#111; color:#fff">
            <h2>SACCO Treasury Overview</h2>
            <div class="grid">
                <div class="stat-box" style="color:#000">Available Cash:<br><strong style="font-size:1.4em">UGX ${availableCash.toLocaleString()}</strong></div>
                <div class="stat-box" style="color:#000">In Investments:<br><strong>UGX ${totalInvested.toLocaleString()}</strong></div>
                <div class="stat-box" style="color:#000">Active Loans:<br><strong>UGX ${totalLoansOut.toLocaleString()}</strong></div>
            </div>
        </div>`;

    // --- UI: PERSONAL CARD ---
    let mySavings = 0, myLoanPrin = 0, myInt = 0;
    data[user.name].contributions.forEach(c => mySavings += Number(c.amt));
    data[user.name].loans.forEach(l => { myLoanPrin += Number(l.bal); myInt += calculateLoanInterest(l); });
    const mPaid = data[user.name].membershipPaid ? "PAID" : "PENDING";

    app.innerHTML += `
        <div class="card" style="border-left:10px solid #B08D57">
            <h3>My Balances: ${user.name}</h3>
            <div class="grid">
                <div>Saved: <strong>UGX ${mySavings.toLocaleString()}</strong></div>
                <div>My Loan: <strong>UGX ${myLoanPrin.toLocaleString()}</strong></div>
                <div>Member Status: <span class="status ${mPaid==='PAID'?'paid':'pending'}">${mPaid}</span></div>
            </div>
            <hr>
            <button onclick="changePIN()" style="background:#444; font-size:11px">Change PIN</button>
            <button onclick="user=null; render()" style="background:#666; font-size:11px">Logout</button>
        </div>`;

    // --- UI: ADMIN HUB ---
    if(isAdmin) {
        app.innerHTML += `
            <div class="card" style="border:2px solid #B08D57">
                <h2>Admin Hub (Management)</h2>
                <div class="grid">
                    <div>
                        <h3>+ Expense / Investment</h3>
                        <select id="entryType">
                            <option value="EXPENSE">Expense (Costs)</option>
                            <option value="INVEST">Investment (Bonds/Trust)</option>
                        </select>
                        <input type="text" id="entryReason" placeholder="Reason/Description">
                        <input type="number" id="entryAmt" placeholder="Amount">
                        <input type="date" id="entryDate" value="${new Date().toISOString().split('T')[0]}">
                        <button class="gold" onclick="addGlobalEntry()">Record Outflow</button>
                    </div>
                    <div>
                        <h3>+ Member Entry</h3>
                        <select id="mC">${data.members.map(m=>`<option>${m}</option>`)}</select>
                        <input type="month" id="moC" value="${new Date().toISOString().slice(0,7)}">
                        <input type="number" id="aC" placeholder="Amount">
                        <button class="gold" onclick="addEntry('C')">Save Savings</button>
                        <hr>
                        <button class="gold" style="background:green" onclick="addEntry('R')">Record Repayment</button>
                    </div>
                </div>
            </div>`;
    }

    // --- UI: EXPENSES & INVESTMENTS TABLES (VISIBLE TO ALL) ---
    app.innerHTML += `
        <div class="grid">
            <div class="card">
                <h3>Investment Portfolio (Bonds/Unit Trust)</h3>
                <table><tr><th>Date</th><th>Description</th><th>Amount</th></tr>
                ${data.investments.map(i => `<tr><td>${i.date}</td><td>${i.reason}</td><td>${Number(i.amt).toLocaleString()}</td></tr>`).join('')}
                </table>
            </div>
            <div class="card">
                <h3>SACCO Expenses</h3>
                <table><tr><th>Date</th><th>Reason</th><th>Amount</th></tr>
                ${data.expenses.map(e => `<tr><td>${e.date}</td><td>${e.reason}</td><td>${Number(e.amt).toLocaleString()}</td></tr>`).join('')}
                </table>
            </div>
        </div>`;

    // --- ARREARS TABLE (Privacy Filter) ---
    let arrearsHtml = `<div class="card"><h2>Unpaid Arrears Tracking</h2><table><tr><th>Member</th><th>Month</th><th>Expected</th></tr>`;
    const start = new Date("2024-02-01");
    const end = new Date();
    const visibleMembers = isAdmin ? data.members : [user.name];
    visibleMembers.forEach(m => {
        let temp = new Date(start);
        while(temp <= end) {
            const mStr = temp.toISOString().slice(0,7);
            if(!data[m].contributions.find(c => c.month === mStr)) {
                arrearsHtml += `<tr><td>${m}</td><td>${mStr}</td><td>${getExpectedAmount(mStr).toLocaleString()}</td></tr>`;
            }
            temp.setMonth(temp.getMonth() + 1);
        }
    });
    app.innerHTML += arrearsHtml + `</table></div>`;
}

function addGlobalEntry() {
    const type = document.getElementById("entryType").value;
    const amt = document.getElementById("entryAmt").value;
    const reason = document.getElementById("entryReason").value;
    const date = document.getElementById("entryDate").value;
    
    if(!amt || !reason) return alert("Fill all fields");
    
    if(type === 'EXPENSE') data.expenses.push({amt, reason, date});
    else data.investments.push({amt, reason, date});
    
    saveData();
}

function checkLogin(n) {
    const p = prompt(`PIN for ${n}:`);
    if(p === data[n].pin) { user = { name:n }; render(); }
    else alert("Wrong PIN.");
}

function addEntry(type) {
    const m = document.getElementById("mC").value;
    const amt = Number(document.getElementById("aC").value);
    const date = new Date().toISOString().split('T')[0];
    if(type === 'C') {
        data[m].contributions.push({amt, date, month: document.getElementById("moC").value});
    } else {
        data[m].loans.push({amt, date, bal: -amt, type: 'REPAYMENT'});
    }
    saveData();
}

function changePIN() {
    const p = prompt("New 4-digit PIN:");
    if(p && p.length === 4) { data[user.name].pin = p; saveData(); alert("Success!"); }
}

loadData();
</script>
</body>
</html>
