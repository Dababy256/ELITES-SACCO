<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elites SACCO Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body{font-family: Arial, sans-serif; background:#F3E9D2; margin:0; color:#111}
    header{background:#111; color:#fff; padding:15px; display:flex; align-items:center; gap:12px; border-bottom:4px solid #B08D57}
    .container{padding:16px; max-width:1100px; margin:auto}
    .card{background:#fff; padding:20px; border-radius:12px; margin-bottom:16px; box-shadow:0 4px 10px rgba(0,0,0,0.1)}
    h2{margin-top:0; color:#111; border-bottom:2px solid #B08D57; padding-bottom:8px; display:flex; justify-content:space-between}
    table{width:100%; border-collapse:collapse; font-size:13px; margin-top:10px}
    th,td{border:1px solid #eee; padding:10px; text-align:left}
    th{background:#B08D57; color:#000}
    button{padding:10px 18px; border:none; border-radius:6px; background:#111; color:#fff; cursor:pointer; font-weight:bold}
    button.gold{background:#B08D57; color:#000}
    input,select{padding:10px; width:100%; margin-bottom:10px; border:1px solid #ccc; border-radius:8px}
    .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:15px}
    .status{padding:5px 12px; border-radius:20px; font-size:12px; font-weight:bold}
    .green{background:#27ae60; color:white}
    .red{background:#c0392b; color:white}
</style>
</head>
<body>

<header>
    <div style="flex-grow:1">
        <strong>ELITES SACCO</strong><br>
        <small id="userLabel">Loading Cloud Data...</small>
    </div>
    <span id="syncStatus" class="status red">OFFLINE</span>
</header>

<div class="container" id="app"></div>

<script>
/* ========= CONFIG - PASTE YOUR KEYS HERE ========= */
const BIN_ID = "6971f3eb43b1c97be94154dc"; 
const MASTER_KEY = "$2a$10$83AEiP9GsrLhSQIC8.nuW.6QtHG5XVzJElaL67zasDR0h8BYGLsQu";
const ADMIN_PIN = "1234";
const MEMBERS = ["Gerald", "Member 2", "Member 3", "Member 4", "Member 5"];

let user = null;
let data = {};

/* ========= CLOUD SYNC ========= */
async function loadData() {
    try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
            headers: { 'X-Master-Key': MASTER_KEY }
        });
        const json = await res.json();
        data = json.record;
        document.getElementById("syncStatus").textContent = "CLOUD LIVE";
        document.getElementById("syncStatus").className = "status green";
        render();
    } catch (e) {
        document.getElementById("syncStatus").textContent = "CONNECTION ERROR";
        alert("Check your Bin ID and Master Key!");
    }
}

async function saveData() {
    document.getElementById("syncStatus").textContent = "SAVING...";
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
        body: JSON.stringify(data)
    });
    document.getElementById("syncStatus").textContent = "CLOUD LIVE";
    render();
}

/* ========= ADMIN ACTIONS ========= */
function addContribution() {
    const p = prompt("Admin PIN:"); if(p !== ADMIN_PIN) return;
    const m = document.getElementById("mC").value;
    data[m].contributions.push({
        amt: Number(document.getElementById("aC").value),
        date: document.getElementById("dC").value,
        month: document.getElementById("moC").value
    });
    saveData();
}

function addLoan() {
    const p = prompt("Admin PIN:"); if(p !== ADMIN_PIN) return;
    const m = document.getElementById("mL").value;
    data[m].loans.push({
        amt: Number(document.getElementById("aL").value),
        date: document.getElementById("dL").value,
        bal: Number(document.getElementById("aL").value),
        type: "LOAN"
    });
    saveData();
}

function addRepayment() {
    const p = prompt("Admin PIN:"); if(p !== ADMIN_PIN) return;
    const m = document.getElementById("mR").value;
    data[m].loans.push({
        amt: Number(document.getElementById("aR").value),
        date: document.getElementById("dR").value,
        bal: -Number(document.getElementById("aR").value), // Negative reduces balance
        type: "REPAYMENT"
    });
    saveData();
}

function exportCSV() {
    let csv = "Member,Type,Amount,Date,Note\n";
    MEMBERS.forEach(m => {
        data[m].contributions.forEach(c => csv += `${m},Savings,${c.amt},${c.date},${c.month}\n`);
        data[m].loans.forEach(l => csv += `${m},${l.type},${l.amt},${l.date},Balance Effect: ${l.bal}\n`);
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Elites_SACCO_Full_Records.csv';
    a.click();
}

/* ========= UI ========= */
function render() {
    const app = document.getElementById("app");
    document.getElementById("userLabel").textContent = user ? `Logged in: ${user.name}` : "Portal Access";
    app.innerHTML = "";

    if(!user) {
        let h = `<div class="card" style="text-align:center"><h2>Select Your Name</h2><div class="grid">`;
        MEMBERS.forEach(m => h += `<button onclick="user={name:'${m}', role:'${m==='Gerald'?'admin':'member'}'}; render()">${m}</button>`);
        app.innerHTML = h + `</div></div>`;
        return;
    }

    // Totals
    let totalS = 0, totalL = 0;
    MEMBERS.forEach(m => {
        data[m].contributions.forEach(c => totalS += c.amt);
        data[m].loans.forEach(l => totalL += l.bal);
    });

    app.innerHTML += `
        <div class="grid">
            <div class="card">Total Saved<br><b style="font-size:1.4em">UGX ${totalS.toLocaleString()}</b></div>
            <div class="card">Active Loans<br><b style="font-size:1.4em; color:red">UGX ${totalL.toLocaleString()}</b></div>
            <div class="card">Available Cash<br><b style="font-size:1.4em; color:green">UGX ${(totalS - totalL).toLocaleString()}</b></div>
        </div>`;

    if(user.role === 'admin') {
        const adm = document.createElement("div");
        adm.className = "card";
        adm.style.border = "2px solid #B08D57";
        adm.innerHTML = `
            <h2>Admin Entry Hub <button onclick="exportCSV()">Export CSV</button></h2>
            <div class="grid">
                <div>
                    <strong>+ Contribution</strong>
                    <select id="mC">${MEMBERS.map(m=>`<option>${m}</option>`)}</select>
                    <input type="month" id="moC" value="${new Date().toISOString().slice(0,7)}">
                    <input type="date" id="dC" value="${new Date().toISOString().slice(0,10)}">
                    <input type="number" id="aC" placeholder="Amount">
                    <button class="gold" onclick="addContribution()">Save Savings</button>
                </div>
                <div>
                    <strong>+ New Loan</strong>
                    <select id="mL">${MEMBERS.map(m=>`<option>${m}</option>`)}</select>
                    <input type="date" id="dL" value="${new Date().toISOString().slice(0,10)}">
                    <input type="number" id="aL" placeholder="Loan Amount">
                    <button class="gold" onclick="addLoan()">Disburse Loan</button>
                </div>
                <div>
                    <strong>+ Loan Repayment</strong>
                    <select id="mR">${MEMBERS.map(m=>`<option>${m}</option>`)}</select>
                    <input type="date" id="dR" value="${new Date().toISOString().slice(0,10)}">
                    <input type="number" id="aR" placeholder="Repayment Amount">
                    <button class="gold" onclick="addRepayment()">Record Repayment</button>
                </div>
            </div>
            <button onclick="user=null; render()" style="margin-top:15px; background:#666">Logout</button>
        `;
        app.appendChild(adm);
    }

    // Ledger
    let table = `<div class="card"><h2>Global SACCO Ledger</h2><table>
        <tr><th>Member</th><th>Activity</th><th>Amount</th><th>Date</th></tr>`;
    MEMBERS.forEach(m => {
        data[m].contributions.forEach(c => table += `<tr><td>${m}</td><td>Savings</td><td>${c.amt.toLocaleString()}</td><td>${c.date}</td></tr>`);
        data[m].loans.forEach(l => table += `<tr style="color:${l.type==='LOAN'?'red':'green'}"><td>${m}</td><td>${l.type}</td><td>${l.amt.toLocaleString()}</td><td>${l.date}</td></tr>`);
    });
    app.innerHTML += table + `</table></div>`;
}

loadData();
</script>
</body>
</html>
