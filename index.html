<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elites SACCO Master</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body{font-family:'Segoe UI', sans-serif; background:#F3E9D2; margin:0; color:#111}
    header{background:#111; color:#fff; padding:15px; display:flex; align-items:center; gap:12px; border-bottom:4px solid #B08D57}
    #logoSlot img{height:55px; width:55px; border-radius:50%; border:2px solid #B08D57; background:#fff; object-fit:cover}
    .container{padding:16px; max-width:1100px; margin:auto}
    .card{background:#fff; padding:20px; border-radius:12px; margin-bottom:16px; box-shadow:0 4px 10px rgba(0,0,0,0.1)}
    h2{margin-top:0; color:#111; border-bottom:2px solid #B08D57; padding-bottom:8px}
    table{width:100%; border-collapse:collapse; font-size:12px}
    th,td{border:1px solid #eee; padding:10px; text-align:left}
    th{background:#B08D57; color:#000}
    button{padding:10px 18px; border:none; border-radius:6px; background:#111; color:#fff; cursor:pointer; font-weight:bold; margin:2px}
    button.gold{background:#B08D57; color:#000}
    input,select{padding:10px; width:100%; margin-bottom:10px; border:1px solid #ccc; border-radius:8px}
    .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:15px}
    .status{padding:4px 10px; border-radius:4px; font-size:11px; font-weight:bold}
    .paid{background:#d4edda; color:#155724}
    .pending{background:#f8d7da; color:#721c24}
    .report-area{background:#eee; padding:15px; border-radius:8px; white-space:pre-wrap; font-family:monospace; margin-top:10px; display:none}
</style>
</head>
<body>

<header>
    <div id="logoSlot"></div>
    <div style="flex-grow:1"><strong>ELITES SACCO</strong><br><small id="userLabel">Synchronizing System...</small></div>
</header>

<div class="container" id="app"></div>

<script>
const BIN_ID = "6971f3eb43b1c97be94154dc"; 
const MASTER_KEY = "$2a$10$83AEiP9GsrLhSQIC8.nuW.6QtHG5XVzJElaL67zasDR0h8BYGLsQu";
const PRIMARY_ADMIN = "Apule Gerald Humble";
const SECONDARY_ADMIN = "Ameny Ronald";

let user = null;
let data = {};

async function loadData() {
    try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {headers:{'X-Master-Key':MASTER_KEY}});
        const json = await res.json();
        data = json.record;
        if(data.logo) document.getElementById("logoSlot").innerHTML = `<img src="${data.logo}">`;
        render();
    } catch (e) { console.error("Sync Error"); }
}

async function saveData() {
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method:'PUT', headers:{'Content-Type':'application/json','X-Master-Key':MASTER_KEY},
        body: JSON.stringify(data)
    });
    render();
}

function getExpectedAmount(monthStr) {
    const date = new Date(monthStr + "-01");
    return date < new Date("2024-08-01") ? 80000 : 100000;
}

function calculateLateFee(monthStr, paidDateStr) {
    const dueDate = new Date(monthStr + "-10");
    const paidDate = new Date(paidDateStr);
    if (paidDate <= dueDate) return 0;
    const diffWeeks = Math.ceil(Math.abs(paidDate - dueDate) / (1000 * 60 * 60 * 24 * 7));
    return Math.min(diffWeeks * 5000, 15000);
}

function calculateLoanInterest(loan) {
    if(loan.type !== 'LOAN') return 0;
    const start = new Date(loan.date);
    const now = new Date();
    const months = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
    return months > 0 ? Math.round(loan.amt * 0.05 * months) : 0;
}

function render() {
    const app = document.getElementById("app");
    document.getElementById("userLabel").textContent = user ? `Member: ${user.name}` : "Portal Locked";
    app.innerHTML = "";

    if(!user) {
        let h = `<div class="card" style="text-align:center"><h2>Member Login</h2><div class="grid">`;
        data.members.forEach(m => h += `<button onclick="checkLogin('${m}')">${m}</button>`);
        app.innerHTML = h + `</div></div>`;
        return;
    }

    // Role check: Admin or secondary admin or specially granted
    const isAdmin = user.name === PRIMARY_ADMIN || user.name === SECONDARY_ADMIN || data[user.name].isExtraAdmin;

    // Individual Balance Card
    let mySavings = 0, myLoanPrin = 0, myInt = 0;
    data[user.name].contributions.forEach(c => mySavings += Number(c.amt));
    data[user.name].loans.forEach(l => {
        myLoanPrin += Number(l.bal);
        myInt += calculateLoanInterest(l);
    });
    const mPaid = data[user.name].membershipPaid ? "PAID" : "PENDING";

    app.innerHTML += `
        <div class="card" style="background:#FFFDE7; border-left:10px solid #B08D57">
            <h3>My Balances: ${user.name} ${isAdmin ? '(Admin)' : ''}</h3>
            <div class="grid">
                <div>Saved: <strong>UGX ${mySavings.toLocaleString()}</strong></div>
                <div>Loan Principal: <strong>UGX ${myLoanPrin.toLocaleString()}</strong></div>
                <div>Loan Interest (5%): <strong style="color:red">UGX ${myInt.toLocaleString()}</strong></div>
            </div>
            <div class="status ${mPaid==='PAID'?'paid':'pending'}" style="margin-top:10px; display:inline-block">Membership Fee: ${mPaid}</div>
            <hr>
            <button onclick="changePIN()" style="background:#444; font-size:11px">Change PIN</button>
            <button onclick="user=null; render()" style="background:#666; font-size:11px">Logout</button>
        </div>`;

    if(isAdmin) {
        app.innerHTML += `
            <div class="card" style="border:2px solid #B08D57">
                <h2>Admin Hub</h2>
                <div class="grid">
                    <div>
                        <h3>+ Entry</h3>
                        <select id="mC">${data.members.map(m=>`<option>${m}</option>`)}</select>
                        <input type="month" id="moC" value="${new Date().toISOString().slice(0,7)}">
                        <input type="date" id="dC" value="${new Date().toISOString().split('T')[0]}">
                        <input type="number" id="aC" placeholder="Amount">
                        <button class="gold" onclick="addEntry('C')">Save Savings</button>
                    </div>
                    <div>
                        <h3>+ Loans</h3>
                        <select id="mL">${data.members.map(m=>`<option>${m}</option>`)}</select>
                        <input type="date" id="dL" value="${new Date().toISOString().split('T')[0]}">
                        <input type="number" id="aL" placeholder="Amount">
                        <button class="gold" onclick="addEntry('L')">Give Loan</button>
                        <button class="gold" style="background:green" onclick="addEntry('R')">Repayment</button>
                    </div>
                    <div>
                        <h3>Management</h3>
                        <input type="month" id="repMonth">
                        <button class="gold" onclick="generateReport()">Monthly Report</button>
                        <hr>
                        <select id="mM">${data.members.map(m=>`<option>${m}</option>`)}</select>
                        <button class="gold" style="font-size:10px" onclick="toggleMembership()">Toggle Membership</button>
                        <button class="gold" style="font-size:10px; background:#444; color:#fff" onclick="toggleExtraAdmin()">Grant/Revoke Admin</button>
                        <input type="file" onchange="handleLogo(event)" style="margin-top:5px">
                    </div>
                </div>
                <div id="reportOutput" class="report-area"></div>
            </div>`;
    }

    // ARREARS TABLE (Privacy Filter Applied Here)
    let arrearsHtml = `<div class="card"><h2>Unpaid Arrears (Since Feb 2024)</h2><table>
        <tr><th>Member</th><th>Month</th><th>Expected</th><th>Status</th></tr>`;
    const start = new Date("2024-02-01");
    const end = new Date();
    
    // Logic: If Admin, show everyone. If Member, only show self.
    const visibleMembers = isAdmin ? data.members : [user.name];

    visibleMembers.forEach(m => {
        let temp = new Date(start);
        while(temp <= end) {
            const mStr = temp.toISOString().slice(0,7);
            if(!data[m].contributions.find(c => c.month === mStr)) {
                arrearsHtml += `<tr><td>${m}</td><td>${mStr}</td><td>${getExpectedAmount(mStr).toLocaleString()}</td><td><span class="status pending">PENDING</span></td></tr>`;
            }
            temp.setMonth(temp.getMonth() + 1);
        }
    });
    app.innerHTML += arrearsHtml + `</table></div>`;

    // GLOBAL HISTORY (Privacy Filter Applied Here)
    let table = `<div class="card"><h2>Transaction Ledger</h2><table>
        <tr><th>Member</th><th>Type</th><th>Amount</th><th>Late Fee</th><th>Date</th></tr>`;
    
    visibleMembers.forEach(m => {
        data[m].contributions.forEach(c => {
            const fee = calculateLateFee(c.month, c.date);
            table += `<tr><td>${m}</td><td>Savings (${c.month})</td><td>${c.amt.toLocaleString()}</td><td>${fee > 0 ? 'UGX '+fee.toLocaleString() : '-'}</td><td>${c.date}</td></tr>`;
        });
        data[m].loans.forEach(l => {
            table += `<tr style="color:${l.bal < 0 ? 'green':'red'}"><td>${m}</td><td>${l.type}</td><td>${l.amt.toLocaleString()}</td><td>-</td><td>${l.date}</td></tr>`;
        });
    });
    app.innerHTML += table + `</table></div>`;
}

function checkLogin(n) {
    const p = prompt(`PIN for ${n}:`);
    if(p === data[n].pin) { user = { name:n }; render(); }
    else alert("Wrong PIN.");
}

function addEntry(type) {
    if(type === 'C') {
        const m = document.getElementById("mC").value;
        data[m].contributions.push({amt: Number(document.getElementById("aC").value), date: document.getElementById("dC").value, month: document.getElementById("moC").value});
    } else {
        const m = document.getElementById("mL").value;
        const amt = Number(document.getElementById("aL").value);
        const date = document.getElementById("dL").value;
        data[m].loans.push({amt, date, bal: type==='L'?amt:-amt, type: type==='L'?'LOAN':'REPAYMENT'});
    }
    saveData();
}

function generateReport() {
    const month = document.getElementById("repMonth").value;
    if(!month) return alert("Select month");
    let report = `ELITES SACCO REPORT: ${month}\n\n`;
    data.members.forEach(m => {
        const record = data[m].contributions.find(c => c.month === month);
        report += `${m}: ${record ? 'PAID UGX '+record.amt.toLocaleString() : 'PENDING'}\n`;
    });
    const area = document.getElementById("reportOutput");
    area.textContent = report; area.style.display = "block";
}

function toggleMembership() {
    const m = document.getElementById("mM").value;
    data[m].membershipPaid = !data[m].membershipPaid;
    saveData();
}

function toggleExtraAdmin() {
    const m = document.getElementById("mM").value;
    if(m === PRIMARY_ADMIN) return alert("Cannot revoke primary admin.");
    data[m].isExtraAdmin = !data[m].isExtraAdmin;
    saveData();
    alert(`Admin rights for ${m} updated.`);
}

function changePIN() {
    const p = prompt("New 4-digit PIN:");
    if(p && p.length === 4) { data[user.name].pin = p; saveData(); alert("Success!"); }
}

function handleLogo(e) {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 120; canvas.height = 120;
            canvas.getContext('2d').drawImage(img,0,0,120,120);
            data.logo = canvas.toDataURL('image/jpeg', 0.7);
            saveData();
        };
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
}

loadData();
</script>
</body>
</html>
