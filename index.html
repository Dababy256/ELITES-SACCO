<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elites SACCO Final Master</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body{font-family:'Segoe UI', sans-serif; background:#F3E9D2; margin:0; color:#111}
    header{background:#111; color:#fff; padding:15px; display:flex; align-items:center; gap:12px; border-bottom:4px solid #B08D57}
    #logoSlot img{height:55px; width:55px; border-radius:50%; border:2px solid #B08D57; background:#fff; object-fit:cover}
    .container{padding:16px; max-width:1100px; margin:auto}
    .card{background:#fff; padding:20px; border-radius:12px; margin-bottom:16px; box-shadow:0 4px 10px rgba(0,0,0,0.1)}
    h2{margin-top:0; color:#111; border-bottom:2px solid #B08D57; padding-bottom:8px}
    table{width:100%; border-collapse:collapse; font-size:12px; margin-bottom:15px}
    th,td{border:1px solid #eee; padding:10px; text-align:left}
    th{background:#B08D57; color:#000}
    button{padding:8px 12px; border:none; border-radius:6px; background:#111; color:#fff; cursor:pointer; font-weight:bold; margin:2px}
    button.gold{background:#B08D57; color:#000}
    button.del{background:#ff4d4d; color:white; padding:4px 8px; font-size:10px}
    input,select{padding:10px; width:100%; margin-bottom:10px; border:1px solid #ccc; border-radius:8px}
    .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px}
    .stat-box{padding:12px; border-radius:8px; background:#f9f9f9; border:1px solid #ddd; color:#111}
    .status-cleared{color:#2E7D32; font-weight:bold}
    .status-partial{color:#EF6C00; font-weight:bold}
    .status-pending{color:#C62828; font-weight:bold}
    .arrears-banner{background:#FFF3E0; border:2px solid #FF9800; padding:15px; border-radius:8px; margin-bottom:15px}
</style>
</head>
<body>

<header>
    <div id="logoSlot"></div>
    <div style="flex-grow:1"><strong>ELITES SACCO</strong><br><small id="userLabel">Synchronizing...</small></div>
</header>

<div class="container" id="app"></div>

<script>
const BIN_ID = "6971f3eb43b1c97be94154dc"; 
const MASTER_KEY = "$2a$10$83AEiP9GsrLhSQIC8.nuW.6QtHG5XVzJElaL67zasDR0h8BYGLsQu";
const PRIMARY_ADMIN = "Apule Gerald Humble";
const SECONDARY_ADMIN = "Ameny Ronald";

let user = null;
let data = {};
let lastSelectedMember = null;

async function loadData() {
    try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {headers:{'X-Master-Key':MASTER_KEY}});
        const json = await res.json();
        data = json.record;
        if(data.logo) document.getElementById("logoSlot").innerHTML = `<img src="${data.logo}">`;
        render();
    } catch (e) { console.error("Sync Error"); }
}

async function saveData() {
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method:'PUT', headers:{'Content-Type':'application/json','X-Master-Key':MASTER_KEY},
        body: JSON.stringify(data)
    });
    render();
}

function getExpectedBase(monthStr) {
    return (new Date(monthStr + "-01") < new Date("2024-08-01")) ? 80000 : 100000;
}

function render() {
    const app = document.getElementById("app");
    if(!user) {
        let h = `<div class="card" style="text-align:center"><h2>Login</h2><div class="grid">`;
        data.members.forEach(m => h += `<button onclick="checkLogin('${m}')">${m}</button>`);
        app.innerHTML = h + `</div></div>`;
        return;
    }

    const isAdmin = user.name === PRIMARY_ADMIN || user.name === SECONDARY_ADMIN;
    const target = isAdmin ? document.getElementById("viewMem")?.value || user.name : user.name;
    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];

    // FINANCE TOTALS
    let tSav = 0, tRepay = 0, tDisbursed = 0, tInv = 0, tExp = 0;
    data.members.forEach(m => {
        data[m].contributions.forEach(c => tSav += Number(c.amt));
        data[m].loans.forEach(l => {
            if(l.type === 'LOAN') tDisbursed += Number(l.amt);
            if(l.type === 'REPAYMENT') tRepay += Number(l.amt);
        });
    });
    data.investments.forEach(i => tInv += Number(i.amt));
    data.expenses.forEach(e => tExp += Number(e.amt));

    // LOAN BALANCE LOGIC (CAPPED AT 0)
    let myLoans = data[target].loans.filter(l => l.type === 'LOAN');
    let myRepays = data[target].loans.filter(l => l.type === 'REPAYMENT');
    let totalOutstanding = 0;

    myLoans.forEach((loan, index) => {
        let loanId = index + 1;
        let paidForThisLoan = myRepays.filter(r => r.loanId == loanId).reduce((a,b) => a + Number(b.amt), 0);
        let bal = Number(loan.amt) - paidForThisLoan;
        if(bal > 0) totalOutstanding += bal;
    });

    // SAVINGS PENDING LOGIC (LOCKED)
    let livePending = 0;
    let loopD = new Date("2024-02-01");
    while(loopD <= today) {
        let mS = loopD.toISOString().slice(0,7);
        let paid = data[target].contributions.find(c => c.month === mS);
        let base = getExpectedBase(mS);
        if(!paid) {
            livePending += base;
            let d10 = new Date(mS + "-10");
            if(today > d10) livePending += Math.min(Math.ceil((today-d10)/(1000*60*60*24*7))*5000, 15000);
        } else if(Number(paid.amt) < base) {
            livePending += (base - Number(paid.amt));
        }
        loopD.setMonth(loopD.getMonth() + 1);
    }

    app.innerHTML = `
        <div class="card" style="background:#111; color:#fff">
            <h2>CASH AT HAND: UGX ${(tSav + tRepay - (tDisbursed + tInv + tExp)).toLocaleString()}</h2>
            <div class="grid">
                <div class="stat-box">SACCO Savings: ${tSav.toLocaleString()}</div>
                <div class="stat-box">Total Interest/Repays: ${tRepay.toLocaleString()}</div>
                <div class="stat-box">Total Loans Out: ${(tDisbursed - tRepay < 0 ? 0 : tDisbursed - tRepay).toLocaleString()}</div>
            </div>
        </div>

        <div class="arrears-banner">
            <h3>Dashboard: ${target}</h3>
            <div class="grid">
                <div class="stat-box" style="background:#E8F5E9"><strong>Total Saved:</strong><br>UGX ${data[target].contributions.reduce((a,b)=>a+Number(b.amt),0).toLocaleString()}</div>
                <div class="stat-box" style="background:#FFEBEE"><strong>Pending Savings:</strong><br>UGX ${livePending.toLocaleString()}</div>
                <div class="stat-box" style="background:#E3F2FD"><strong>Loan Balance:</strong><br>UGX ${totalOutstanding.toLocaleString()}</div>
            </div>
            <div style="margin-top:10px">
                <button onclick="changePIN()">Change PIN</button>
                <button onclick="user=null;render()">Logout</button>
            </div>
        </div>`;

    if(isAdmin) {
        app.innerHTML += `
        <div class="card" style="border:2px solid #B08D57">
            <h2>Admin Entry Hub</h2>
            <div class="grid">
                <div>
                    <h3>Inflow</h3>
                    <select id="mI" onchange="lastSelectedMember=this.value; render()">
                        ${data.members.map(m => `<option value="${m}" ${m === (lastSelectedMember || target) ? 'selected' : ''}>${m}</option>`).join('')}
                    </select>
                    <select id="tI" onchange="render()"><option value="S">Monthly Savings</option><option value="R">Loan Repayment</option></select>
                    ${document.getElementById("tI")?.value === 'R' ? `
                        <select id="lID">
                            ${data[lastSelectedMember || target].loans.filter(l=>l.type==='LOAN').map((l,i)=>`<option value="${i+1}">Loan ${i+1} (UGX ${l.amt})</option>`).join('')}
                        </select>` : `<input type="month" id="moI" value="2024-02">`}
                    <input type="date" id="daI" placeholder="Date">
                    <input type="number" id="amI" placeholder="Amount">
                    <button class="gold" onclick="postInflow()">Post Inflow</button>
                </div>
                <div>
                    <h3>Outflow</h3>
                    <select id="tO"><option value="L">Loan Disbursement</option><option value="E">Expense</option><option value="I">Invest</option></select>
                    <input type="date" id="daO" value="${todayStr}">
                    <input type="text" id="reO" placeholder="Note">
                    <input type="number" id="amO" placeholder="Amount">
                    <button class="gold" onclick="postOutflow()">Post Outflow</button>
                </div>
            </div>
        </div>`;
    }

    // SAVINGS TABLE (LOCKED)
    let sHTML = `<div class="card"><h2>Savings Clearance</h2>
        ${isAdmin ? `<select id="viewMem" onchange="render()">${data.members.map(m => `<option ${m===target?'selected':''}>${m}</option>`)}</select>` : ''}
        <table><tr><th>Month</th><th>Status</th><th>Paid</th></tr>`;
    let rd = new Date("2024-02-01");
    while(rd <= today) {
        let mS = rd.toISOString().slice(0,7), paid = data[target].contributions.find(c => c.month === mS);
        let status = paid ? (Number(paid.amt) >= getExpectedBase(mS) ? 'CLEARED' : 'PARTIAL') : 'PENDING';
        let cls = paid ? (Number(paid.amt) >= getExpectedBase(mS) ? 'status-cleared' : 'status-partial') : 'status-pending';
        sHTML += `<tr><td>${mS}</td><td class="${cls}">${status}</td><td>${paid?paid.amt:'-'}</td></tr>`;
        rd.setMonth(rd.getMonth() + 1);
    }
    
    // LOAN HISTORY (NEW 3-TIER STATUS)
    let lHTML = `<h2>Loan Tracker</h2><table><tr><th>ID</th><th>Principal</th><th>Repaid</th><th>Balance</th><th>Status</th></tr>`;
    myLoans.forEach((loan, i) => {
        let id = i + 1;
        let repaid = myRepays.filter(r => r.loanId == id).reduce((a,b) => a + Number(b.amt), 0);
        let bal = Number(loan.amt) - repaid;
        let status = bal <= 0 ? "PAID" : (repaid > 0 ? "PARTIAL" : "UNPAID");
        let cls = bal <= 0 ? "status-cleared" : (repaid > 0 ? "status-partial" : "status-pending");
        lHTML += `<tr><td>Loan ${id}</td><td>${Number(loan.amt).toLocaleString()}</td><td>${repaid.toLocaleString()}</td><td>${(bal < 0 ? 0 : bal).toLocaleString()}</td><td class="${cls}">${status}</td></tr>`;
    });
    app.innerHTML += sHTML + `</table>` + lHTML + `</table></div>`;
}

function postInflow() {
    const m = document.getElementById("mI").value, t = document.getElementById("tI").value, amt = Number(document.getElementById("amI").value);
    let date = document.getElementById("daI").value || new Date().toISOString().split('T')[0];
    lastSelectedMember = m;
    if(t === 'S') {
        const mon = document.getElementById("moI").value;
        data[m].contributions.push({amt, date, month:mon});
        let dObj = new Date(mon + "-01"); dObj.setMonth(dObj.getMonth() + 1);
        saveData().then(() => { if(document.getElementById("moI")) document.getElementById("moI").value = dObj.toISOString().slice(0,7); });
    } else {
        const lId = document.getElementById("lID").value;
        data[m].loans.push({amt, date, type:'REPAYMENT', loanId: lId});
        saveData();
    }
}

function postOutflow() {
    const t = document.getElementById("tO").value, amt = Number(document.getElementById("amO").value), re = document.getElementById("reO").value, date = document.getElementById("daO").value;
    const m = document.getElementById("mI").value;
    if(t==='L') data[m].loans.push({amt, date, type:'LOAN'});
    else if(t==='E') data.expenses.push({amt, reason:re, date});
    else if(t==='I') data.investments.push({amt, reason:re, date});
    saveData();
}

function del(cat, mem, idx) { if(confirm("Delete?")){ if(cat==='S')data[mem].contributions.splice(idx,1); else data[mem].loans.splice(idx,1); saveData();}}
function changePIN() { let p = prompt("New 4-digit PIN:"); if(p && p.length===4){data[user.name].pin=p; saveData();} }
function checkLogin(n) { let p = prompt("PIN:"); if(p===data[n].pin){user={name:n};render();}else alert("Error"); }
function exportCSV() { let csv = "Date,Member,Type,Amt\n"; data.members.forEach(m=>{data[m].contributions.forEach(c=>csv+=`${c.date},${m},Savings,${c.amt}\n`); data[m].loans.forEach(l=>csv+=`${l.date},${m},${l.type},${l.amt}\n`);}); window.open('data:text/csv;charset=utf-8,' + encodeURI(csv)); }
loadData();
</script>
</body>
</html>
