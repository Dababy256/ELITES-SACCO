<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elites SACCO Final Master</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body{font-family:'Segoe UI', sans-serif; background:#F3E9D2; margin:0; color:#111}
    header{background:#111; color:#fff; padding:15px; display:flex; align-items:center; gap:12px; border-bottom:4px solid #B08D57}
    #logoSlot img{height:55px; width:55px; border-radius:50%; border:2px solid #B08D57; background:#fff; object-fit:cover}
    .container{padding:16px; max-width:1100px; margin:auto}
    .card{background:#fff; padding:20px; border-radius:12px; margin-bottom:16px; box-shadow:0 4px 10px rgba(0,0,0,0.1)}
    h2{margin-top:0; color:#111; border-bottom:2px solid #B08D57; padding-bottom:8px}
    table{width:100%; border-collapse:collapse; font-size:11px; margin-bottom:15px}
    th,td{border:1px solid #eee; padding:8px; text-align:left}
    th{background:#B08D57; color:#000}
    button{padding:8px 12px; border:none; border-radius:6px; background:#111; color:#fff; cursor:pointer; font-weight:bold; margin:2px}
    button.gold{background:#B08D57; color:#000}
    button.del{background:#ff4d4d; color:white; padding:2px 6px; font-size:10px; border-radius:4px}
    input,select{padding:10px; width:100%; margin-bottom:10px; border:1px solid #ccc; border-radius:8px}
    .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px}
    .stat-box{padding:12px; border-radius:8px; background:#f9f9f9; border:1px solid #ddd; color:#111}
    .badge{padding:2px 6px; border-radius:4px; font-size:10px; font-weight:bold}
    .badge-comp{background:#C8E6C9; color:#2E7D32}
    .badge-part{background:#FFF9C4; color:#F57F17}
</style>
</head>
<body>

<header>
    <div id="logoSlot"></div>
    <div style="flex-grow:1"><strong>ELITES SACCO</strong><br><small id="userLabel">Master System</small></div>
</header>

<div class="container" id="app"></div>

<script>
const BIN_ID = "6971f3eb43b1c97be94154dc"; 
const MASTER_KEY = "$2a$10$83AEiP9GsrLhSQIC8.nuW.6QtHG5XVzJElaL67zasDR0h8BYGLsQu";
const PRIMARY_ADMIN = "Apule Gerald Humble";
const SECONDARY_ADMIN = "Ameny Ronald";

let user = null;
let data = {};
let lastSelectedMember = null;
let currentInflowType = "S";

async function loadData() {
    try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {headers:{'X-Master-Key':MASTER_KEY}});
        const json = await res.json();
        data = json.record;
        if(!data.expenses) data.expenses = [];
        if(!data.investments) data.investments = [];
        if(data.logo) document.getElementById("logoSlot").innerHTML = `<img src="${data.logo}">`;
        render();
    } catch (e) { console.error("Sync Error"); }
}

async function saveData() {
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method:'PUT', headers:{'Content-Type':'application/json','X-Master-Key':MASTER_KEY},
        body: JSON.stringify(data)
    });
    render();
}

function getMonthlyTarget(monthStr) {
    const year = parseInt(monthStr.split('-')[0]);
    const month = parseInt(monthStr.split('-')[1]);
    if (year === 2024 && month >= 2 && month <= 7) return 80000;
    return 100000;
}

function render() {
    const app = document.getElementById("app");
    if(!user) {
        let h = `<div class="card" style="text-align:center"><h2>Login</h2><div class="grid">`;
        data.members.forEach(m => h += `<button onclick="checkLogin('${m}')">${m}</button>`);
        app.innerHTML = h + `</div></div>`;
        return;
    }

    const isAdmin = user.name === PRIMARY_ADMIN || user.name === SECONDARY_ADMIN;
    const target = user.name; 
    const activeMemberForAdmin = lastSelectedMember || target;

    // --- TREASURY MATH ---
    let grossSavingsTotal = 0, totalInterestEarned = 0, currentOutstandingLoans = 0, totalExpenses = 0, totalInvestments = 0;
    data.members.forEach(m => {
        data[m].contributions.forEach(c => grossSavingsTotal += Number(c.amt));
        let mLoans = data[m].loans.filter(l => l.type === 'LOAN');
        let mRepays = data[m].loans.filter(l => l.type === 'REPAYMENT');
        mLoans.forEach((loan, idx) => {
            let id = idx + 1;
            let principal = Number(loan.amt), paid = mRepays.filter(r => r.loanId == id).reduce((a, b) => a + Number(b.amt), 0);
            if((principal - paid) > 0) currentOutstandingLoans += (principal - paid);
            if(paid > principal) totalInterestEarned += (paid - principal);
        });
    });
    data.expenses.forEach(e => totalExpenses += Number(e.amt));
    data.investments.forEach(i => totalInvestments += Number(i.amt));
    let netCashResult = (grossSavingsTotal + totalInterestEarned) - (currentOutstandingLoans + totalExpenses + totalInvestments);

    // --- ARREARS ENGINE ---
    function calcArrears(mName) {
        let total = 0;
        const today = new Date();
        const currentMonthStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2,'0')}`;
        let checkY = 2024, checkM = 2;
        while (checkY < today.getFullYear() || (checkY === today.getFullYear() && checkM <= today.getMonth() + 1)) {
            let mStr = `${checkY}-${String(checkM).padStart(2,'0')}`;
            let targetAmt = getMonthlyTarget(mStr);
            let paid = data[mName].contributions.filter(c => c.month === mStr).reduce((a,b)=>a+Number(b.amt),0);
            if (paid < targetAmt) {
                let monthArrear = (targetAmt - paid);
                let penalty = 0;
                if (mStr !== currentMonthStr) penalty = 15000;
                else if (today.getDate() >= 10) {
                    let weeks = Math.floor((today.getDate() - 10) / 7) + 1;
                    penalty = Math.min(weeks * 5000, 15000);
                }
                total += (monthArrear + penalty);
            }
            checkM++; if(checkM > 12) { checkM = 1; checkY++; }
        }
        return total;
    }

    let myArrears = calcArrears(target);
    let myDebt = 0;
    data[target].loans.filter(l=>l.type==='LOAN').forEach((l, i) => {
        let paid = data[target].loans.filter(r => r.type==='REPAYMENT' && r.loanId == (i+1)).reduce((a,b)=>a+Number(b.amt),0);
        if((Number(l.amt)-paid) > 0) myDebt += (Number(l.amt)-paid);
    });

    let html = `
        <div class="card" style="background:#111; color:#fff">
            <h1 style="margin:0; color:#B08D57">NET CASH: UGX ${netCashResult.toLocaleString()}</h1>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between">
                <h3>My Account: ${target}</h3>
                <button class="gold" onclick="exportPersonal('${target}')">Export My Statement</button>
            </div>
            <div class="grid">
                <div class="stat-box"><strong>My Total Savings:</strong><br>${data[target].contributions.reduce((a,b)=>a+Number(b.amt),0).toLocaleString()}</div>
                <div class="stat-box" style="background:#FFEBEE"><strong>Active Loan Debt:</strong><br>${myDebt.toLocaleString()}</div>
                <div class="stat-box" style="background:#FFF9C4"><strong>Arrears + Fines:</strong><br>UGX ${myArrears.toLocaleString()}</div>
            </div>
        </div>`;

    if(isAdmin) {
        let nextL = data[activeMemberForAdmin].loans.filter(l => l.type === 'LOAN').length + 1;
        html += `
        <div class="card" style="border:2px solid #B08D57">
            <h2>Admin Hub</h2>
            <div class="grid">
                <div>
                    <h3>Inflow Management</h3>
                    <select id="mI" onchange="lastSelectedMember=this.value; render()">
                        ${data.members.map(m => `<option value="${m}" ${m === activeMemberForAdmin ? 'selected' : ''}>${m}</option>`).join('')}
                    </select>
                    <select id="tI" onchange="currentInflowType=this.value; render()">
                        <option value="S" ${currentInflowType==='S'?'selected':''}>Savings</option>
                        <option value="R" ${currentInflowType==='R'?'selected':''}>Repayment</option>
                    </select>
                    ${currentInflowType === 'R' ? `<select id="lID">${data[activeMemberForAdmin].loans.filter(l=>l.type==='LOAN').map((l,i)=>`<option value="${i+1}">Repay Loan ${i+1}</option>`).join('') || '<option disabled>No Loans</option>'}</select>` : `<input type="month" id="moI" value="2024-02">`}
                    <input type="number" id="amI" placeholder="Amount">
                    <button class="gold" onclick="postInflow()">Post Inflow</button>
                </div>
                <div>
                    <h3>Outflow Management</h3>
                    <select id="tO"><option value="L">Loan (ID: ${nextL})</option><option value="E">Expense</option><option value="I">Investment</option></select>
                    <input type="text" id="reO" placeholder="Description">
                    <input type="number" id="amO" placeholder="Amount">
                    <button class="gold" onclick="postOutflow()">Post Outflow</button>
                </div>
            </div>
            <hr>
            <h3>Reviewing Ledger for: ${activeMemberForAdmin}</h3>
            <div class="grid">
                <div class="stat-box">Arrears: ${calcArrears(activeMemberForAdmin).toLocaleString()}</div>
                <button class="gold" onclick="exportPersonal('${activeMemberForAdmin}')">Export ${activeMemberForAdmin}'s Ledger</button>
            </div>
        </div>`;
    }

    // --- SHARED TABLES FOR ALL ---
    let lCount = 0;
    html += `
        <div class="card">
            <h2>Personal Savings History</h2>
            <table>
                <tr><th>Month</th><th>Paid</th><th>Status</th></tr>
                ${data[target].contributions.map(c => {
                    let status = Number(c.amt) >= getMonthlyTarget(c.month) ? '<span class="badge badge-comp">COMPLETE</span>' : '<span class="badge badge-part">PARTIAL</span>';
                    return `<tr><td>${c.month}</td><td>${Number(c.amt).toLocaleString()}</td><td>${status}</td></tr>`;
                }).join('')}
            </table>
        </div>
        <div class="card">
            <h2>Loan & Repayment Ledger</h2>
            <table>
                ${data[target].loans.map(l => `<tr><td>${l.date}</td><td>${l.type}</td><td>${l.type==='LOAN'?'Loan '+(++lCount):'Repay L'+l.loanId}</td><td>${Number(l.amt).toLocaleString()}</td></tr>`).join('')}
            </table>
        </div>
        <div class="card">
            <h2>SACCO General Activity (Expenses & Investments)</h2>
            <table>
                <tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th></tr>
                ${data.expenses.map(e => `<tr><td>${e.date}</td><td>Expense</td><td>${e.reason}</td><td>${Number(e.amt).toLocaleString()}</td></tr>`).join('')}
                ${data.investments.map(i => `<tr><td>${i.date}</td><td>Investment</td><td>${i.reason}</td><td>${Number(i.amt).toLocaleString()}</td></tr>`).join('')}
            </table>
        </div>
        <button onclick="user=null;render()">Logout</button>`;

    app.innerHTML = html;
}

function postInflow() {
    const m = document.getElementById("mI").value, t = currentInflowType, amt = Number(document.getElementById("amI").value);
    const date = new Date().toISOString().split('T')[0];
    if(t === 'S') data[m].contributions.push({amt, date, month:document.getElementById("moI").value});
    else {
        const sel = document.getElementById("lID");
        if(sel && sel.value !== "none") data[m].loans.push({amt, date, type:'REPAYMENT', loanId: sel.options[sel.selectedIndex].text.replace('Repay Loan ','')});
    }
    saveData();
}

function postOutflow() {
    const t = document.getElementById("tO").value, amt = Number(document.getElementById("amO").value), m = document.getElementById("mI").value, desc = document.getElementById("reO").value;
    const date = new Date().toISOString().split('T')[0];
    if(t==='L') data[m].loans.push({amt, date, type:'LOAN'});
    else if(t==='E') data.expenses.push({amt, reason:desc, date});
    else if(t==='I') data.investments.push({amt, reason:desc, date});
    saveData();
}

function exportPersonal(name) {
    let csv = "Date,Type,Ref,Amount\n";
    data[name].contributions.forEach(c => csv += `${c.date},Savings,${c.month},${c.amt}\n`);
    data[name].loans.forEach(l => csv += `${l.date},${l.type},${l.type==='LOAN'?'Loan':'Repay L'+l.loanId},${l.amt}\n`);
    const blob = new Blob([csv], {type:'text/csv'});
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `${name}_Statement.csv`; a.click();
}

function checkLogin(n) { let p = prompt("PIN:"); if(p===data[n].pin){user={name:n};render();}else alert("Wrong PIN"); }
loadData();
</script>
</body>
</html>
