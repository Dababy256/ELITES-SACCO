<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elites SACCO Final Master</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body{font-family:'Segoe UI', sans-serif; background:#F3E9D2; margin:0; color:#111}
    header{background:#111; color:#fff; padding:15px; display:flex; align-items:center; gap:12px; border-bottom:4px solid #B08D57}
    #logoSlot img{height:55px; width:55px; border-radius:50%; border:2px solid #B08D57; background:#fff; object-fit:cover}
    .container{padding:16px; max-width:1100px; margin:auto}
    .card{background:#fff; padding:20px; border-radius:12px; margin-bottom:16px; box-shadow:0 4px 10px rgba(0,0,0,0.1)}
    h2{margin-top:0; color:#111; border-bottom:2px solid #B08D57; padding-bottom:8px}
    table{width:100%; border-collapse:collapse; font-size:12px}
    th,td{border:1px solid #eee; padding:10px; text-align:left}
    th{background:#B08D57; color:#000}
    button{padding:10px 18px; border:none; border-radius:6px; background:#111; color:#fff; cursor:pointer; font-weight:bold; margin:2px}
    button.gold{background:#B08D57; color:#000}
    input,select{padding:10px; width:100%; margin-bottom:10px; border:1px solid #ccc; border-radius:8px}
    .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:15px}
    .status{padding:4px 10px; border-radius:4px; font-size:11px; font-weight:bold}
    .paid{background:#d4edda; color:#155724}
    .pending{background:#f8d7da; color:#721c24}
    .stat-box{padding:15px; border-radius:8px; background:#f9f9f9; border:1px solid #ddd; color:#111}
</style>
</head>
<body>

<header>
    <div id="logoSlot"></div>
    <div style="flex-grow:1"><strong>ELITES SACCO</strong><br><small id="userLabel">Synchronizing...</small></div>
</header>

<div class="container" id="app"></div>

<script>
const BIN_ID = "6971f3eb43b1c97be94154dc"; 
const MASTER_KEY = "$2a$10$83AEiP9GsrLhSQIC8.nuW.6QtHG5XVzJElaL67zasDR0h8BYGLsQu";
const PRIMARY_ADMIN = "Apule Gerald Humble";
const SECONDARY_ADMIN = "Ameny Ronald";

let user = null;
let data = {};

async function loadData() {
    try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {headers:{'X-Master-Key':MASTER_KEY}});
        const json = await res.json();
        data = json.record;
        if(!data.expenses) data.expenses = [];
        if(!data.investments) data.investments = [];
        if(data.logo) document.getElementById("logoSlot").innerHTML = `<img src="${data.logo}">`;
        render();
    } catch (e) { console.error("Sync Error"); }
}

async function saveData() {
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method:'PUT', headers:{'Content-Type':'application/json','X-Master-Key':MASTER_KEY},
        body: JSON.stringify(data)
    });
    render();
}

function getExpectedAmount(monthStr) {
    const date = new Date(monthStr + "-01");
    return date < new Date("2024-08-01") ? 80000 : 100000;
}

function calculateLateFee(monthStr, paidDateStr) {
    const dueDate = new Date(monthStr + "-10");
    const paidDate = new Date(paidDateStr);
    if (paidDate <= dueDate) return 0;
    const diffWeeks = Math.ceil(Math.abs(paidDate - dueDate) / (1000 * 60 * 60 * 24 * 7));
    return Math.min(diffWeeks * 5000, 15000);
}

function render() {
    const app = document.getElementById("app");
    if(!user) {
        let h = `<div class="card" style="text-align:center"><h2>Login</h2><div class="grid">`;
        data.members.forEach(m => h += `<button onclick="checkLogin('${m}')">${m}</button>`);
        app.innerHTML = h + `</div></div>`;
        return;
    }

    const isAdmin = user.name === PRIMARY_ADMIN || user.name === SECONDARY_ADMIN || data[user.name].isExtraAdmin;

    // GLOBALS
    let totalSavings = 0, totalLateFees = 0, totalLoansOut = 0, totalInvested = 0, totalExpenses = 0;
    data.members.forEach(m => {
        data[m].contributions.forEach(c => { totalSavings += Number(c.amt); totalLateFees += calculateLateFee(c.month, c.date); });
        data[m].loans.forEach(l => totalLoansOut += Number(l.bal));
    });
    data.investments.forEach(i => totalInvested += Number(i.amt));
    data.expenses.forEach(e => totalExpenses += Number(e.amt));
    const availableCash = (totalSavings + totalLateFees) - (totalLoansOut + totalInvested + totalExpenses);

    app.innerHTML = `
        <div class="card" style="background:#111; color:#fff">
            <h2>Treasury: UGX ${availableCash.toLocaleString()} Available</h2>
            <div class="grid">
                <div class="stat-box">Invested: UGX ${totalInvested.toLocaleString()}</div>
                <div class="stat-box">Loans Out: UGX ${totalLoansOut.toLocaleString()}</div>
                <div class="stat-box">Expenses: UGX ${totalExpenses.toLocaleString()}</div>
            </div>
        </div>`;

    if(isAdmin) {
        app.innerHTML += `
            <div class="card" style="border:2px solid #B08D57">
                <h2>Admin Control</h2>
                <div class="grid">
                    <div>
                        <h3>+ Savings / Repayment</h3>
                        <select id="mC">${data.members.map(m=>`<option>${m}</option>`)}</select>
                        <input type="month" id="moC" value="${new Date().toISOString().slice(0,7)}">
                        <input type="number" id="aC" placeholder="Amount">
                        <button class="gold" onclick="addEntry('C')">Add Savings</button>
                        <button class="gold" style="background:green" onclick="addEntry('R')">Add Repayment</button>
                    </div>
                    <div>
                        <h3>+ Loan Disbursement</h3>
                        <select id="mL">${data.members.map(m=>`<option>${m}</option>`)}</select>
                        <input type="number" id="aL" placeholder="Loan Principal">
                        <input type="date" id="dL" value="${new Date().toISOString().split('T')[0]}">
                        <button class="gold" style="background:red" onclick="addEntry('L')">Disburse Loan</button>
                    </div>
                    <div>
                        <h3>+ Expense / Invest</h3>
                        <select id="gT"><option value="EXP">Expense</option><option value="INV">Investment</option></select>
                        <input type="text" id="gR" placeholder="Description">
                        <input type="number" id="gA" placeholder="Amount">
                        <button class="gold" onclick="addGlobal()">Save Outflow</button>
                    </div>
                </div>
            </div>`;
    }

    // LISTS
    app.innerHTML += `
        <div class="grid">
            <div class="card"><h3>Investments</h3><table>${data.investments.map(i=>`<tr><td>${i.reason}</td><td>${Number(i.amt).toLocaleString()}</td></tr>`).join('')}</table></div>
            <div class="card"><h3>Expenses</h3><table>${data.expenses.map(e=>`<tr><td>${e.reason}</td><td>${Number(e.amt).toLocaleString()}</td></tr>`).join('')}</table></div>
        </div>`;

    // ARREARS
    let arrH = `<div class="card"><h2>Unpaid Months (My View)</h2><table>`;
    const visible = isAdmin ? data.members : [user.name];
    visible.forEach(m => {
        let t = new Date("2024-02-01");
        while(t <= new Date()) {
            let s = t.toISOString().slice(0,7);
            if(!data[m].contributions.find(c=>c.month===s)) arrH += `<tr><td>${m}</td><td>${s}</td><td>${getExpectedAmount(s).toLocaleString()}</td></tr>`;
            t.setMonth(t.getMonth()+1);
        }
    });
    app.innerHTML += arrH + `</table></div><button onclick="user=null;render()">Logout</button>`;
}

function checkLogin(n) { const p = prompt(`PIN for ${n}:`); if(p===data[n].pin){user={name:n};render();}else alert("Error"); }

function addEntry(t) {
    const m = (t==='L') ? document.getElementById("mL").value : document.getElementById("mC").value;
    const a = Number((t==='L') ? document.getElementById("aL").value : document.getElementById("aC").value);
    const d = (t==='L') ? document.getElementById("dL").value : new Date().toISOString().split('T')[0];
    if(t==='C') data[m].contributions.push({amt:a, date:d, month:document.getElementById("moC").value});
    else data[m].loans.push({amt:a, date:d, bal: t==='L'?a:-a, type: t==='L'?'LOAN':'REPAYMENT'});
    saveData();
}

function addGlobal() {
    const t = document.getElementById("gT").value;
    const a = document.getElementById("gA").value;
    const r = document.getElementById("gR").value;
    if(t==='EXP') data.expenses.push({amt:a, reason:r, date:new Date()});
    else data.investments.push({amt:a, reason:r, date:new Date()});
    saveData();
}

loadData();
</script>
</body>
</html>
