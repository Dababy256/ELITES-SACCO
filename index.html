<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elites SACCO Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body{font-family:'Segoe UI', Arial, sans-serif; background:#F3E9D2; margin:0; color:#111}
    header{background:#111; color:#fff; padding:15px; display:flex; align-items:center; gap:12px; border-bottom:4px solid #B08D57}
    #logoContainer img{height:55px; width:55px; border-radius:50%; border:2px solid #B08D57; background:#fff; object-fit: cover}
    .container{padding:16px; max-width:1100px; margin:auto}
    .card{background:#fff; padding:20px; border-radius:12px; margin-bottom:16px; box-shadow:0 4px 10px rgba(0,0,0,0.1)}
    h2{margin-top:0; color:#111; border-bottom:2px solid #B08D57; padding-bottom:8px}
    table{width:100%; border-collapse:collapse; font-size:13px; margin-top:10px}
    th,td{border:1px solid #eee; padding:10px; text-align:left}
    th{background:#B08D57; color:#000}
    button{padding:10px 18px; border:none; border-radius:6px; background:#111; color:#fff; cursor:pointer; font-weight:bold}
    button.gold{background:#B08D57; color:#000}
    input,select{padding:10px; width:100%; margin-bottom:10px; border:1px solid #ccc; border-radius:8px}
    .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:15px}
    .status{padding:5px 12px; border-radius:20px; font-size:12px; font-weight:bold}
    .green{background:#27ae60; color:white}
    .red{background:#c0392b; color:white}
</style>
</head>
<body>

<header>
    <div id="logoContainer"></div>
    <div style="flex-grow:1">
        <strong>ELITES SACCO</strong><br>
        <small id="userLabel">Syncing Cloud...</small>
    </div>
    <span id="syncStatus" class="status red">OFFLINE</span>
</header>

<div class="container" id="app"></div>

<script>
const BIN_ID = "6971f3eb43b1c97be94154dc"; 
const MASTER_KEY = "$2a$10$83AEiP9GsrLhSQIC8.nuW.6QtHG5XVzJElaL67zasDR0h8BYGLsQu";

let user = null;
let data = {};

async function loadData() {
    try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
            headers: { 'X-Master-Key': MASTER_KEY }
        });
        const json = await res.json();
        data = json.record;
        
        // Safety check for members
        if(!data.members) data.members = ["Gerald", "Member 2", "Member 3", "Member 4", "Member 5"];
        data.members.forEach(m => {
            if(!data[m]) data[m] = {contributions:[], loans:[], pin: "1234"};
        });

        if(data.logo) {
            document.getElementById("logoContainer").innerHTML = `<img src="${data.logo}">`;
        }
        document.getElementById("syncStatus").textContent = "CLOUD LIVE";
        document.getElementById("syncStatus").className = "status green";
        render();
    } catch (e) { document.getElementById("syncStatus").textContent = "SYNC ERROR"; }
}

async function saveData() {
    document.getElementById("syncStatus").textContent = "SAVING...";
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
        body: JSON.stringify(data)
    });
    document.getElementById("syncStatus").textContent = "CLOUD LIVE";
    render();
}

function handleLogo(e) {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 120; canvas.height = 120; 
            ctx.drawImage(img, 0, 0, 120, 120);
            data.logo = canvas.toDataURL('image/jpeg', 0.8);
            saveData();
        };
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
}

function calculateInterest(loan) {
    if(loan.type !== 'LOAN') return 0;
    const startDate = new Date(loan.date);
    const today = new Date();
    const months = (today.getFullYear() - startDate.getFullYear()) * 12 + (today.getMonth() - startDate.getMonth());
    return months > 0 ? Math.round(loan.amt * 0.05 * months) : 0;
}

function render() {
    const app = document.getElementById("app");
    document.getElementById("userLabel").textContent = user ? `Member: ${user.name}` : "Security Portal";
    app.innerHTML = "";

    if(!user) {
        let h = `<div class="card" style="text-align:center"><h2>Member Login</h2><div class="grid">`;
        data.members.forEach(m => h += `<button style="padding:15px" onclick="checkLogin('${m}')">${m}</button>`);
        app.innerHTML = h + `</div></div>`;
        return;
    }

    // Member View: Interest Dashboard
    let mySavings = 0, myLoanPrin = 0, myInterest = 0;
    data[user.name].contributions.forEach(c => mySavings += Number(c.amt));
    data[user.name].loans.forEach(l => {
        myLoanPrin += Number(l.bal);
        myInterest += calculateInterest(l);
    });

    app.innerHTML += `
        <div class="card" style="background:#FFFDE7; border-left:10px solid #FBC02D">
            <h3>My Balances</h3>
            <div class="grid">
                <div>Total Savings:<br><strong>UGX ${mySavings.toLocaleString()}</strong></div>
                <div>Principal Loan:<br><strong>UGX ${myLoanPrin.toLocaleString()}</strong></div>
                <div>Accrued Interest (5%):<br><strong style="color:red">UGX ${myInterest.toLocaleString()}</strong></div>
            </div>
        </div>`;

    if(user.role === 'admin') {
        const adm = document.createElement("div");
        adm.className = "card";
        adm.style.border = "2px solid #B08D57";
        adm.innerHTML = `
            <h2>Admin Management</h2>
            <div class="grid">
                <div>
                    <h3>+ New Record</h3>
                    <select id="mC">${data.members.map(m=>`<option>${m}</option>`)}</select>
                    <input type="date" id="dC" value="${new Date().toISOString().split('T')[0]}">
                    <input type="number" id="aC" placeholder="Amount">
                    <button class="gold" onclick="addEntry('C')">Add Savings</button>
                    <hr>
                    <label>Upload Logo:</label><input type="file" accept="image/*" onchange="handleLogo(event)">
                </div>
                <div>
                    <h3>+ Loan & Repay</h3>
                    <select id="mL">${data.members.map(m=>`<option>${m}</option>`)}</select>
                    <input type="date" id="dL" value="${new Date().toISOString().split('T')[0]}">
                    <input type="number" id="aL" placeholder="Amount">
                    <button class="gold" onclick="addEntry('L')">Give Loan</button>
                    <button class="gold" style="background:green" onclick="addEntry('R')">Record Payback</button>
                </div>
            </div>
            <button onclick="user=null; render()" style="background:#666; margin-top:15px">Logout</button>
        `;
        app.appendChild(adm);
    }

    let table = `<div class="card"><h2>Global History</h2><table><tr><th>Member</th><th>Action</th><th>Amount</th><th>Date</th></tr>`;
    data.members.forEach(m => {
        data[m].contributions.forEach(c => table += `<tr><td>${m}</td><td>Savings</td><td>${c.amt.toLocaleString()}</td><td>${c.date}</td></tr>`);
        data[m].loans.forEach(l => table += `<tr style="color:${l.bal < 0 ? 'green':'red'}"><td>${m}</td><td>${l.type}</td><td>${l.amt.toLocaleString()}</td><td>${l.date}</td></tr>`);
    });
    app.innerHTML += table + `</table></div>`;
}

function checkLogin(name) {
    const pin = prompt(`Enter PIN for ${name}:`);
    if(pin === data[name].pin) {
        user = { name: name, role: name === "Gerald" ? "admin" : "member" };
        render();
    } else { alert("Wrong PIN."); }
}

function addEntry(type) {
    if(type==='C'){
        const m = document.getElementById("mC").value;
        data[m].contributions.push({amt: Number(document.getElementById("aC").value), date: document.getElementById("dC").value});
    } else {
        const m = document.getElementById("mL").value;
        const amt = Number(document.getElementById("aL").value);
        const date = document.getElementById("dL").value;
        const t = type === 'L' ? 'LOAN' : 'REPAYMENT';
        data[m].loans.push({amt, date, bal: type==='L'?amt:-amt, type: t});
    }
    saveData();
}

loadData();
</script>
</body>
</html>
