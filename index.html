<script>
// ─── CONFIG ───────────────────────────────────
const BIN_ID          = "6971f3eb43b1c97be94154dc";
const MASTER_KEY      = "$2a$10$83AEiP9GsrLhSQIC8.nuW.6QtHG5XVzJElaL67zasDR0h8BYGLsQu";
const PRIMARY_ADMIN   = "Apule Gerald Humble";
const SECONDARY_ADMIN = "Ameny Ronald";
const MAX_PHOTO_SIZE  = 60000; // ~60KB max base64 per photo

// ─── STATE ────────────────────────────────────
let user=null,data={},lastSelectedMember=null,currentInflowType="S",activeTab="dashboard",editModalData=null;
let reportMode="single",reportMonth="",reportStart="",reportEnd="";
let expandedMinutes={}; // track which minutes are expanded

// ─── DATA LAYER ───────────────────────────────
async function loadData(){
  try{
    const res=await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,{headers:{'X-Master-Key':MASTER_KEY}});
    const json=await res.json();
    data=json.record;
    const oN="OKULLO DAVID LAURENCE",nN="OKULLU DAVID LAURANCE";
    if(data[oN]){data[nN]=data[oN];delete data[oN];data.members=data.members.map(m=>m===oN?nN:m);}
    if(!data.expenses)    data.expenses=[];
    if(!data.investments) data.investments=[];
    if(!data.cashIn)      data.cashIn=[];
    if(!data.minutes)     data.minutes=[];
    if(!data.photos)      data.photos={};
    const now=new Date();
    reportMonth=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    reportStart="2024-02"; reportEnd=reportMonth;
    render();
  }catch(e){showToast("⚠️ Sync failed","danger");}
}
async function saveData(){
  try{
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{
      method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':MASTER_KEY},
      body:JSON.stringify(data)
    });
    showToast("✅ Saved","success"); render();
  }catch(e){showToast("❌ Save failed","danger");}
}

// ─── PHOTO HELPERS ────────────────────────────
// Compress image to canvas, return base64 JPEG under MAX_PHOTO_SIZE
function compressPhoto(file,cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=220; // max dimension px
      let w=img.width,h=img.height;
      if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      let quality=0.85;
      let b64=canvas.toDataURL('image/jpeg',quality);
      // reduce quality until under limit
      while(b64.length>MAX_PHOTO_SIZE&&quality>0.2){quality-=0.1;b64=canvas.toDataURL('image/jpeg',quality);}
      cb(b64);
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function getPhoto(mName){return(data.photos&&data.photos[mName])||null;}

function avatarHTML(mName,size=42,style=''){
  const ph=getPhoto(mName);
  if(ph) return`<div class="hdr-avatar" style="width:${size}px;height:${size}px;${style}"><img src="${ph}" alt="${mName}"></div>`;
  return`<div class="hdr-avatar" style="width:${size}px;height:${size}px;${style}">👤</div>`;
}

// ─── FINANCIAL CALCULATIONS ───────────────────
function getMonthlyTarget(ms){
  const y=parseInt(ms.split('-')[0]),m=parseInt(ms.split('-')[1]);
  return(y===2024&&m>=2&&m<=7)?80000:100000;
}

function calcArrearsAndFines(mName){
  let total=0;
  const today=new Date(),curMs=today.toISOString().slice(0,7);
  let cy=2024,cm=2;
  while(cy<today.getFullYear()||(cy===today.getFullYear()&&cm<=today.getMonth()+1)){
    const ms=`${cy}-${String(cm).padStart(2,'0')}`;
    const target=getMonthlyTarget(ms);
    const contribs=data[mName].contributions.filter(c=>c.month===ms);
    const paid=contribs.reduce((a,b)=>a+Number(b.amt),0);
    if(paid<target){
      let penalty=0;
      const onTime=contribs.some(c=>parseInt(c.date.split('-')[2])<=10);
      if(!onTime){
        if(ms!==curMs) penalty=15000;
        else if(today.getDate()>=10) penalty=Math.min((Math.floor((today.getDate()-10)/7)+1)*5000,15000);
      }
      total+=(target-paid)+penalty;
    }
    cm++;if(cm>12){cm=1;cy++;}
  }
  return total;
}

function calcLoanBalance(loan,loanId,mName){
  if(!loan||loan.type!=='LOAN')return null;
  const principal=Number(loan.amt);
  const issueDate=new Date(loan.date);
  const repayments=(data[mName].loans||[])
    .filter(r=>r.type==='REPAYMENT'&&String(r.loanId)===String(loanId))
    .map(r=>({date:new Date(r.date),amt:Number(r.amt)}))
    .sort((a,b)=>a.date-b.date);
  const totalRepaid=repayments.reduce((a,r)=>a+r.amt,0);
  const today=new Date(); today.setHours(23,59,59,999);
  // immediate 5% on issue
  let balance=principal*1.05;
  repayments.filter(r=>r.date<=issueDate).forEach(r=>{balance-=r.amt;});
  if(balance<=0){
    return{principal,outstanding:0,totalRepaid,interestCollected:Math.max(0,totalRepaid-principal),
           interestAccrued:Math.max(0,totalRepaid-principal),isFullyPaid:true,isOverdue:false,monthsElapsed:0};
  }
  let anniversaryNum=1;
  while(true){
    const anniv=new Date(issueDate);
    anniv.setMonth(anniv.getMonth()+anniversaryNum);
    if(anniv.getDate()!==issueDate.getDate()) anniv.setDate(0);
    if(anniv>today) break;
    const prevAnniv=new Date(issueDate);
    prevAnniv.setMonth(prevAnniv.getMonth()+(anniversaryNum-1));
    if(prevAnniv.getDate()!==issueDate.getDate()) prevAnniv.setDate(0);
    repayments.filter(r=>r.date>prevAnniv&&r.date<=anniv).forEach(r=>{balance-=r.amt;});
    if(balance<=0){balance=0;break;}
    balance*=1.05;
    anniversaryNum++;
  }
  const lastAnniv=new Date(issueDate);
  lastAnniv.setMonth(lastAnniv.getMonth()+(anniversaryNum-1));
  if(lastAnniv.getDate()!==issueDate.getDate()) lastAnniv.setDate(0);
  repayments.filter(r=>r.date>lastAnniv&&r.date<=today).forEach(r=>{balance-=r.amt;});
  if(balance<0)balance=0;
  const outstanding=Math.max(0,Math.round(balance));
  const isFullyPaid=outstanding===0&&totalRepaid>0;
  const monthsElapsed=anniversaryNum-1;
  const isOverdue=!isFullyPaid&&monthsElapsed>=1&&totalRepaid===0;
  const principalRepaid=Math.min(totalRepaid,principal);
  const interestCollected=Math.max(0,totalRepaid-principalRepaid);
  const interestAccrued=Math.max(0,Math.round(outstanding+totalRepaid-principal));
  return{principal,outstanding,totalRepaid,interestCollected,interestAccrued,isFullyPaid,isOverdue,monthsElapsed};
}

function getMemberLoanDebt(mName){
  return data[mName].loans.filter(l=>l.type==='LOAN')
    .reduce((s,loan,idx)=>{const b=calcLoanBalance(loan,idx+1,mName);return s+(b?b.outstanding:0);},0);
}

function getGlobalStats(){
  let grossSavings=0,interestCollected=0,activeLoanPrincipal=0;
  data.members.forEach(m=>{
    data[m].contributions.forEach(c=>grossSavings+=Number(c.amt));
    data[m].loans.filter(l=>l.type==='LOAN').forEach((loan,idx)=>{
      const bal=calcLoanBalance(loan,idx+1,m);
      if(!bal)return;
      const pr=Math.min(bal.totalRepaid,bal.principal);
      interestCollected+=Math.max(0,bal.totalRepaid-pr);
      activeLoanPrincipal+=Math.max(0,bal.principal-pr);
    });
  });
  const cashIn=data.cashIn.reduce((a,b)=>a+Number(b.amt),0);
  const expenses=data.expenses.reduce((a,b)=>a+Number(b.amt),0);
  const investments=data.investments.reduce((a,b)=>a+Number(b.amt),0);
  const netCash=(grossSavings+interestCollected+cashIn)-(expenses+activeLoanPrincipal+investments);
  return{grossSavings,interestCollected,cashIn,expenses,investments,activeLoanPrincipal,netCash};
}

function getMonthRange(s,e){
  const months=[];
  let[sy,sm]=[parseInt(s.split('-')[0]),parseInt(s.split('-')[1])-1];
  const[ey,em]=[parseInt(e.split('-')[0]),parseInt(e.split('-')[1])-1];
  while(sy<ey||(sy===ey&&sm<=em)){months.push(`${sy}-${String(sm+1).padStart(2,'0')}`);sm++;if(sm>11){sm=0;sy++;}}
  return months;
}

function getMemberShortfall(mName){return calcArrearsAndFines(mName);}

function buildReportData(months){
  let savingsInRange=0;
  const memberRows=data.members.map(m=>{
    const paid=months.reduce((a,ms)=>a+data[m].contributions.filter(c=>c.month===ms).reduce((x,y)=>x+Number(y.amt),0),0);
    savingsInRange+=paid;
    const expected=months.reduce((a,ms)=>a+getMonthlyTarget(ms),0);
    const trueShortfall=getMemberShortfall(m);
    const status=paid>=expected?'COMPLETE':paid>0?'PARTIAL':'PENDING';
    return{name:m,paid,expected,trueShortfall,status};
  });
  const S=getGlobalStats();
  const loanRows=[];
  data.members.forEach(m=>{
    data[m].loans.filter(l=>l.type==='LOAN').forEach((loan,idx)=>{
      const bal=calcLoanBalance(loan,idx+1,m);
      if(bal&&!bal.isFullyPaid) loanRows.push({member:m,loanId:idx+1,date:loan.date,...bal});
    });
  });
  return{S,memberRows,loanRows,savingsInRange,months};
}

function render(){

      {id:'monthly',label:'📅 Reports'}

  if      (activeTab==='dashboard')          html+=renderDashboard(isAdmin,activeMember);
  else if (activeTab==='ledger')             html+=renderLedger(isAdmin,activeMember);
  else if (activeTab==='activity')           html+=renderActivity();
  else if (activeTab==='minutes')            html+=renderMinutes(isAdmin);

  root.innerHTML=html;
}

function renderLoanCards(mName){
  const loans=data[mName].loans.filter(l=>l.type==='LOAN');

  loans.forEach((loan,idx)=>{

    const badge=bal.isFullyPaid?'<span class="badge badge-paid">✅ FULLY PAID</span>':bal.isOverdue?'<span class="badge badge-overdue">⚠️ OVERDUE</span>':'<span class="badge badge-active">Active</span>';
    html+=`<div class="loan-card ${cls}">

// ─── LEDGER ───────────────────────────────────
function renderLedger(isAdmin,activeMember){
  const now=new Date();let rows='';let cy=2024,cm=2;
  while(cy<now.getFullYear()||(cy===now.getFullYear()&&cm<=now.getMonth()+1)){
    const ms=`${cy}-${String(cm).padStart(2,'0')}`;
    const paid=data[activeMember].contributions.filter(c=>c.month===ms).reduce((a,b)=>a+Number(b.amt),0);
    const target=getMonthlyTarget(ms),gap=Math.max(0,target-paid);
    const today2=new Date(),curMs2=today2.toISOString().slice(0,7);
    const contribs=data[activeMember].contributions.filter(c=>c.month===ms);
    let penalty=0;
    if(gap>0){const onTime=contribs.some(c=>parseInt(c.date.split('-')[2])<=10);
      if(!onTime){if(ms!==curMs2)penalty=15000;else if(today2.getDate()>=10)penalty=Math.min((Math.floor((today2.getDate()-10)/7)+1)*5000,15000);}}
    const shortfall=gap+penalty;
    const badge=paid>=target?'<span class="badge badge-comp">COMPLETE</span>':paid>0?'<span class="badge badge-part">PARTIAL</span>':'<span class="badge badge-pend">PENDING</span>';
    rows+=`<tr><td>${ms}</td><td>UGX ${paid.toLocaleString()}</td><td>UGX ${target.toLocaleString()}</td><td>${badge}</td><td style="${shortfall>0?'color:var(--red);font-weight:700':'color:var(--green)'}">UGX ${shortfall.toLocaleString()}</td></tr>`;
    cm++;if(cm>12){cm=1;cy++;}
  }
  const loans=data[activeMember].loans.filter(l=>l.type==='LOAN');
  let picker='';
  if(isAdmin)picker=`<div class="card" style="border:2px solid var(--gold);padding:13px;margin-bottom:16px">
    <label style="font-size:13px;font-weight:700">👤 Admin: View Any Member's Ledger</label>
    <select style="margin-top:5px" onchange="lastSelectedMember=this.value;render()">
      ${data.members.map(m=>`<option value="${m}" ${m===activeMember?'selected':''}>${m}</option>`).join('')}
    </select></div>`;
  return`${picker}
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:7px">
        <h2 style="border:none;padding:0;margin:0">📒 Savings Timeline — ${activeMember}</h2>
        <div style="display:flex;gap:5px;flex-wrap:wrap">
          <button class="gold sm" onclick="exportMemberCSV('${activeMember}')">📥 CSV</button>
          <button class="print-btn sm" onclick="triggerMemberPrint('${activeMember}')">🖨️ Print My Ledger</button>
        </div>
      </div>
      <p style="font-size:11px;color:#888;margin-top:7px;margin-bottom:11px">Shortfall = unpaid savings gap + penalty charges for that month.</p>
      <div class="table-wrap"><table><tr><th>Month</th><th>Paid</th><th>Target</th><th>Status</th><th>Shortfall (incl. penalty)</th></tr>${rows}</table></div>
    </div>
    <div class="card"><h2>Loan & Repayment History — ${activeMember}</h2>
      ${!loans.length?'<p style="color:#999;font-size:13px">No loan records.</p>':''}
      <div class="table-wrap"><table>
        ${loans.length?'<tr><th>Date</th><th>Type</th><th>Ref</th><th>Amount</th><th>Outstanding</th></tr>':''}
        ${loans.map((l,i)=>{
          const lid=i+1,bal=calcLoanBalance(l,lid,activeMember);if(!bal)return'';
          return`<tr style="background:#E3F2FD;font-weight:600"><td>${l.date}</td><td>LOAN #${lid}</td><td>—</td><td>UGX ${Number(l.amt).toLocaleString()}</td><td style="color:${bal.isFullyPaid?'var(--green)':'var(--red)'};">${bal.isFullyPaid?'✅ CLEARED':'UGX '+bal.outstanding.toLocaleString()}</td></tr>`+
          data[activeMember].loans.filter(r=>r.type==='REPAYMENT'&&String(r.loanId)===String(lid)).map(r=>`<tr><td>${r.date}</td><td>REPAYMENT</td><td>Loan #${lid}</td><td style="color:var(--green)">UGX ${Number(r.amt).toLocaleString()}</td><td>—</td></tr>`).join('');
        }).join('')}
      </table></div>
    </div>`;
}

        <label>Meeting Date</label><input type="date" id="minDate" value="${new Date().toISOString().split('T')[0]}">
        <label>Minutes (type or paste full text)</label>
        <textarea id="minBody" placeholder="Type or paste the full meeting minutes here..."></textarea>
        <button class="gold full" onclick="addMinutes()">💾 Save Minutes</button>
      </div>
    </details>`;
  }
  if(!mins.length){html+=`<p style="color:#999;font-size:13px;padding:10px 0">No meeting minutes have been recorded yet.</p>`;
  }else{
    mins.forEach((m,i)=>{
      const key=`min_${i}`;
      const isOpen=expandedMinutes[key];
      html+=`<div class="minutes-card">
        <div class="minutes-header" onclick="toggleMinutes('${key}')">
          <div>
            <div style="font-size:13px;font-weight:700">${m.title}</div>
            <div style="font-size:11px;color:#888;font-weight:400;margin-top:2px">📅 ${m.date} &nbsp;·&nbsp; Added by admin</div>

            ${isAdmin?`<button class="del" onclick="event.stopPropagation();delMinutes(${i})">✕</button>`:''}

          </div>
        </div>
        <div class="minutes-body ${isOpen?'open':''}" id="${key}">${escapeHTML(m.body)}</div>
      </div>`;
    });
  }
  html+=`</div>`;
  return html;
}
function toggleMinutes(key){expandedMinutes[key]=!expandedMinutes[key];render();}
function escapeHTML(str){return(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function addMinutes(){
  const title=document.getElementById('minTitle').value.trim();
  const date=document.getElementById('minDate').value;
  const body=document.getElementById('minBody').value.trim();
  if(!title||!date||!body){showToast("⚠️ Fill in all fields","warn");return;}
  if(!data.minutes)data.minutes=[];
  data.minutes.push({title,date,body});
  saveData();
}
function delMinutes(idx){
  if(!confirm("Delete this minutes entry?"))return;
  data.minutes.splice(idx,1);
  saveData();
}

let _newMemberPhoto=null;
function previewNewMemberPhoto(e){
  const file=e.target.files[0];if(!file)return;
  compressPhoto(file,b64=>{
    _newMemberPhoto=b64;
    const prev=document.getElementById('newMPhotoPreview');
    if(prev)prev.innerHTML=`<img src="${b64}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
  });
}
function uploadMemberPhoto(e,mName){
  const file=e.target.files[0];if(!file)return;
  showToast("⏳ Compressing photo…","info");
  compressPhoto(file,b64=>{
    if(!data.photos)data.photos={};
    data.photos[mName]=b64;
    saveData();
  });
}
function addMember(){
  const name=document.getElementById('newMName').value.trim();
  const pin=document.getElementById('newMPin').value;
  if(!name){showToast("⚠️ Enter a full name","warn");return;}
  if(!pin||pin.length<4){showToast("⚠️ PIN must be at least 4 characters","warn");return;}
  if(data.members.includes(name)){showToast("⚠️ Member already exists","warn");return;}
  data.members.push(name);
  data[name]={pin,contributions:[],loans:[]};
  if(_newMemberPhoto){if(!data.photos)data.photos={};data.photos[name]=_newMemberPhoto;_newMemberPhoto=null;}
  saveData();
}
function removeMember(mName){
  if(!confirm(`Remove ${mName} from the SACCO?\n\nThis will delete all their savings, loan records and data. This CANNOT be undone.`))return;
  data.members=data.members.filter(m=>m!==mName);
  delete data[mName];
  if(data.photos)delete data.photos[mName];
  if(lastSelectedMember===mName)lastSelectedMember=null;
  saveData();
}
function resetMemberPin(mName){
  const np=prompt(`Set new PIN for ${mName} (min 4 characters):`);
  if(!np)return;
  if(np.length<4){showToast("⚠️ PIN must be at least 4 characters","warn");return;}
  data[mName].pin=np;
  saveData();
}

// ─── MONTHLY REPORT ───────────────────────────
function renderMonthlyReport(){
  const now=new Date(),curMs=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  let pm=[],pt='';
  if(reportMode==='single'){pm=[reportMonth];pt=`Month: ${reportMonth}`;}
  else if(reportMode==='range'){pm=reportStart&&reportEnd&&reportStart<=reportEnd?getMonthRange(reportStart,reportEnd):[];pt=`Range: ${reportStart} → ${reportEnd}`;}
  else{pm=getMonthRange("2024-02",curMs);pt=`All-time: Feb 2024 → ${curMs}`;}
  let total=0;
  const rows=data.members.map(m=>{
    const paid=pm.reduce((a,ms)=>a+data[m].contributions.filter(c=>c.month===ms).reduce((x,y)=>x+Number(y.amt),0),0);
    total+=paid;
    const expected=pm.reduce((a,ms)=>a+getMonthlyTarget(ms),0);
    const ts=getMemberShortfall(m);
    const badge=paid>=expected?'<span class="badge badge-comp">COMPLETE</span>':paid>0?'<span class="badge badge-part">PARTIAL</span>':'<span class="badge badge-pend">PENDING</span>';
    return`<tr><td>${m}</td><td>UGX ${paid.toLocaleString()}</td><td>UGX ${expected.toLocaleString()}</td><td style="color:var(--red);font-weight:700">UGX ${ts.toLocaleString()}</td><td>${badge}</td></tr>`;
  }).join('');
  const paidCount=pm.length?data.members.filter(m=>{
    const paid=pm.reduce((a,ms)=>a+data[m].contributions.filter(c=>c.month===ms).reduce((x,y)=>x+Number(y.amt),0),0);
    return paid>=pm.reduce((a,ms)=>a+getMonthlyTarget(ms),0);
  }).length:0;
  const S=getGlobalStats();
  return`<div class="card" style="border:2px solid var(--gold)">
    <h2>📅 Monthly Report & Print Centre</h2>
    <div style="margin-bottom:12px"><label style="font-size:12px;font-weight:700;color:var(--dark);display:block;margin-bottom:7px">Select Report Type:</label>
      <div class="report-mode-bar">
        <button class="mode-btn ${reportMode==='single'?'active':''}" onclick="reportMode='single';render()">📆 Single Month</button>
        <button class="mode-btn ${reportMode==='range'?'active':''}" onclick="reportMode='range';render()">📅 Date Range</button>
        <button class="mode-btn ${reportMode==='overall'?'active':''}" onclick="reportMode='overall';render()">🗂️ Overall / All-Time</button>
      </div>
    </div>
    ${reportMode==='single'?`<div style="display:flex;gap:11px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px"><div style="flex:1;min-width:175px"><label>Select Month</label><input type="month" style="margin:0" value="${reportMonth}" onchange="reportMonth=this.value;render()"></div><button class="print-btn" onclick="printSingleMonth()">🖨️ Print / Save PDF</button></div>`
    :reportMode==='range'?`<div style="display:flex;gap:11px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px"><div style="flex:1;min-width:145px"><label>Start Month</label><input type="month" style="margin:0" value="${reportStart}" onchange="reportStart=this.value;render()"></div><div style="flex:1;min-width:145px"><label>End Month</label><input type="month" style="margin:0" value="${reportEnd}" onchange="reportEnd=this.value;render()"></div><button class="print-btn" onclick="printRange()">🖨️ Print / Save PDF</button></div>`
    :`<div style="display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><p style="font-size:13px;color:#666;flex:1">Covers <strong>February 2024</strong> to <strong>present</strong> (${pm.length} months).</p><button class="print-btn" onclick="printOverall()">🖨️ Print / Save PDF</button></div>`}
    <div style="background:#f8f8f8;border:1px solid #eee;border-radius:8px;padding:9px 13px;margin-bottom:14px;font-size:12px;color:#555">
      <strong>Preview:</strong> ${pt} — <strong>${pm.length} month(s)</strong> | Period savings: <strong>UGX ${total.toLocaleString()}</strong> | Fully paid: <strong>${paidCount} / ${data.members.length}</strong>
    </div>
  </div>
  <div class="card"><h2>Financial Summary (All-Time)</h2>
    <div class="grid">
      <div class="stat-box"><div class="stat-label">Net Cash Position</div><div class="stat-value">UGX ${S.netCash.toLocaleString()}</div></div>
      <div class="stat-box"><div class="stat-label">Gross Savings</div><div class="stat-value">UGX ${S.grossSavings.toLocaleString()}</div></div>
      <div class="stat-box gold-border"><div class="stat-label">Interest Earned</div><div class="stat-value" style="color:var(--green)">UGX ${S.interestCollected.toLocaleString()}</div></div>
      <div class="stat-box" style="background:#E3F2FD"><div class="stat-label">Cash In</div><div class="stat-value" style="color:var(--blue)">UGX ${S.cashIn.toLocaleString()}</div></div>
      <div class="stat-box" style="background:#FFEBEE"><div class="stat-label">Expenses</div><div class="stat-value" style="color:var(--red)">UGX ${S.expenses.toLocaleString()}</div></div>
      <div class="stat-box" style="background:#F3E5F5"><div class="stat-label">Investments</div><div class="stat-value" style="color:#6A1B9A">UGX ${S.investments.toLocaleString()}</div></div>
      <div class="stat-box" style="background:#FFF9C4"><div class="stat-label">Active Loan Principal</div><div class="stat-value" style="color:var(--yellow)">UGX ${S.activeLoanPrincipal.toLocaleString()}</div></div>
    </div>
  </div>
  <div class="card"><h2>Member Savings — ${pt}</h2>
    <p style="font-size:11px;color:#888;margin-bottom:11px">Shortfall = unpaid savings gap + penalty charges as of today.</p>
    ${!pm.length?'<p style="color:#999;font-size:13px">Select a valid period above.</p>':''}
    ${pm.length?`<div class="table-wrap"><table><tr><th>Member</th><th>Paid</th><th>Expected</th><th>Total Shortfall (incl. penalties)</th><th>Status</th></tr>${rows}</table></div>`:''}
  </div>`;
}

// ─── SETTINGS ─────────────────────────────────
function renderSettings(){
  const ph=getPhoto(user.name);
  return`<div class="card" style="max-width:460px;margin:auto">
    <h2>🔐 My Settings</h2>
    <div style="text-align:center;margin-bottom:18px">
      <div class="photo-preview">${ph?`<img src="${ph}" alt="${user.name}">`:'👤'}</div>
      <div style="font-weight:700;margin-bottom:8px">${user.name}</div>
      <label style="cursor:pointer;display:inline-block">
        <span style="padding:8px 16px;background:var(--gold);color:var(--dark);border-radius:8px;font-weight:600;font-size:12px">📷 ${ph?'Change':'Upload'} My Photo</span>
        <input type="file" accept="image/*" style="display:none" onchange="uploadMyPhoto(event)">
      </label>
      ${ph?`<br><button class="del" style="margin-top:8px" onclick="removeMyPhoto()">Remove Photo</button>`:''}
    </div>
    <hr class="divider">
    <h3>Change PIN</h3>
    <label>Current PIN</label><input type="password" id="oldPin" placeholder="Current PIN" maxlength="20">
    <label>New PIN</label><input type="password" id="newPin" placeholder="New PIN (min 4 chars)" maxlength="20">
    <label>Confirm New PIN</label><input type="password" id="confPin" placeholder="Re-enter new PIN" maxlength="20">
    <button class="gold full" onclick="changePin()">Update PIN</button>
  </div>`;
}
function uploadMyPhoto(e){
  const file=e.target.files[0];if(!file)return;
  showToast("⏳ Compressing…","info");
  compressPhoto(file,b64=>{
    if(!data.photos)data.photos={};
    data.photos[user.name]=b64;
    saveData();
  });
}
function removeMyPhoto(){
  if(!data.photos)return;
  delete data.photos[user.name];
  saveData();
}
function changePin(){
  const o=document.getElementById('oldPin').value,n=document.getElementById('newPin').value,c=document.getElementById('confPin').value;
  if(o!==data[user.name].pin){showToast("❌ Current PIN incorrect","danger");return;}
  if(!n||n.length<4){showToast("⚠️ PIN must be at least 4 characters","warn");return;}
  if(n!==c){showToast("❌ PINs do not match","danger");return;}
  data[user.name].pin=n;saveData();
}

// ─── EDIT MODAL ───────────────────────────────
function openEdit(cat,mem,idx){
  let e;
  if(cat==='S')e={...data[mem].contributions[idx]};
  else if(cat==='L')e={...data[mem].loans[idx]};
  else if(cat==='C')e={...data.cashIn[idx]};
  else if(cat==='E')e={...data.expenses[idx]};
  else if(cat==='I')e={...data.investments[idx]};
  editModalData={cat,mem,idx,entry:e};render();
}
function renderEditModal(){
  const{cat,mem,idx,entry}=editModalData;
  const labels={S:'Savings',L:'Loan/Repayment',C:'Cash In',E:'Expense',I:'Investment'};
  let fields='';
  if(cat==='S')fields=`<label>Amount</label><input type="number" id="eAmt" value="${entry.amt}"><label>Date</label><input type="date" id="eDate" value="${entry.date}"><label>Month</label><input type="month" id="eMon" value="${entry.month}">`;
  else if(cat==='L')fields=`<label>Amount</label><input type="number" id="eAmt" value="${entry.amt}"><label>Date</label><input type="date" id="eDate" value="${entry.date}">`;
  else if(cat==='C')fields=`<label>Amount</label><input type="number" id="eAmt" value="${entry.amt}"><label>Date</label><input type="date" id="eDate" value="${entry.date}"><label>Source</label><input type="text" id="eDesc" value="${entry.source||''}">`;
  else fields=`<label>Amount</label><input type="number" id="eAmt" value="${entry.amt}"><label>Date</label><input type="date" id="eDate" value="${entry.date}"><label>Description</label><input type="text" id="eDesc" value="${entry.reason||''}">`;
  return`<div class="modal-overlay" onclick="closeEdit(event)">
    <div class="modal"><button class="modal-close" onclick="editModalData=null;render()">✕</button>
      <h2>Edit Entry</h2>
      <p style="font-size:12px;color:#666;margin-bottom:12px"><strong>${labels[cat]}</strong>${mem?' — '+mem:''}</p>
      ${fields}
      <button class="gold full" onclick="saveEdit()" style="margin-top:7px">💾 Save Changes</button>
    </div>
  </div>`;
}
function closeEdit(e){if(e.target.classList.contains('modal-overlay')){editModalData=null;render();}}
function saveEdit(){
  const{cat,mem,idx,entry}=editModalData;
  const amt=Number(document.getElementById('eAmt').value),date=document.getElementById('eDate').value;
  if(!amt||!date){showToast("⚠️ Fill in all fields","warn");return;}
  if(cat==='S'){const mon=document.getElementById('eMon').value;data[mem].contributions[idx]={...entry,amt,date,month:mon};}
  else if(cat==='L'){data[mem].loans[idx]={...entry,amt,date};}
  else if(cat==='C'){data.cashIn[idx]={...entry,amt,date,source:document.getElementById('eDesc').value};}
  else if(cat==='E'){data.expenses[idx]={...entry,amt,date,reason:document.getElementById('eDesc').value};}
  else if(cat==='I'){data.investments[idx]={...entry,amt,date,reason:document.getElementById('eDesc').value};}
  editModalData=null;saveData();
}

// ─── POST INFLOW / OUTFLOW ────────────────────
function postInflow(){
  const m=document.getElementById("mI").value,t=currentInflowType;
  const amt=Number(document.getElementById("amI").value),date=document.getElementById("daMan").value;
  if(!amt||amt<=0){showToast("⚠️ Enter a valid amount","warn");return;}
  if(!date){showToast("⚠️ Enter a valid date","warn");return;}
  if(t==='S'){
    const mStr=document.getElementById("moI").value;
    if(data[m].contributions.some(c=>c.month===mStr)){showToast("⚠️ Month already has an entry!","warn");return;}
    data[m].contributions.push({amt,date,month:mStr});
  }else if(t==='R'){
    const lID=document.getElementById("lID")?document.getElementById("lID").value:null;
    if(!lID){showToast("⚠️ No loan selected","warn");return;}
    data[m].loans.push({amt,date,type:'REPAYMENT',loanId:lID});
  }else if(t==='C'){
    const src=document.getElementById("descIn")?document.getElementById("descIn").value||"Donation":"Donation";
    data.cashIn.push({amt,date,source:src});
  }
  saveData();
}
function postOutflow(){
  const t=document.getElementById("tO").value,amt=Number(document.getElementById("amO").value);
  const desc=document.getElementById("reO").value,m=lastSelectedMember||user.name;
  const date=document.getElementById("daOut").value;
  if(!amt||amt<=0){showToast("⚠️ Enter a valid amount","warn");return;}
  if(t==='L')data[m].loans.push({amt,date,type:'LOAN'});
  else if(t==='E')data.expenses.push({amt,reason:desc,date});
  else if(t==='I')data.investments.push({amt,reason:desc,date});
  saveData();
}

// ─── DELETE ───────────────────────────────────
function del(cat,mem,idx){
  if(!confirm("Delete this entry?"))return;
  if(cat==='S')data[mem].contributions.splice(idx,1);
  else if(cat==='L')data[mem].loans.splice(idx,1);
  else if(cat==='C')data.cashIn.splice(idx,1);
  else if(cat==='E')data.expenses.splice(idx,1);
  else if(cat==='I')data.investments.splice(idx,1);
  saveData();
}

// ─── CSV EXPORTS ──────────────────────────────
function exportMemberCSV(name){
  const rows=[["Date","Type","Reference","Amount"]];
  data[name].contributions.forEach(c=>rows.push([c.date,"Savings",c.month,c.amt]));
  data[name].loans.forEach(l=>rows.push([l.date,l.type,l.loanId?'Loan '+l.loanId:'Principal',l.amt]));
  downloadCSV(`${name}_Statement.csv`,rows);
}
function exportMasterAudit(){
  const rows=[["Member/Entity","Date","Transaction Type","Reference/Desc","Amount"]];
  data.members.forEach(m=>{
    data[m].contributions.forEach(c=>rows.push([m,c.date,"Savings",c.month,c.amt]));
    data[m].loans.forEach(l=>rows.push([m,l.date,l.type,l.loanId?'Loan '+l.loanId:'Principal',l.amt]));
  });
  data.cashIn.forEach(c=>rows.push(["SYSTEM",c.date,"Cash In",c.source,c.amt]));
  data.expenses.forEach(e=>rows.push(["SYSTEM",e.date,"Expense",e.reason,e.amt]));
  data.investments.forEach(i=>rows.push(["SYSTEM",i.date,"Investment",i.reason,i.amt]));
  downloadCSV(`SACCO_MASTER_AUDIT_${new Date().toISOString().split('T')[0]}.csv`,rows);
}
function downloadCSV(filename,rows){
  const link=document.createElement("a");
  link.setAttribute("href",encodeURI("data:text/csv;charset=utf-8,"+rows.map(e=>e.join(",")).join("\n")));
  link.setAttribute("download",filename);
  document.body.appendChild(link);link.click();document.body.removeChild(link);
}

// ─── TOAST ────────────────────────────────────
function showToast(msg,type="success"){
  const ex=document.getElementById('toast');if(ex)ex.remove();
  const colors={success:'#2E7D32',danger:'#C62828',warn:'#E65100',info:'#1565C0'};
  const t=document.createElement('div');
  t.id='toast';
  t.style.cssText=`position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:${colors[type]||'#333'};color:#fff;padding:11px 20px;border-radius:30px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.25);font-family:'DM Sans',sans-serif`;
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity 0.4s';setTimeout(()=>t.remove(),400);},3000);
}

// ─── BOOT ─────────────────────────────────────
loadData();
</script>
