<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elites SACCO Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body{font-family:'Segoe UI', Arial, sans-serif; background:#F3E9D2; margin:0; color:#111}
    header{background:#111; color:#fff; padding:15px; display:flex; align-items:center; gap:12px; border-bottom:4px solid #B08D57}
    header img{height:50px; border-radius:6px; border:1px solid #B08D57; background:#fff}
    .container{padding:16px; max-width:1100px; margin:auto}
    .card{background:#fff; padding:20px; border-radius:12px; margin-bottom:16px; box-shadow:0 4px 10px rgba(0,0,0,0.1)}
    h2{margin-top:0; color:#111; border-bottom:2px solid #B08D57; padding-bottom:8px}
    table{width:100%; border-collapse:collapse; font-size:13px; margin-top:10px}
    th,td{border:1px solid #eee; padding:10px; text-align:left}
    th{background:#B08D57; color:#000}
    button{padding:10px 18px; border:none; border-radius:6px; background:#111; color:#fff; cursor:pointer; font-weight:bold}
    button.gold{background:#B08D57; color:#000}
    input,select{padding:10px; width:100%; margin-bottom:10px; border:1px solid #ccc; border-radius:8px}
    .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:15px}
    .status{padding:5px 12px; border-radius:20px; font-size:12px; font-weight:bold}
    .green{background:#27ae60; color:white}
    .red{background:#c0392b; color:white}
    .debt-card{background:#fff0f0; border-left:5px solid #c0392b}
</style>
</head>
<body>

<header>
    <img id="logoImg" style="display:none">
    <div style="flex-grow:1">
        <strong>ELITES SACCO</strong><br>
        <small id="userLabel">Connecting...</small>
    </div>
    <span id="syncStatus" class="status red">OFFLINE</span>
</header>

<div class="container" id="app"></div>

<script>
const BIN_ID = "6971f3eb43b1c97be94154dc"; 
const MASTER_KEY = "$2a$10$83AEiP9GsrLhSQIC8.nuW.6QtHG5XVzJElaL67zasDR0h8BYGLsQu";

let user = null;
let data = {};
const DEFAULT_PIN = "1234";

async function loadData() {
    try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
            headers: { 'X-Master-Key': MASTER_KEY }
        });
        const json = await res.json();
        data = json.record;
        
        // Setup initial structure if new
        if(!data.members) data.members = ["Gerald", "Member 2", "Member 3", "Member 4", "Member 5"];
        data.members.forEach(m => { if(!data[m]) data[m] = {contributions:[], loans:[], pin: DEFAULT_PIN} });

        if(data.logo) {
            const img = document.getElementById("logoImg");
            img.src = data.logo;
            img.style.display = "block";
        }
        document.getElementById("syncStatus").textContent = "CLOUD LIVE";
        document.getElementById("syncStatus").className = "status green";
        render();
    } catch (e) { document.getElementById("syncStatus").textContent = "SYNC ERROR"; }
}

async function saveData() {
    document.getElementById("syncStatus").textContent = "SAVING...";
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
        body: JSON.stringify(data)
    });
    document.getElementById("syncStatus").textContent = "CLOUD LIVE";
    render();
}

function handleLogo(e) {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 100; canvas.height = 100; // Shrink to optimize
            ctx.drawImage(img, 0, 0, 100, 100);
            data.logo = canvas.toDataURL('image/jpeg', 0.7);
            saveData();
        };
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
}

function updateMemberName(oldName) {
    const newName = prompt(`Enter new name for ${oldName}:`, oldName);
    if(newName && newName !== oldName) {
        data[newName] = data[oldName];
        delete data[oldName];
        data.members = data.members.map(m => m === oldName ? newName : m);
        saveData();
    }
}

function calculateLateFees(memberName) {
    let totalFee = 0;
    data[memberName].contributions.forEach(c => {
        const due = new Date(c.month + "-10");
        const paid = new Date(c.date);
        if(paid > due) {
            const weeks = Math.ceil((paid - due) / (1000 * 60 * 60 * 24 * 7));
            totalFee += Math.min(weeks * 5000, 15000);
        }
    });
    return totalFee;
}

function render() {
    const app = document.getElementById("app");
    document.getElementById("userLabel").textContent = user ? `Welcome, ${user.name}` : "Member Portal";
    app.innerHTML = "";

    if(!user) {
        let h = `<div class="card" style="text-align:center"><h2>Login</h2><div class="grid">`;
        data.members.forEach(m => h += `<button onclick="checkLogin('${m}')">${m}</button>`);
        app.innerHTML = h + `</div></div>`;
        return;
    }

    // Member Personal Debt Card
    let loanBal = 0;
    data[user.name].loans.forEach(l => loanBal += l.bal);
    const lateFees = calculateLateFees(user.name);

    app.innerHTML += `
        <div class="card debt-card">
            <h2>Your Account Status</h2>
            <div class="grid">
                <div>Outstanding Loan: <br><strong>UGX ${loanBal.toLocaleString()}</strong></div>
                <div>Accumulated Late Fees: <br><strong>UGX ${lateFees.toLocaleString()}</strong></div>
            </div>
        </div>`;

    if(user.role === 'admin') {
        const adm = document.createElement("div");
        adm.className = "card";
        adm.style.border = "2px solid #B08D57";
        adm.innerHTML = `
            <h2>Admin Hub <button onclick="saveData()" class="gold">Force Sync</button></h2>
            <div class="grid">
                <div>
                    <h3>+ Record Savings</h3>
                    <select id="mC">${data.members.map(m=>`<option>${m}</option>`)}</select>
                    <input type="month" id="moC" value="${new Date().toISOString().slice(0,7)}">
                    <input type="date" id="dC" title="Paid Date">
                    <input type="number" id="aC" placeholder="Amount">
                    <button class="gold" onclick="addEntry('C')">Post</button>
                </div>
                <div>
                    <h3>Manage Names</h3>
                    ${data.members.map(m => `<button style="font-size:11px; margin:2px" onclick="updateMemberName('${m}')">Edit ${m}</button>`).join('')}
                    <hr>
                    <label>Update Logo:</label><input type="file" onchange="handleLogo(event)">
                </div>
                <div>
                    <h3>Loan Entry</h3>
                    <select id="mL">${data.members.map(m=>`<option>${m}</option>`)}</select>
                    <input type="number" id="aL" placeholder="Amount">
                    <button class="gold" onclick="addEntry('L')">Give Loan</button>
                    <button class="gold" onclick="addEntry('R')">Repayment</button>
                </div>
            </div>
            <button onclick="user=null; render()" style="background:#666; margin-top:10px">Logout</button>
        `;
        app.appendChild(adm);
    }

    // Global Ledger
    let table = `<div class="card"><h2>Global History</h2><table><tr><th>Name</th><th>Type</th><th>Amount</th><th>Date</th></tr>`;
    data.members.forEach(m => {
        data[m].contributions.forEach(c => table += `<tr><td>${m}</td><td>Savings</td><td>${c.amt.toLocaleString()}</td><td>${c.date}</td></tr>`);
        data[m].loans.forEach(l => table += `<tr style="color:${l.bal < 0 ? 'green':'red'}"><td>${m}</td><td>${l.type}</td><td>${l.amt.toLocaleString()}</td><td>${l.date}</td></tr>`);
    });
    app.innerHTML += table + `</table></div>`;
}

function checkLogin(name) {
    const pin = prompt(`Enter PIN for ${name}:`);
    if(pin === data[name].pin) {
        user = { name: name, role: name === "Gerald" ? "admin" : "member" };
        render();
    } else { alert("Wrong PIN"); }
}

function addEntry(type) {
    if(type==='C'){
        const m = document.getElementById("mC").value;
        data[m].contributions.push({amt: Number(document.getElementById("aC").value), date: document.getElementById("dC").value, month: document.getElementById("moC").value});
    } else {
        const m = document.getElementById("mL").value;
        const amt = Number(document.getElementById("aL").value);
        const t = type === 'L' ? 'LOAN' : 'REPAYMENT';
        data[m].loans.push({amt, date: new Date().toISOString().split('T')[0], bal: type==='L'?amt:-amt, type: t});
    }
    saveData();
}

loadData();
</script>
</body>
</html>
