<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elites SACCO Final Master</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body{font-family:'Segoe UI', sans-serif; background:#F3E9D2; margin:0; color:#111}
    header{background:#111; color:#fff; padding:15px; display:flex; align-items:center; gap:12px; border-bottom:4px solid #B08D57}
    #logoSlot img{height:55px; width:55px; border-radius:50%; border:2px solid #B08D57; background:#fff; object-fit:cover}
    .container{padding:16px; max-width:1100px; margin:auto}
    .card{background:#fff; padding:20px; border-radius:12px; margin-bottom:16px; box-shadow:0 4px 10px rgba(0,0,0,0.1)}
    h2{margin-top:0; color:#111; border-bottom:2px solid #B08D57; padding-bottom:8px}
    table{width:100%; border-collapse:collapse; font-size:12px}
    th,td{border:1px solid #eee; padding:10px; text-align:left}
    th{background:#B08D57; color:#000}
    button{padding:8px 12px; border:none; border-radius:6px; background:#111; color:#fff; cursor:pointer; font-weight:bold; margin:2px}
    button.gold{background:#B08D57; color:#000}
    button.del{background:#ff4d4d; color:white; padding:4px 8px; font-size:10px}
    input,select{padding:10px; width:100%; margin-bottom:10px; border:1px solid #ccc; border-radius:8px}
    .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:15px}
    .stat-box{padding:15px; border-radius:8px; background:#f9f9f9; border:1px solid #ddd; color:#111}
</style>
</head>
<body>

<header>
    <div id="logoSlot"></div>
    <div style="flex-grow:1"><strong>ELITES SACCO</strong><br><small id="userLabel">Synchronizing...</small></div>
</header>

<div class="container" id="app"></div>

<script>
const BIN_ID = "6971f3eb43b1c97be94154dc"; 
const MASTER_KEY = "$2a$10$83AEiP9GsrLhSQIC8.nuW.6QtHG5XVzJElaL67zasDR0h8BYGLsQu";
const PRIMARY_ADMIN = "Apule Gerald Humble";
const SECONDARY_ADMIN = "Ameny Ronald";

let user = null;
let data = {};

async function loadData() {
    try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {headers:{'X-Master-Key':MASTER_KEY}});
        const json = await res.json();
        data = json.record;
        if(!data.expenses) data.expenses = [];
        if(!data.investments) data.investments = [];
        if(data.logo) document.getElementById("logoSlot").innerHTML = `<img src="${data.logo}">`;
        render();
    } catch (e) { console.error("Sync Error"); }
}

async function saveData() {
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method:'PUT', headers:{'Content-Type':'application/json','X-Master-Key':MASTER_KEY},
        body: JSON.stringify(data)
    });
    render();
}

function deleteEntry(category, memberName, index) {
    if(!confirm("Delete this record permanently?")) return;
    if(category === 'savings') data[memberName].contributions.splice(index, 1);
    else if(category === 'loan') data[memberName].loans.splice(index, 1);
    else if(category === 'expense') data.expenses.splice(index, 1);
    else if(category === 'invest') data.investments.splice(index, 1);
    saveData();
}

function exportToCSV() {
    let rows = [["Date", "Member/Entity", "Type", "Amount"]];
    data.members.forEach(m => {
        data[m].contributions.forEach(c => rows.push([c.month, m, "Savings", c.amt]));
        data[m].loans.forEach(l => rows.push([l.date, m, l.type, l.amt]));
    });
    data.expenses.forEach(e => rows.push([e.date, "SACCO", "Expense: "+e.reason, -e.amt]));
    data.investments.forEach(i => rows.push([i.date, "SACCO", "Invest: "+i.reason, -i.amt]));
    
    let csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.join(",")).join("\n");
    let encodedUri = encodeURI(csvContent);
    let link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "Elites_SACCO_Full_Report.csv");
    document.body.appendChild(link);
    link.click();
}

function render() {
    const app = document.getElementById("app");
    if(!user) {
        let h = `<div class="card" style="text-align:center"><h2>Login</h2><div class="grid">`;
        data.members.forEach(m => h += `<button onclick="checkLogin('${m}')">${m}</button>`);
        app.innerHTML = h + `</div></div>`;
        return;
    }

    const isAdmin = user.name === PRIMARY_ADMIN || user.name === SECONDARY_ADMIN || data[user.name].isExtraAdmin;

    // TOTALS
    let totalSavings = 0, totalLoansOut = 0, totalInvested = 0, totalExpenses = 0;
    data.members.forEach(m => {
        data[m].contributions.forEach(c => totalSavings += Number(c.amt));
        data[m].loans.forEach(l => totalLoansOut += Number(l.bal));
    });
    data.investments.forEach(i => totalInvested += Number(i.amt));
    data.expenses.forEach(e => totalExpenses += Number(e.amt));
    const availableCash = totalSavings - (totalLoansOut + totalInvested + totalExpenses);

    app.innerHTML = `
        <div class="card" style="background:#111; color:#fff">
            <h2>Treasury: UGX ${availableCash.toLocaleString()} Available</h2>
            <div class="grid">
                <div class="stat-box">Invested: UGX ${totalInvested.toLocaleString()}</div>
                <div class="stat-box">Loans Out: UGX ${totalLoansOut.toLocaleString()}</div>
                <div class="stat-box">Expenses: UGX ${totalExpenses.toLocaleString()}</div>
            </div>
            ${isAdmin ? `<button class="gold" style="margin-top:15px" onclick="exportToCSV()">Export All Data to Excel</button>` : ''}
        </div>`;

    if(isAdmin) {
        app.innerHTML += `
            <div class="card" style="border:2px solid #B08D57">
                <h2>Admin Control</h2>
                <div class="grid">
                    <div>
                        <h3>Member Payments</h3>
                        <select id="mC">${data.members.map(m=>`<option>${m}</option>`)}</select>
                        <select id="transType"><option value="C">Savings</option><option value="R">Loan Repayment</option></select>
                        <input type="month" id="moC" value="2024-02">
                        <input type="number" id="aC" placeholder="Amount">
                        <button class="gold" onclick="addEntry(document.getElementById('transType').value)">Submit</button>
                    </div>
                    <div>
                        <h3>Outflows</h3>
                        <select id="outType"><option value="L">Disburse Loan</option><option value="EXP">Expense</option><option value="INV">Investment</option></select>
                        <select id="mL">${data.members.map(m=>`<option>${m}</option>`)}</select>
                        <input type="text" id="gR" placeholder="Description">
                        <input type="number" id="gA" placeholder="Amount">
                        <button class="gold" onclick="handleOutflow()">Record Outflow</button>
                    </div>
                </div>
            </div>`;
    }

    // PRIVACY FILTERED LEDGER
    let ledgerHtml = `<div class="card"><h2>${isAdmin ? 'Global Ledger' : 'My Personal Ledger'}</h2><table>
        <tr><th>Date</th><th>Entity</th><th>Type</th><th>Amount</th><th>Action</th></tr>`;
    
    const visibleMembers = isAdmin ? data.members : [user.name];

    visibleMembers.forEach(m => {
        data[m].contributions.forEach((c, idx) => {
            ledgerHtml += `<tr><td>${c.month}</td><td>${m}</td><td>Savings</td><td>${Number(c.amt).toLocaleString()}</td>
            <td>${isAdmin ? `<button class="del" onclick="deleteEntry('savings','${m}',${idx})">Delete</button>` : '-'}</td></tr>`;
        });
        data[m].loans.forEach((l, idx) => {
            ledgerHtml += `<tr><td>${l.date}</td><td>${m}</td><td>${l.type}</td><td>${Number(l.amt).toLocaleString()}</td>
            <td>${isAdmin ? `<button class="del" onclick="deleteEntry('loan','${m}',${idx})">Delete</button>` : '-'}</td></tr>`;
        });
    });

    if(isAdmin) {
        data.expenses.forEach((e, idx) => {
            ledgerHtml += `<tr style="background:#fff1f1"><td>${e.date}</td><td>SACCO</td><td>Expense: ${e.reason}</td><td>-${Number(e.amt).toLocaleString()}</td>
            <td><button class="del" onclick="deleteEntry('expense',null,${idx})">Delete</button></td></tr>`;
        });
        data.investments.forEach((i, idx) => {
            ledgerHtml += `<tr style="background:#f1faff"><td>${i.date}</td><td>SACCO</td><td>Invest: ${i.reason}</td><td>-${Number(i.amt).toLocaleString()}</td>
            <td><button class="del" onclick="deleteEntry('invest',null,${idx})">Delete</button></td></tr>`;
        });
    }

    app.innerHTML += ledgerHtml + `</table></div><div style="text-align:center; padding:20px"><button onclick="user=null;render()">Logout</button></div>`;
}

function handleOutflow() {
    const type = document.getElementById("outType").value;
    const amt = Number(document.getElementById("gA").value);
    const reason = document.getElementById("gR").value;
    const date = new Date().toISOString().split('T')[0];
    if(type === 'L') addEntry('L');
    else if(type === 'EXP') data.expenses.push({amt, reason, date});
    else if(type === 'INV') data.investments.push({amt, reason, date});
    saveData();
}

function addEntry(t) {
    const m = (t==='L') ? document.getElementById("mL").value : document.getElementById("mC").value;
    const a = Number((t==='L') ? document.getElementById("gA").value : document.getElementById("aC").value);
    const d = new Date().toISOString().split('T')[0];
    const mo = document.getElementById("moC").value;
    if(t==='C') data[m].contributions.push({amt:a, date:d, month:mo});
    else data[m].loans.push({amt:a, date:d, bal: t==='L'?a:-a, type: t==='L'?'LOAN':'REPAYMENT'});
    saveData();
}

function checkLogin(n) { const p = prompt(`PIN for ${n}:`); if(p===data[n].pin){user={name:n};render();}else alert("Error"); }
loadData();
</script>
</body>
</html>
