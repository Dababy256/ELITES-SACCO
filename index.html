<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elites SACCO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Elites SACCO">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d0d">
<meta name="description" content="Elites SACCO Member Portal">
<link id="manifest-link" rel="manifest">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#B08D57;--gold-lt:#d4aa72;--dark:#0d0d0d;--dark2:#161616;--dark3:#1e1e1e;
  --cream:#F3E9D2;--white:#fff;--red:#C62828;--green:#2E7D32;--yellow:#E65100;--blue:#1565C0;
  --shadow:0 2px 16px rgba(0,0,0,0.08);--shadow-lg:0 8px 32px rgba(0,0,0,0.12);
  --radius:12px;--radius-sm:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#f0ebe0;color:#1a1a1a;min-height:100vh;}

/* ── APP SHELL ── */
#appShell{display:flex;min-height:100vh;width:100%;}

/* ── SIDEBAR ── */
#sidebar{
  width:240px;background:var(--dark);border-right:2px solid #2a2a2a;
  display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;
  z-index:200;overflow-y:auto;transition:transform 0.25s ease;
}
#sidebar::-webkit-scrollbar{width:0;}
.sb-brand{padding:18px 16px 14px;border-bottom:1px solid #222;display:flex;align-items:center;gap:10px;}
.sb-brand-icon{width:36px;height:36px;border-radius:9px;flex-shrink:0;}
.sb-brand-text{font-family:'Playfair Display',serif;color:var(--gold);font-size:0.95rem;font-weight:700;letter-spacing:0.5px;line-height:1.2;}
.sb-brand-sub{font-size:9px;color:#555;font-weight:400;letter-spacing:0.5px;}
.sb-nav{flex:1;padding:8px 0;}
.sb-section{font-size:9px;font-weight:700;color:#383838;text-transform:uppercase;letter-spacing:1.2px;padding:12px 18px 4px;}
.sb-item{display:flex;align-items:center;gap:11px;padding:9px 18px;color:#666;font-size:12px;font-weight:600;cursor:pointer;border-left:3px solid transparent;transition:all 0.15s;user-select:none;}
.sb-item:hover{background:#151515;color:#bbb;}
.sb-item.active{background:#1a1a1a;color:var(--gold);border-left-color:var(--gold);}
.sb-item-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0;}
.sb-divider{border:none;border-top:1px solid #1e1e1e;margin:6px 0;}
.sb-footer{padding:12px 14px;border-top:1px solid #1e1e1e;display:flex;align-items:center;gap:9px;}
.sb-avatar{width:32px;height:32px;border-radius:50%;border:2px solid var(--gold);background:#222;display:flex;align-items:center;justify-content:center;font-size:13px;overflow:hidden;flex-shrink:0;}
.sb-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.sb-user{flex:1;overflow:hidden;}
.sb-username{color:#ccc;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-role{color:#444;font-size:9px;}
.sb-logout{background:none;border:1px solid #2a2a2a;color:#555;padding:4px 8px;font-size:10px;border-radius:5px;flex-shrink:0;}
.sb-logout:hover{border-color:#444;color:#aaa;transform:none;}

/* ── MAIN CONTENT ── */
#mainContent{margin-left:240px;min-height:100vh;display:flex;flex-direction:column;flex:1;min-width:0;width:calc(100% - 240px);}

/* ── MOBILE HEADER ── */
#mobileHeader{display:none;background:var(--dark);border-bottom:2px solid var(--gold);padding:10px 16px;align-items:center;gap:12px;position:sticky;top:0;z-index:150;}
.mob-hdr-title{font-family:'Playfair Display',serif;font-size:1rem;color:var(--gold);}
.mob-hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.hamburger{background:none;border:none;color:#888;font-size:20px;padding:4px;cursor:pointer;line-height:1;}
.hamburger:hover{color:var(--gold);transform:none;}

/* ── SIDEBAR OVERLAY ── */
#sbOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:190;}
#sbOverlay.show{display:block;}

/* ── PAGE HEADER ── */
.page-header{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.page-title{font-family:'Playfair Display',serif;font-size:1.4rem;color:#111;}
.page-subtitle{font-size:12px;color:#888;margin-top:2px;}

/* ── CONTAINER ── */
.container{padding:16px 20px 32px;width:100%;}

/* ── CARDS ── */
.card{background:var(--white);padding:20px;border-radius:var(--radius);margin-bottom:14px;box-shadow:var(--shadow);}
.card-title{font-family:'Playfair Display',serif;font-size:1rem;color:#111;border-bottom:2px solid var(--gold);padding-bottom:8px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}

/* ── HERO ── */
.hero{background:linear-gradient(135deg,#0d0d0d 0%,#1a1610 100%);border:1px solid #2a2516;padding:22px 24px;border-radius:var(--radius);margin-bottom:14px;}
.hero-eyebrow{font-size:9px;color:#555;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;}
.hero-amount{font-family:'Playfair Display',serif;font-size:2.2rem;color:var(--gold);font-weight:900;line-height:1;}
.hero-formula{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:14px;}
.f-pill{padding:4px 9px;border-radius:20px;font-weight:700;font-size:10px;}
.f-op{color:#333;font-size:13px;font-weight:700;}

/* ── STAT GRIDS ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px;}
.stat-box{padding:14px 16px;border-radius:var(--radius-sm);background:#fafafa;border:1px solid #ebebeb;transition:border-color 0.2s;}
.stat-box:hover{border-color:var(--gold);}
.stat-label{font-size:9.5px;color:#999;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}
.stat-value{font-size:1rem;font-weight:700;color:#111;}
.stat-sub{font-size:10px;color:#bbb;margin-top:2px;}
.stat-box-dark{background:#111;border:1px solid #222;border-radius:var(--radius-sm);padding:14px;}

/* ── PROGRESS ── */
.progress-wrap{background:#eee;border-radius:99px;height:6px;overflow:hidden;margin-top:4px;}
.progress-bar{height:6px;border-radius:99px;transition:width 0.5s;}
.progress-gold{background:linear-gradient(90deg,var(--gold),#d4aa72);}
.progress-green{background:linear-gradient(90deg,#2E7D32,#4CAF50);}
.progress-amber{background:linear-gradient(90deg,#E65100,#FF9800);}

/* ── TABLES ── */
.table-wrap{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid #f0f0f0;}
table{width:100%;border-collapse:collapse;font-size:11.5px;}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #f5f5f5;}
th{background:#111;color:var(--gold);font-weight:600;font-size:10.5px;letter-spacing:0.3px;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#faf8f4;}

/* ── FORMS ── */
input,select,textarea{padding:9px 12px;width:100%;margin-bottom:8px;border:1.5px solid #e5e5e5;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:13px;background:#fff;outline:none;transition:border 0.2s,box-shadow 0.2s;}
textarea{resize:vertical;min-height:110px;}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,141,87,0.1);}
label{font-size:10.5px;font-weight:700;color:#777;display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:0.3px;}

/* ── BUTTONS ── */
button{padding:8px 15px;border:none;border-radius:var(--radius-sm);background:#111;color:#fff;cursor:pointer;font-weight:600;font-size:12px;font-family:'DM Sans',sans-serif;transition:all 0.15s;margin:2px;}
button:hover{opacity:0.88;transform:translateY(-1px);}
button:active{transform:translateY(0);}
button.gold{background:var(--gold);color:#111;}
button.del{background:#ff4d4d;color:#fff;padding:4px 8px;font-size:10px;border-radius:5px;}
button.edit-btn{background:#1976D2;color:#fff;padding:4px 8px;font-size:10px;border-radius:5px;}
button.sm{padding:6px 10px;font-size:11px;}
button.full{width:100%;margin:3px 0;}
button.ghost{background:transparent;color:#666;border:1.5px solid #e5e5e5;}
button.ghost:hover{border-color:#aaa;color:#333;}
button.print-btn{background:#1B5E20;color:#fff;}
button.print-btn:hover{background:#2E7D32;}
button.danger{background:var(--red);color:#fff;}

/* ── BADGES ── */
.badge{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;display:inline-flex;align-items:center;gap:4px;}
.badge-paid    {background:#C8E6C9;color:#1B5E20;}
.badge-partial {background:#FFF3E0;color:#E65100;}
.badge-outstanding{background:#FFEBEE;color:#C62828;}
.badge-overdue {background:#B71C1C;color:#fff;}
.badge-comp    {background:#C8E6C9;color:#1B5E20;}
.badge-part    {background:#FFF3E0;color:#E65100;}
.badge-pend    {background:#FFEBEE;color:#C62828;}
.badge-info    {background:#E3F2FD;color:#1565C0;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.badge-overdue{animation:pulse 1.5s infinite;}

/* ── ALERTS ── */
.alert{padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:10px;font-size:12.5px;font-weight:500;display:flex;align-items:flex-start;gap:8px;}
.alert-warn   {background:#FFF8E1;border:1px solid #FFE082;color:#5D4037;}
.alert-danger {background:#FFEBEE;border:1px solid #FFCDD2;color:#B71C1C;}
.alert-success{background:#E8F5E9;border:1px solid #C8E6C9;color:#1B5E20;}
.alert-info   {background:#E3F2FD;border:1px solid #BBDEFB;color:#1565C0;}

/* ── MODALS ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:#fff;border-radius:16px;padding:26px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.25);position:relative;max-height:90vh;overflow-y:auto;}
.modal-close{position:absolute;top:12px;right:14px;background:none;border:none;font-size:20px;cursor:pointer;color:#999;}

/* ── LOAN CARDS ── */
.loan-card{border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
.loan-card-header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.loan-card-body{padding:0 18px 16px;}
.loan-card.lc-paid{background:#f5fff7;border:1px solid #C8E6C9;}
.loan-card.lc-partial{background:#fffdf7;border:1px solid #FFE082;}
.loan-card.lc-outstanding{background:#fff8f8;border:1px solid #FFCDD2;}
.loan-card-header.lc-paid{background:#f0fff3;}
.loan-card-header.lc-partial{background:#fffbf0;}
.loan-card-header.lc-outstanding{background:#fff5f5;}
.loan-progress-label{display:flex;justify-content:space-between;font-size:10.5px;color:#888;margin-bottom:3px;margin-top:10px;}

/* ── MEMBER CARDS (login) ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--cream);}
.login-card{background:#fff;padding:32px 26px;border-radius:20px;box-shadow:0 8px 40px rgba(0,0,0,0.12);max-width:540px;width:100%;}
.login-title{font-family:'Playfair Display',serif;font-size:1.4rem;text-align:center;}
.login-sub{font-size:12px;color:#999;margin-top:3px;text-align:center;}
.member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:14px;}
.member-btn{background:#fafafa;color:#111;border:1.5px solid #ebebeb;font-size:11px;padding:12px 8px;border-radius:var(--radius);text-align:center;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:all 0.15s;}
.member-btn:hover{border-color:var(--gold);background:#faf6ee;transform:translateY(-2px);box-shadow:0 4px 12px rgba(176,141,87,0.15);}
.member-btn-avatar{width:48px;height:48px;border-radius:50%;border:2px solid var(--gold);background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;}
.member-btn-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}

/* ── MINUTES ── */
.minutes-card{border:1px solid #ebebeb;border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
.minutes-header{padding:13px 16px;background:#fafafa;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.minutes-header:hover{background:#f5f0e8;}
.minutes-body{padding:16px;border-top:1px solid #f0f0f0;font-size:13px;line-height:1.75;white-space:pre-wrap;display:none;color:#333;}
.minutes-body.open{display:block;}

/* ── MEMBER MGMT ── */
.member-mgmt-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid #f0f0f0;border-radius:var(--radius-sm);margin-bottom:8px;background:#fafafa;transition:border-color 0.15s;}
.member-mgmt-row:hover{border-color:#ddd;}
.member-mgmt-avatar{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);background:#eee;display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden;flex-shrink:0;}
.member-mgmt-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}

/* ── PHOTO PREVIEW ── */
.photo-preview{width:80px;height:80px;border-radius:50%;border:3px solid var(--gold);background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;margin:0 auto 10px;}
.photo-preview img{width:100%;height:100%;object-fit:cover;border-radius:50%;}

/* ── REPORT MODE ── */
.mode-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.mode-btn{padding:7px 16px;border-radius:var(--radius-sm);border:2px solid #e5e5e5;background:#fff;color:#666;font-weight:600;font-size:11.5px;cursor:pointer;transition:all 0.15s;}
.mode-btn.active{border-color:var(--gold);background:var(--gold);color:#111;}

/* ── INSTALL BANNER ── */
#installBanner{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--dark);border-top:3px solid var(--gold);padding:12px 20px;z-index:9000;align-items:center;gap:12px;box-shadow:0 -4px 20px rgba(0,0,0,0.3);}
#installBanner.show{display:flex;}

/* ── DIVIDER ── */
.divider{border:none;border-top:1px solid #f0f0f0;margin:14px 0;}

/* ── TWO COL ── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

/* ── PRINT ── */
@media print{
  #appContainer,#installBanner{display:none!important;}
  #printArea{display:block!important;padding:0;margin:0;}
  .print-page{page-break-after:always;padding:14mm 13mm;}
  .print-page:last-child{page-break-after:avoid;}
  .print-header{text-align:center;margin-bottom:16px;border-bottom:3px solid #B08D57;padding-bottom:10px;}
  .print-header h1{font-size:18pt;color:#111;margin-bottom:3px;}
  .print-header .ph-sub{font-size:9pt;color:#555;}
  .print-header .ph-title{font-size:12pt;font-weight:700;color:#B08D57;margin:3px 0;}
  .print-section{margin-bottom:14px;}
  .print-section h2{font-size:11pt;color:#111;border-bottom:1.5px solid #B08D57;padding-bottom:4px;margin-bottom:6px;}
  .print-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px;}
  .print-stat{border:1px solid #ddd;border-radius:4px;padding:7px 9px;background:#fafafa;}
  .print-stat .ps-label{font-size:7pt;color:#888;text-transform:uppercase;font-weight:700;margin-bottom:2px;}
  .print-stat .ps-value{font-size:10pt;font-weight:700;color:#111;}
  .print-net{background:#111;color:#fff;padding:10px 14px;border-radius:5px;margin-bottom:10px;}
  .print-net .pn-label{font-size:7.5pt;color:#aaa;text-transform:uppercase;margin-bottom:2px;}
  .print-net .pn-value{font-size:16pt;font-weight:900;color:#B08D57;}
  .print-formula{font-size:7pt;color:#aaa;margin-top:3px;}
  table{width:100%;border-collapse:collapse;font-size:8.5pt;margin-bottom:8px;}
  th{background:#111!important;color:#B08D57!important;padding:5px 7px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  td{padding:5px 7px;border:1px solid #ddd;}
  tr:nth-child(even) td{background:#f8f8f8!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .badge{padding:2px 6px;border-radius:10px;font-size:7pt;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .badge-comp,.badge-paid{background:#C8E6C9!important;color:#2E7D32!important;}
  .badge-part,.badge-partial{background:#FFF3E0!important;color:#E65100!important;}
  .badge-pend,.badge-outstanding{background:#FFEBEE!important;color:#C62828!important;}
  .print-footer{text-align:center;font-size:7pt;color:#aaa;border-top:1px solid #eee;padding-top:6px;margin-top:12px;}
  .print-member-stat{display:inline-block;border:1px solid #ddd;border-radius:4px;padding:6px 10px;margin:3px;background:#fafafa;min-width:120px;}
  .print-member-stat .ps-label{font-size:7pt;color:#888;text-transform:uppercase;font-weight:700;}
  .print-member-stat .ps-value{font-size:10pt;font-weight:700;}
}
@media(max-width:768px){
  #sidebar{transform:translateX(-240px);}
  #sidebar.open{transform:translateX(0);}
  #mainContent{margin-left:0;width:100%;}
  #mobileHeader{display:flex;}
  .grid-2{grid-template-columns:1fr;}
  .hero-amount{font-size:1.6rem;}
  .stat-grid{grid-template-columns:1fr 1fr;}
  .container{padding:12px 14px 28px;}
}
</style>
</head>
<body>
<div id="printArea" style="display:none"></div>
<div id="appContainer">
  <div id="root"></div>
</div>
<div id="installBanner">
  <canvas id="installBannerIcon" width="40" height="40" style="border-radius:9px;flex-shrink:0;"></canvas>
  <div style="flex:1"><div style="color:#fff;font-weight:700;font-size:13px">Install Elites SACCO</div><div style="color:#666;font-size:11px">Add to home screen for quick access</div></div>
  <button onclick="doInstall()" style="background:var(--gold);color:#111;font-weight:700;padding:9px 16px;border-radius:8px;margin:0">Install</button>
  <button onclick="dismissInstall()" style="background:none;color:#555;font-size:18px;padding:4px 8px;margin:0">✕</button>
</div>
<script>
// ─── CONFIG ───────────────────────────────────
const BIN_ID          = "6971f3eb43b1c97be94154dc";
const MASTER_KEY      = "$2a$10$83AEiP9GsrLhSQIC8.nuW.6QtHG5XVzJElaL67zasDR0h8BYGLsQu";
const PRIMARY_ADMIN   = "Apule Gerald Humble";
const SECONDARY_ADMIN = "Ameny Ronald";
const MAX_PHOTO_SIZE  = 60000;

// ─── PWA ──────────────────────────────────────
function generateAppIcon(size){
  const c=document.createElement('canvas');c.width=size;c.height=size;
  const ctx=c.getContext('2d');
  const r=size*0.13;
  ctx.beginPath();ctx.moveTo(r,0);ctx.lineTo(size-r,0);ctx.quadraticCurveTo(size,0,size,r);ctx.lineTo(size,size-r);ctx.quadraticCurveTo(size,size,size-r,size);ctx.lineTo(r,size);ctx.quadraticCurveTo(0,size,0,size-r);ctx.lineTo(0,r);ctx.quadraticCurveTo(0,0,r,0);ctx.closePath();
  ctx.fillStyle='#0d0d0d';ctx.fill();
  ctx.beginPath();ctx.arc(size/2,size/2,size*0.43,0,2*Math.PI);ctx.strokeStyle='#B08D57';ctx.lineWidth=size*0.045;ctx.stroke();
  ctx.fillStyle='#B08D57';ctx.font=`900 ${Math.round(size*0.5)}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('E',size/2,size*0.53);
  return c.toDataURL('image/png');
}
function setupPWA(){
  const icon192=generateAppIcon(192),icon512=generateAppIcon(512),icon180=generateAppIcon(180);
  const al=document.createElement('link');al.rel='apple-touch-icon';al.href=icon180;document.head.appendChild(al);
  const bc=document.getElementById('installBannerIcon'),bctx=bc.getContext('2d');
  const ti=new Image();ti.onload=()=>bctx.drawImage(ti,0,0,40,40);ti.src=icon192;
  const manifest={name:'Elites SACCO',short_name:'Elites SACCO',description:'Elites SACCO Member Portal',start_url:location.href,display:'standalone',background_color:'#F3E9D2',theme_color:'#0d0d0d',orientation:'portrait-primary',icons:[{src:icon192,sizes:'192x192',type:'image/png',purpose:'any maskable'},{src:icon512,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
  document.getElementById('manifest-link').href=URL.createObjectURL(blob);

function compressPhoto(file,cb){

// ─── CALCULATIONS ─────────────────────────────
function getMonthlyTarget(ms){
  // Per-month override takes first priority
  if(data.settings&&data.settings.targetOverrides&&data.settings.targetOverrides[ms]) return Number(data.settings.targetOverrides[ms]);
  // Legacy fixed period
  const y=parseInt(ms.split('-')[0]),m=parseInt(ms.split('-')[1]);
  if(y===2024&&m>=2&&m<=7) return 80000;
  // Global configurable target (admin-set), default 100000
  return(data.settings&&data.settings.monthlyTarget)?Number(data.settings.monthlyTarget):100000;
}

function isMonthWaived(mName,ms){
  return(data.waivers||[]).some(w=>w.member===mName&&w.month===ms);
}
function calcMonthPenalty(mName,ms){
  if(isMonthWaived(mName,ms))return 0; // penalty waived by admin
  const today=new Date(),curMs=today.toISOString().slice(0,7);
  const target=getMonthlyTarget(ms);
  const paid=data[mName].contributions.filter(c=>c.month===ms).reduce((a,b)=>a+Number(b.amt),0);
  if(paid>=target)return 0;
  if(ms!==curMs)return 15000;
  if(today.getDate()>=10)return Math.min((Math.floor((today.getDate()-10)/7)+1)*5000,15000);
  return 0;
}

function calcArrearsAndFines(mName){
  let total=0;const today=new Date();let cy=2024,cm=2;
  while(cy<today.getFullYear()||(cy===today.getFullYear()&&cm<=today.getMonth()+1)){
    const ms=`${cy}-${String(cm).padStart(2,'0')}`;
    const target=getMonthlyTarget(ms);
    const paid=data[mName].contributions.filter(c=>c.month===ms).reduce((a,b)=>a+Number(b.amt),0);
    if(paid<target)total+=(target-paid)+calcMonthPenalty(mName,ms);
    cm++;if(cm>12){cm=1;cy++;}
  }
  return total;
}

function calcLoanBalance(loan,loanId,mName){
  if(!loan||loan.type!=='LOAN')return null;
  const principal=Number(loan.amt);
  const issueDate=new Date(loan.date);
  const repayments=(data[mName].loans||[]).filter(r=>r.type==='REPAYMENT'&&String(r.loanId)===String(loanId)).map(r=>({date:new Date(r.date),amt:Number(r.amt)})).sort((a,b)=>a.date-b.date);
  const totalRepaid=repayments.reduce((a,r)=>a+r.amt,0);
  const today=new Date();today.setHours(23,59,59,999);
  let balance=principal*1.05;
  repayments.filter(r=>r.date<=issueDate).forEach(r=>{balance-=r.amt;});
  if(balance<=0){
    const ic=Math.max(0,totalRepaid-principal);
    return{principal,outstanding:0,totalRepaid,interestCollected:ic,interestAccrued:ic,isFullyPaid:true,isOverdue:false,monthsElapsed:0,loanStatus:'PAID'};
  }
  let aN=1;
  while(true){
    const anniv=new Date(issueDate);anniv.setMonth(anniv.getMonth()+aN);if(anniv.getDate()!==issueDate.getDate())anniv.setDate(0);
    if(anniv>today)break;
    const pA=new Date(issueDate);pA.setMonth(pA.getMonth()+(aN-1));if(pA.getDate()!==issueDate.getDate())pA.setDate(0);
    repayments.filter(r=>r.date>pA&&r.date<=anniv).forEach(r=>{balance-=r.amt;});
    if(balance<=0){balance=0;break;}
    balance*=1.05;aN++;
  }
  const lA=new Date(issueDate);lA.setMonth(lA.getMonth()+(aN-1));if(lA.getDate()!==issueDate.getDate())lA.setDate(0);
  repayments.filter(r=>r.date>lA&&r.date<=today).forEach(r=>{balance-=r.amt;});
  if(balance<0)balance=0;
  const outstanding=Math.max(0,Math.round(balance));
  const isFullyPaid=outstanding===0&&totalRepaid>0;
  const monthsElapsed=aN-1;
  const isOverdue=!isFullyPaid&&monthsElapsed>=1&&totalRepaid===0;
  const pr=Math.min(totalRepaid,principal);
  const interestCollected=Math.max(0,totalRepaid-pr);
  const interestAccrued=Math.max(0,Math.round(outstanding+totalRepaid-principal));
  // Loan status
  const loanStatus=isFullyPaid?'PAID':totalRepaid>0?'PARTIAL':'OUTSTANDING';
  return{principal,outstanding,totalRepaid,interestCollected,interestAccrued,isFullyPaid,isOverdue,monthsElapsed,loanStatus};
}

function getMemberLoanDebt(mName){return data[mName].loans.filter(l=>l.type==='LOAN').reduce((s,loan,idx)=>{const b=calcLoanBalance(loan,idx+1,mName);return s+(b?b.outstanding:0);},0);}

function getGlobalStats(){
  let grossSavings=0,interestCollected=0,activeLoanPrincipal=0;
  data.members.forEach(m=>{
    data[m].contributions.forEach(c=>grossSavings+=Number(c.amt));
    data[m].loans.filter(l=>l.type==='LOAN').forEach((loan,idx)=>{const bal=calcLoanBalance(loan,idx+1,m);if(!bal)return;const pr=Math.min(bal.totalRepaid,bal.principal);interestCollected+=Math.max(0,bal.totalRepaid-pr);activeLoanPrincipal+=Math.max(0,bal.principal-pr);});
  });
  const cashIn=data.cashIn.reduce((a,b)=>a+Number(b.amt),0);
  const expenses=data.expenses.reduce((a,b)=>a+Number(b.amt),0);
  const investments=data.investments.reduce((a,b)=>a+Number(b.amt),0);
  return{grossSavings,interestCollected,cashIn,expenses,investments,activeLoanPrincipal,netCash:(grossSavings+interestCollected+cashIn)-(expenses+activeLoanPrincipal+investments)};
}

function getMonthRange(s,e){
  const ms=[];let[sy,sm]=[parseInt(s.split('-')[0]),parseInt(s.split('-')[1])-1];const[ey,em]=[parseInt(e.split('-')[0]),parseInt(e.split('-')[1])-1];
  while(sy<ey||(sy===ey&&sm<=em)){ms.push(`${sy}-${String(sm+1).padStart(2,'0')}`);sm++;if(sm>11){sm=0;sy++;}}
  return ms;
}

function buildReportData(months){
  let savingsInRange=0;
  const memberRows=data.members.map(m=>{
    const paid=months.reduce((a,ms)=>a+data[m].contributions.filter(c=>c.month===ms).reduce((x,y)=>x+Number(y.amt),0),0);
    savingsInRange+=paid;
    const expected=months.reduce((a,ms)=>a+getMonthlyTarget(ms),0);
    const trueShortfall=calcArrearsAndFines(m);
    const status=paid>=expected?'COMPLETE':paid>0?'PARTIAL':'PENDING';
    return{name:m,paid,expected,trueShortfall,status};
  });
  const S=getGlobalStats();
  const loanRows=[];
  data.members.forEach(m=>{data[m].loans.filter(l=>l.type==='LOAN').forEach((loan,idx)=>{const bal=calcLoanBalance(loan,idx+1,m);if(bal&&!bal.isFullyPaid)loanRows.push({member:m,loanId:idx+1,date:loan.date,...bal});});});
  return{S,memberRows,loanRows,savingsInRange,months};
}

function drawLoginIcon(){
  const c=document.getElementById('loginIcon');if(!c)return;
  const ctx=c.getContext('2d'),s=68;
  const r=s*0.13;ctx.beginPath();ctx.moveTo(r,0);ctx.lineTo(s-r,0);ctx.quadraticCurveTo(s,0,s,r);ctx.lineTo(s,s-r);ctx.quadraticCurveTo(s,s,s-r,s);ctx.lineTo(r,s);ctx.quadraticCurveTo(0,s,0,s-r);ctx.lineTo(0,r);ctx.quadraticCurveTo(0,0,r,0);ctx.closePath();ctx.fillStyle='#0d0d0d';ctx.fill();
  ctx.beginPath();ctx.arc(s/2,s/2,s*0.42,0,2*Math.PI);ctx.strokeStyle='#B08D57';ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#B08D57';ctx.font=`900 ${Math.round(s*0.48)}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('E',s/2,s*0.53);
}

        <span class="f-op">+</span><span class="f-pill" style="background:#1A3A1A;color:#90CAF9">Cash In ${S.cashIn.toLocaleString()}</span>
        <span class="f-op" style="color:#555">−</span><span class="f-pill" style="background:#3B1A1A;color:#EF9A9A">Expenses ${S.expenses.toLocaleString()}</span>
        <span class="f-op" style="color:#555">−</span><span class="f-pill" style="background:#3B1A1A;color:#FFCC80">Loans ${S.activeLoanPrincipal.toLocaleString()}</span>
        <span class="f-op" style="color:#555">−</span><span class="f-pill" style="background:#2A1A3B;color:#CE93D8">Invest ${S.investments.toLocaleString()}</span>
      </div>
    </div>
    <!-- SACCO Stats -->

      <div class="stat-box" style="border-color:#BBDEFB"><div class="stat-label">Cash In / Donations</div><div class="stat-value" style="color:var(--blue)">UGX ${S.cashIn.toLocaleString()}</div><div class="stat-sub">External funds</div></div>

function renderLoanCards(mName){
  const loans=data[mName].loans.filter(l=>l.type==='LOAN');
  if(!loans.length)return'';
  let html=`<div class="card"><div class="card-title">💳 My Loans</div>`;
  loans.forEach((loan,idx)=>{
    const lid=idx+1,bal=calcLoanBalance(loan,lid,mName);if(!bal)return;
    const progress=bal.totalRepaid>0?Math.min(100,Math.round(bal.totalRepaid/(bal.totalRepaid+bal.outstanding)*100)):0;
    let cls,headerCls,statusBadge,progressCls;
    if(bal.loanStatus==='PAID'){
      cls='lc-paid';headerCls='lc-paid';progressCls='progress-green';
      statusBadge=`<span class="badge badge-paid">✅ FULLY PAID</span>`;
    } else if(bal.loanStatus==='PARTIAL'){
      cls='lc-partial';headerCls='lc-partial';progressCls='progress-amber';
      statusBadge=`<span class="badge badge-partial">⚡ PARTIALLY PAID</span>`;
      if(bal.isOverdue)statusBadge+=` <span class="badge badge-overdue">OVERDUE</span>`;
    } else {
      cls='lc-outstanding';headerCls='lc-outstanding';progressCls='progress-amber';
      statusBadge=bal.isOverdue?`<span class="badge badge-overdue">⚠️ OVERDUE</span>`:`<span class="badge badge-outstanding">🔴 OUTSTANDING</span>`;
    }
    html+=`<div class="loan-card ${cls}">
      <div class="loan-card-header ${headerCls}">
        <div><div style="font-weight:700;font-size:13px">Loan #${lid}</div><div style="font-size:11px;color:#888;margin-top:1px">Issued: ${loan.date} &nbsp;·&nbsp; ${bal.monthsElapsed} anniversary(ies) passed${loan.purpose?` &nbsp;·&nbsp; <em>${loan.purpose}</em>`:''}</div></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${statusBadge}</div>
      </div>
      <div class="loan-card-body">
        ${!bal.isFullyPaid?`<div class="loan-progress-label"><span>${progress}% repaid</span><span>UGX ${bal.totalRepaid.toLocaleString()} of UGX ${(bal.totalRepaid+bal.outstanding).toLocaleString()} total</span></div>
        <div class="progress-wrap"><div class="progress-bar ${progressCls}" style="width:${progress}%"></div></div>`:''}
        <div class="stat-grid" style="margin-top:12px;gap:8px">
          <div class="stat-box"><div class="stat-label">Principal</div><div class="stat-value" style="font-size:0.9rem">UGX ${bal.principal.toLocaleString()}</div></div>
          <div class="stat-box"><div class="stat-label">Total Repaid</div><div class="stat-value" style="font-size:0.9rem;color:var(--green)">UGX ${bal.totalRepaid.toLocaleString()}</div></div>
          <div class="stat-box"><div class="stat-label">Interest Accrued</div><div class="stat-value" style="font-size:0.9rem;color:#888">UGX ${bal.interestAccrued.toLocaleString()}</div></div>
          <div class="stat-box" style="${bal.isFullyPaid?'background:#E8F5E9;border-color:#C8E6C9':'background:#FFEBEE;border-color:#FFCDD2'}"><div class="stat-label">Outstanding Balance</div><div class="stat-value" style="font-size:0.9rem;color:${bal.isFullyPaid?'var(--green)':'var(--red)'}">UGX ${bal.outstanding.toLocaleString()}</div></div>
        </div>
        ${bal.isOverdue?`<div class="alert alert-danger" style="margin-top:10px;font-size:11.5px"><span>⚠️</span><span>No repayments recorded yet. ${bal.monthsElapsed} anniversary(ies) have passed — balance continues to compound.</span></div>`:''}
      </div>
    </div>`;
  });
  return html+`</div>`;
}

// ─── LEDGER ───────────────────────────────────
function renderLedger(isAdmin,activeMember){
  const now=new Date();let rows='';let cy=2024,cm=2;
  while(cy<now.getFullYear()||(cy===now.getFullYear()&&cm<=now.getMonth()+1)){
    const ms=`${cy}-${String(cm).padStart(2,'0')}`;
    const paid=data[activeMember].contributions.filter(c=>c.month===ms).reduce((a,b)=>a+Number(b.amt),0);
    const target=getMonthlyTarget(ms),gap=Math.max(0,target-paid),penalty=calcMonthPenalty(activeMember,ms),shortfall=gap+penalty;
    const badge=paid>=target?'<span class="badge badge-comp">COMPLETE</span>':paid>0?'<span class="badge badge-part">PARTIAL</span>':'<span class="badge badge-pend">PENDING</span>';
    rows+=`<tr><td>${ms}</td><td>UGX ${paid.toLocaleString()}</td><td>UGX ${target.toLocaleString()}</td><td>${badge}</td><td style="${shortfall>0?'color:var(--red);font-weight:700':'color:var(--green)'}">UGX ${shortfall.toLocaleString()}</td></tr>`;
    cm++;if(cm>12){cm=1;cy++;}
  }
  const loans=data[activeMember].loans.filter(l=>l.type==='LOAN');
  let picker='';
  if(isAdmin)picker=`<div class="card" style="border:2px solid var(--gold);padding:14px;margin-bottom:14px">
    <label>👤 Admin: View Any Member's Ledger</label>
    <select style="margin-top:5px" onchange="lastSelectedMember=this.value;render()">
      ${data.members.map(m=>`<option value="${m}" ${m===activeMember?'selected':''}>${m}</option>`).join('')}
    </select></div>`;
  return`${picker}
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px">
        <div class="card-title" style="margin:0;border:none;padding:0">📒 Savings Timeline — ${activeMember}</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap">
          <button class="ghost sm" onclick="exportMemberCSV('${activeMember}')">📥 CSV</button>
          <button class="print-btn sm" onclick="triggerMemberPrint('${activeMember}')">🖨️ Print My Ledger</button>

// ─── MINUTES ──────────────────────────────────
function renderMinutes(isAdmin){
  const mins=(data.minutes||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  let html=`<div class="card" style="border:2px solid var(--gold)"><div class="card-title">📋 Meeting Minutes</div>`;
  if(isAdmin)html+=`<details style="margin-bottom:14px"><summary style="cursor:pointer;font-weight:600;font-size:13px;padding:6px 0;color:var(--gold)">➕ Add New Minutes Entry</summary><div style="margin-top:10px"><label>Meeting Title</label><input type="text" id="minTitle" placeholder="e.g. Monthly General Meeting — January 2026"><label>Meeting Date</label><input type="date" id="minDate" value="${new Date().toISOString().split('T')[0]}"><label>Minutes Text</label><textarea id="minBody" placeholder="Type or paste the full minutes here..."></textarea><button class="gold full" onclick="addMinutes()">💾 Save Minutes</button></div></details>`;
  if(!mins.length)html+=`<p style="color:#aaa;font-size:13px;padding:8px 0">No meeting minutes recorded yet.</p>`;
  else mins.forEach((m,i)=>{const key=`min_${i}`,isOpen=expandedMinutes[key];html+=`<div class="minutes-card"><div class="minutes-header" onclick="toggleMinutes('${key}')"><div><div style="font-size:13px;font-weight:700">${m.title}</div><div style="font-size:11px;color:#aaa;margin-top:2px">📅 ${m.date}</div></div><div style="display:flex;align-items:center;gap:7px">${isAdmin?`<button class="del" onclick="event.stopPropagation();delMinutes(${i})">✕</button>`:''}<span style="color:#ccc">${isOpen?'▲':'▼'}</span></div></div><div class="minutes-body ${isOpen?'open':''}">${escapeHTML(m.body)}</div></div>`;});
  return html+`</div>`;
}
function toggleMinutes(k){expandedMinutes[k]=!expandedMinutes[k];render();}
function escapeHTML(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function addMinutes(){const title=document.getElementById('minTitle').value.trim(),date=document.getElementById('minDate').value,body=document.getElementById('minBody').value.trim();if(!title||!date||!body){showToast("⚠️ Fill in all fields","warn");return;}if(!data.minutes)data.minutes=[];data.minutes.push({title,date,body});saveData();}
function delMinutes(i){if(!confirm("Delete this entry?"))return;data.minutes.splice(i,1);saveData();}
function addWaiver(){
  const member=document.getElementById('wvMember').value;
  const month=document.getElementById('wvMonth').value;
  const reason=document.getElementById('wvReason').value.trim();
  if(!member||!month||!reason){showToast("⚠️ Fill in all waiver fields","warn");return;}
  if((data.waivers||[]).some(w=>w.member===member&&w.month===month)){showToast("⚠️ Waiver already exists for this member/month","warn");return;}
  if(!data.waivers)data.waivers=[];
  data.waivers.push({member,month,reason,date:new Date().toISOString().split('T')[0],by:user.name});
  saveData();
}
function delWaiver(i){if(!confirm("Remove this waiver? Penalty will be reinstated."))return;data.waivers.splice(i,1);saveData();}

function addMember(){const name=document.getElementById('newMName').value.trim(),pin=document.getElementById('newMPin').value;if(!name){showToast("⚠️ Enter a full name","warn");return;}if(!pin||pin.length<4){showToast("⚠️ PIN must be ≥ 4 characters","warn");return;}if(data.members.includes(name)){showToast("⚠️ Member already exists","warn");return;}data.members.push(name);data[name]={pin,contributions:[],loans:[]};if(_nmp){if(!data.photos)data.photos={};data.photos[name]=_nmp;_nmp=null;}saveData();}

// ─── MONTHLY REPORT ───────────────────────────
function renderMonthlyReport(){
  const now=new Date(),curMs=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  let pm=[],pt='';
  if(reportMode==='single'){pm=[reportMonth];pt=`Month: ${reportMonth}`;}
  else if(reportMode==='range'){pm=reportStart&&reportEnd&&reportStart<=reportEnd?getMonthRange(reportStart,reportEnd):[];pt=`Range: ${reportStart} → ${reportEnd}`;}
  else{pm=getMonthRange("2024-02",curMs);pt=`All-time`;}
  let total=0;
  const rows=data.members.map(m=>{
    const paid=pm.reduce((a,ms)=>a+data[m].contributions.filter(c=>c.month===ms).reduce((x,y)=>x+Number(y.amt),0),0);total+=paid;
    const expected=pm.reduce((a,ms)=>a+getMonthlyTarget(ms),0),ts=calcArrearsAndFines(m);
    const badge=paid>=expected?'<span class="badge badge-comp">COMPLETE</span>':paid>0?'<span class="badge badge-part">PARTIAL</span>':'<span class="badge badge-pend">PENDING</span>';
    return`<tr><td>${m}</td><td>UGX ${paid.toLocaleString()}</td><td>UGX ${expected.toLocaleString()}</td><td style="color:var(--red);font-weight:700">UGX ${ts.toLocaleString()}</td><td>${badge}</td></tr>`;
  }).join('');
  const paidCount=pm.length?data.members.filter(m=>pm.reduce((a,ms)=>a+data[m].contributions.filter(c=>c.month===ms).reduce((x,y)=>x+Number(y.amt),0),0)>=pm.reduce((a,ms)=>a+getMonthlyTarget(ms),0)).length:0;
  const S=getGlobalStats();
  return`
  <!-- SACCO Reports -->
  <div class="card" style="border:2px solid var(--gold)"><div class="card-title">📅 SACCO Reports & Print Centre</div>
    <label style="font-size:11px;font-weight:700;margin-bottom:8px;display:block">Report Type</label>

      <button class="mode-btn ${reportMode==='range'?'active':''}" onclick="reportMode='range';render()">📅 Date Range</button>
      <button class="mode-btn ${reportMode==='overall'?'active':''}" onclick="reportMode='overall';render()">🗂️ All-Time</button>
    </div>
    ${reportMode==='single'?`<div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap"><div style="flex:1;min-width:170px"><label>Month</label><input type="month" style="margin:0" value="${reportMonth}" onchange="reportMonth=this.value;render()"></div><button class="print-btn" onclick="printSingleMonth()">🖨️ Print / PDF</button></div>`
    :reportMode==='range'?`<div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap"><div style="flex:1;min-width:140px"><label>Start</label><input type="month" style="margin:0" value="${reportStart}" onchange="reportStart=this.value;render()"></div><div style="flex:1;min-width:140px"><label>End</label><input type="month" style="margin:0" value="${reportEnd}" onchange="reportEnd=this.value;render()"></div><button class="print-btn" onclick="printRange()">🖨️ Print / PDF</button></div>`
    :`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><p style="font-size:13px;color:#888;flex:1">Feb 2024 to present (${pm.length} months).</p><button class="print-btn" onclick="printOverall()">🖨️ Print / PDF</button></div>`}
    <div style="background:#fafafa;border:1px solid #f0f0f0;border-radius:8px;padding:8px 12px;margin-top:10px;font-size:12px;color:#888">
      <strong style="color:#555">${pt}</strong> — ${pm.length} month(s) | Period savings: <strong>UGX ${total.toLocaleString()}</strong> | Fully paid: <strong>${paidCount}/${data.members.length}</strong>
    </div>
  </div>

  <!-- Financial Summary -->
  <div class="card"><div class="card-title">Financial Summary (All-Time)</div>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-label">Net Cash</div><div class="stat-value">UGX ${S.netCash.toLocaleString()}</div></div>
      <div class="stat-box"><div class="stat-label">Gross Savings</div><div class="stat-value">UGX ${S.grossSavings.toLocaleString()}</div></div>
      <div class="stat-box" style="border-color:#C8E6C9"><div class="stat-label">Interest Earned</div><div class="stat-value" style="color:var(--green)">UGX ${S.interestCollected.toLocaleString()}</div></div>
      <div class="stat-box" style="border-color:#BBDEFB"><div class="stat-label">Cash In</div><div class="stat-value" style="color:var(--blue)">UGX ${S.cashIn.toLocaleString()}</div></div>
      <div class="stat-box" style="border-color:#FFCDD2"><div class="stat-label">Expenses</div><div class="stat-value" style="color:var(--red)">UGX ${S.expenses.toLocaleString()}</div></div>
      <div class="stat-box" style="border-color:#E1BEE7"><div class="stat-label">Investments</div><div class="stat-value" style="color:#6A1B9A">UGX ${S.investments.toLocaleString()}</div></div>
      <div class="stat-box" style="border-color:#FFE082"><div class="stat-label">Active Loan Principal</div><div class="stat-value" style="color:var(--yellow)">UGX ${S.activeLoanPrincipal.toLocaleString()}</div></div>
    </div>
  </div>

  <!-- Member Savings Preview -->
  <div class="card"><div class="card-title">Member Savings — ${pt}</div>
    <p style="font-size:11px;color:#aaa;margin-bottom:10px">Shortfall = unpaid gap + full penalty as of today.</p>
    ${pm.length?`<div class="table-wrap"><table><tr><th>Member</th><th>Paid</th><th>Expected</th><th>Total Shortfall (incl. penalties)</th><th>Status</th></tr>${rows}</table></div>`:'<p style="color:#aaa;font-size:13px">Select a valid period above.</p>'}
  </div>

  <!-- Dividend Calculator -->
  <div class="card" style="border:2px solid #1B5E20"><div class="card-title">💰 Year-End Dividend Calculator</div>
    <p style="font-size:12px;color:#888;margin-bottom:12px">Calculates each member's share of interest collected in a given year, proportional to their savings that year. Interest collected = loan repayments received above the original principal.</p>
    <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px">
      <div style="flex:1;min-width:140px"><label>Select Year</label><select onchange="dividendYear=parseInt(this.value);render()">${[2024,2025,2026,2027].map(y=>`<option value="${y}" ${y===dividendYear?'selected':''}>${y}</option>`).join('')}</select></div>
    </div>
    ${(()=>{
      // Total interest collected this year = sum of (repayments above principal) for loans repaid in this year
      let totalInterestYear=0;
      const memberSavingsYear={};
      let totalSavingsYear=0;
      data.members.forEach(m=>{
        const ySavings=data[m].contributions.filter(c=>c.month&&c.month.startsWith(String(dividendYear))).reduce((a,b)=>a+Number(b.amt),0);
        memberSavingsYear[m]=ySavings;totalSavingsYear+=ySavings;
        // Interest collected this year from this member's loans
        data[m].loans.filter(l=>l.type==='LOAN').forEach((loan,idx)=>{
          const principal=Number(loan.amt);
          const repInYear=data[m].loans.filter(r=>r.type==='REPAYMENT'&&String(r.loanId)===String(idx+1)&&r.date&&r.date.startsWith(String(dividendYear))).reduce((a,r)=>a+Number(r.amt),0);
          const repAllTime=data[m].loans.filter(r=>r.type==='REPAYMENT'&&String(r.loanId)===String(idx+1)).reduce((a,r)=>a+Number(r.amt),0);
          // Only count interest portion of repayments in this year
          const repBefore=repAllTime-repInYear;
          const interestInYear=Math.max(0,Math.min(repInYear,Math.max(0,repAllTime-principal))-Math.max(0,repBefore-principal));
          totalInterestYear+=Math.max(0,interestInYear);
        });
      });
      if(totalSavingsYear===0) return `<div class="alert alert-info"><span>ℹ️</span><span>No savings recorded for ${dividendYear}.</span></div>`;
      const rows=data.members.map(m=>{
        const share=totalSavingsYear>0?memberSavingsYear[m]/totalSavingsYear:0;
        const dividend=Math.round(totalInterestYear*share);
        const pct=(share*100).toFixed(1);
        return`<tr><td>${m}</td><td>UGX ${memberSavingsYear[m].toLocaleString()}</td><td>${pct}%</td><td style="font-weight:700;color:#2E7D32">UGX ${dividend.toLocaleString()}</td></tr>`;
      }).join('');
      return`<div style="background:#f5fff7;border:1px solid #C8E6C9;border-radius:8px;padding:12px 16px;margin-bottom:12px;display:flex;gap:20px;flex-wrap:wrap">
        <div><div class="stat-label">Total Interest Collected ${dividendYear}</div><div style="font-weight:700;font-size:1.1rem;color:#2E7D32">UGX ${totalInterestYear.toLocaleString()}</div></div>
        <div><div class="stat-label">Total Savings (Base) ${dividendYear}</div><div style="font-weight:700;font-size:1.1rem">UGX ${totalSavingsYear.toLocaleString()}</div></div>
      </div>
      <div class="table-wrap"><table><tr><th>Member</th><th>Savings in ${dividendYear}</th><th>Share %</th><th>Dividend Entitlement</th></tr>${rows}</table></div>
      <p style="font-size:10.5px;color:#aaa;margin-top:8px">ℹ️ This is a calculation guide. Record actual dividend payments as expenses in Admin Hub.</p>`;
    })()}
  </div>

  <!-- All Members Ledger PDF -->
  <div class="card" style="border:2px solid #333"><div class="card-title">📥 All Members Combined Ledger (PDF)</div>
    <p style="font-size:12px;color:#888;margin-bottom:12px">Downloads a combined PDF with every member's individual savings timeline and loan summary — each member on their own page(s). Choose a date range to scope the savings data.</p>
    <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
      <div style="flex:1;min-width:140px"><label>Start Month</label><input type="month" style="margin:0" value="${allMembersStart}" onchange="allMembersStart=this.value"></div>
      <div style="flex:1;min-width:140px"><label>End Month</label><input type="month" style="margin:0" value="${allMembersEnd}" onchange="allMembersEnd=this.value"></div>
      <button class="print-btn" onclick="triggerAllMembersPrint()">📥 Download All Members PDF</button>
    </div>
    <p style="font-size:10.5px;color:#aaa;margin-top:8px">ℹ️ Each member's page shows their savings for the selected period. Loan data shown is all-time (current position).</p>
  </div>`;
}

// ─── SETTINGS ─────────────────────────────────
function renderSettings(){
  const ph=getPhoto(user.name);
  const isAdmin=user.name===PRIMARY_ADMIN||user.name===SECONDARY_ADMIN;
  const curTarget=(data.settings&&data.settings.monthlyTarget)?data.settings.monthlyTarget:100000;
  const adminSection=isAdmin?`
    <div class="divider"></div>
    <div style="font-weight:700;font-size:13px;margin-bottom:10px;color:var(--gold)">⚙️ Admin — SACCO Settings</div>

    <label>Default Monthly Target (UGX)</label>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
      <input type="number" id="newTarget" value="${curTarget}" style="margin:0;flex:1">
      <button class="gold" onclick="saveMonthlyTarget()" style="margin:0;white-space:nowrap">Save Target</button>
    </div>
    <p style="font-size:10.5px;color:#aaa;margin-bottom:14px">ℹ️ This applies to all future months. Historical months (Feb–Jul 2024 = 80K) are preserved.</p>

    <div style="font-weight:700;font-size:13px;margin-bottom:10px">💾 Data Backup & Restore</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="ghost" onclick="downloadBackup()" style="flex:1">📥 Download Backup (JSON)</button>
      <label style="flex:1;cursor:pointer">
        <span style="display:block;padding:8px 15px;border:1.5px solid #e5e5e5;border-radius:8px;text-align:center;font-size:12px;font-weight:600;color:#666;background:#fff">📤 Restore from Backup</span>
        <input type="file" accept=".json" style="display:none" onchange="restoreBackup(event)">
      </label>
    </div>
    <p style="font-size:10.5px;color:#aaa;margin-top:8px">⚠️ Restore overwrites ALL data. Download a backup first.</p>
  `:'';
  return`<div class="card" style="max-width:520px"><div class="card-title">🔐 My Settings</div>
    <div style="text-align:center;margin-bottom:18px">
      <div class="photo-preview">${ph?`<img src="${ph}" alt="${user.name}">`:'👤'}</div>
      <div style="font-weight:700;margin-bottom:8px">${user.name}</div>
      <label style="cursor:pointer;display:inline-block"><span style="padding:8px 16px;background:var(--gold);color:#111;border-radius:8px;font-weight:600;font-size:12px;display:inline-block">📷 ${ph?'Change':'Upload'} My Photo</span><input type="file" accept="image/*" style="display:none" onchange="uploadMyPhoto(event)"></label>
      ${ph?`<br><button class="del" style="margin-top:8px" onclick="removeMyPhoto()">Remove Photo</button>`:''}
    </div>
    <div class="divider"></div>
    <div style="font-weight:700;font-size:13px;margin-bottom:10px">Change PIN</div>
    <label>Current PIN</label><input type="password" id="oldPin" placeholder="Current PIN" maxlength="20">
    <label>New PIN</label><input type="password" id="newPin" placeholder="New PIN (min 4 chars)" maxlength="20">
    <label>Confirm New PIN</label><input type="password" id="confPin" placeholder="Re-enter new PIN" maxlength="20">
    <button class="gold full" onclick="changePin()">Update PIN</button>
    ${adminSection}
  </div>`;
}
function uploadMyPhoto(e){const f=e.target.files[0];if(!f)return;showToast("⏳ Compressing…","info");compressPhoto(f,b64=>{if(!data.photos)data.photos={};data.photos[user.name]=b64;saveData();});}
function removeMyPhoto(){if(!data.photos)return;delete data.photos[user.name];saveData();}
function changePin(){const o=document.getElementById('oldPin').value,n=document.getElementById('newPin').value,c=document.getElementById('confPin').value;if(o!==data[user.name].pin){showToast("❌ Current PIN incorrect","danger");return;}if(!n||n.length<4){showToast("⚠️ PIN must be ≥ 4 characters","warn");return;}if(n!==c){showToast("❌ PINs do not match","danger");return;}data[user.name].pin=n;saveData();}

// ─── EDIT MODAL ───────────────────────────────
function openEdit(cat,mem,idx){
  let e;
  if(cat==='S')e={...data[mem].contributions[idx]};else if(cat==='L')e={...data[mem].loans[idx]};else if(cat==='C')e={...data.cashIn[idx]};else if(cat==='E')e={...data.expenses[idx]};else if(cat==='I')e={...data.investments[idx]};
  editModalData={cat,mem,idx,entry:e};render();
}
function renderEditModal(){
  const{cat,mem,idx,entry}=editModalData;
  const labels={S:'Savings',L:'Loan/Repayment',C:'Cash In',E:'Expense',I:'Investment'};
  let fields='';
  if(cat==='S')fields=`<label>Amount</label><input type="number" id="eAmt" value="${entry.amt}"><label>Date</label><input type="date" id="eDate" value="${entry.date}"><label>Month</label><input type="month" id="eMon" value="${entry.month}">`;
  else if(cat==='L')fields=`<label>Amount</label><input type="number" id="eAmt" value="${entry.amt}"><label>Date</label><input type="date" id="eDate" value="${entry.date}">`;
  else if(cat==='C')fields=`<label>Amount</label><input type="number" id="eAmt" value="${entry.amt}"><label>Date</label><input type="date" id="eDate" value="${entry.date}"><label>Source</label><input type="text" id="eDesc" value="${entry.source||''}">`;
  else fields=`<label>Amount</label><input type="number" id="eAmt" value="${entry.amt}"><label>Date</label><input type="date" id="eDate" value="${entry.date}"><label>Description</label><input type="text" id="eDesc" value="${entry.reason||''}">`;
  return`<div class="modal-overlay" onclick="closeEdit(event)"><div class="modal"><button class="modal-close" onclick="editModalData=null;render()">✕</button><div style="font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:4px">Edit Entry</div><p style="font-size:12px;color:#aaa;margin-bottom:14px">${labels[cat]}${mem?' — '+mem:''}</p>${fields}<button class="gold full" onclick="saveEdit()" style="margin-top:6px">💾 Save Changes</button></div></div>`;
}
function closeEdit(e){if(e.target.classList.contains('modal-overlay')){editModalData=null;render();}}
function saveEdit(){
  const{cat,mem,idx,entry}=editModalData;const amt=Number(document.getElementById('eAmt').value),date=document.getElementById('eDate').value;
  if(!amt||!date){showToast("⚠️ Fill in all fields","warn");return;}
  if(cat==='S'){const mon=document.getElementById('eMon').value;data[mem].contributions[idx]={...entry,amt,date,month:mon};}
  else if(cat==='L'){data[mem].loans[idx]={...entry,amt,date};}
  else if(cat==='C'){data.cashIn[idx]={...entry,amt,date,source:document.getElementById('eDesc').value};}
  else if(cat==='E'){data.expenses[idx]={...entry,amt,date,reason:document.getElementById('eDesc').value};}
  else if(cat==='I'){data.investments[idx]={...entry,amt,date,reason:document.getElementById('eDesc').value};}
  editModalData=null;saveData();
}

// ─── POST INFLOW / OUTFLOW ────────────────────
function postInflow(){
  const m=document.getElementById("mI").value,t=currentInflowType,amt=Number(document.getElementById("amI").value),date=document.getElementById("daMan").value;
  if(!amt||amt<=0){showToast("⚠️ Enter a valid amount","warn");return;}if(!date){showToast("⚠️ Enter a date","warn");return;}
  if(t==='S'){const mStr=document.getElementById("moI").value;data[m].contributions.push({amt,date,month:mStr});}
  else if(t==='R'){const lID=document.getElementById("lID")?document.getElementById("lID").value:null;if(!lID){showToast("⚠️ No loan selected","warn");return;}data[m].loans.push({amt,date,type:'REPAYMENT',loanId:lID});}
  else if(t==='C'){const src=document.getElementById("descIn")?document.getElementById("descIn").value||"Donation":"Donation";data.cashIn.push({amt,date,source:src});}
  saveData();
}
function postOutflow(){
  const t=document.getElementById("tO").value,amt=Number(document.getElementById("amO").value),desc=document.getElementById("reO").value,m=lastSelectedMember||user.name,date=document.getElementById("daOut").value;
  if(!amt||amt<=0){showToast("⚠️ Enter a valid amount","warn");return;}
  if(t==='L')data[m].loans.push({amt,date,type:'LOAN',purpose:desc});else if(t==='E')data.expenses.push({amt,reason:desc,date});else if(t==='I')data.investments.push({amt,reason:desc,date});
  saveData();
}
function del(cat,mem,idx){if(!confirm("Delete this entry?"))return;if(cat==='S')data[mem].contributions.splice(idx,1);else if(cat==='L')data[mem].loans.splice(idx,1);else if(cat==='C')data.cashIn.splice(idx,1);else if(cat==='E')data.expenses.splice(idx,1);else if(cat==='I')data.investments.splice(idx,1);saveData();}

// ─── CSV ──────────────────────────────────────
function exportMemberCSV(name){const rows=[["Date","Type","Ref","Amount"]];data[name].contributions.forEach(c=>rows.push([c.date,"Savings",c.month,c.amt]));data[name].loans.forEach(l=>rows.push([l.date,l.type,l.loanId?'Loan '+l.loanId:'Principal',l.amt]));downloadCSV(`${name}_Statement.csv`,rows);}
function exportMasterAudit(){const rows=[["Entity","Date","Type","Ref","Amount"]];data.members.forEach(m=>{data[m].contributions.forEach(c=>rows.push([m,c.date,"Savings",c.month,c.amt]));data[m].loans.forEach(l=>rows.push([m,l.date,l.type,l.loanId?'Loan '+l.loanId:'Principal',l.amt]));});data.cashIn.forEach(c=>rows.push(["SYSTEM",c.date,"Cash In",c.source,c.amt]));data.expenses.forEach(e=>rows.push(["SYSTEM",e.date,"Expense",e.reason,e.amt]));data.investments.forEach(i=>rows.push(["SYSTEM",i.date,"Investment",i.reason,i.amt]));downloadCSV(`SACCO_AUDIT_${new Date().toISOString().split('T')[0]}.csv`,rows);}
function downloadCSV(fn,rows){const a=document.createElement("a");a.setAttribute("href",encodeURI("data:text/csv;charset=utf-8,"+rows.map(r=>r.join(",")).join("\n")));a.setAttribute("download",fn);document.body.appendChild(a);a.click();document.body.removeChild(a);}

// ─── TOAST ────────────────────────────────────
function showToast(msg,type="success"){
  const ex=document.getElementById('toast');if(ex)ex.remove();
  const colors={success:'#2E7D32',danger:'#C62828',warn:'#E65100',info:'#1565C0'};
  const t=document.createElement('div');t.id='toast';
  t.style.cssText=`position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:${colors[type]||'#333'};color:#fff;padding:10px 20px;border-radius:30px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.25);font-family:'DM Sans',sans-serif;white-space:nowrap`;
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity 0.4s';setTimeout(()=>t.remove(),400);},3000);
}

// ─── BOOT ─────────────────────────────────────
setupPWA();
loadData();
</script>
</body>
