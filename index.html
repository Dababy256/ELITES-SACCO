<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elites SACCO Final Master</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="data:application/manifest+json,{'name':'Elites SACCO','short_name':'Elites','start_url':'.','display':'standalone','background_color':'#F3E9D2','theme_color':'#111111'}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">

<style>
    body{font-family:'Segoe UI', sans-serif; background:#F3E9D2; margin:0; color:#111}
    header{background:#111; color:#fff; padding:15px; display:flex; align-items:center; gap:12px; border-bottom:4px solid #B08D57}
    #logoSlot img{height:50px; width:50px; border-radius:50%; border:2px solid #B08D57; background:#fff; object-fit:cover}
    .container{padding:16px; max-width:1150px; margin:auto}
    .card{background:#fff; padding:20px; border-radius:12px; margin-bottom:16px; box-shadow:0 4px 10px rgba(0,0,0,0.1)}
    h2, h3{margin-top:0; color:#111; border-bottom:2px solid #B08D57; padding-bottom:8px}
    table{width:100%; border-collapse:collapse; font-size:11px; margin-bottom:15px; background: white}
    th,td{border:1px solid #ddd; padding:8px; text-align:left}
    th{background:#B08D57; color:#000}
    button{padding:8px 12px; border:none; border-radius:6px; background:#111; color:#fff; cursor:pointer; font-weight:bold; margin:2px}
    button.gold{background:#B08D57; color:#000}
    button.del{background:#ff4d4d; color:white; padding:4px 8px; font-size:10px}
    input,select{padding:10px; width:100%; margin-bottom:10px; border:1px solid #ccc; border-radius:8px; box-sizing: border-box}
    .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:12px}
    .stat-box{padding:12px; border-radius:8px; background:#f9f9f9; border:1px solid #ddd; color:#111}
    .badge{padding:3px 8px; border-radius:4px; font-size:10px; font-weight:bold}
    .badge-comp{background:#C8E6C9; color:#2E7D32}
    .badge-part{background:#FFF9C4; color:#F57F17}
    .badge-pend{background:#FFCDD2; color:#C62828}
</style>
</head>
<body>

<header>
    <div id="logoSlot"></div>
    <div style="flex-grow:1"><strong>ELITES SACCO</strong><br><small id="userLabel">Master System</small></div>
</header>

<div class="container" id="app"></div>

<script>
const BIN_ID = "6971f3eb43b1c97be94154dc"; 
const MASTER_KEY = "$2a$10$83AEiP9GsrLhSQIC8.nuW.6QtHG5XVzJElaL67zasDR0h8BYGLsQu";
const PRIMARY_ADMIN = "Apule Gerald Humble";
const SECONDARY_ADMIN = "Ameny Ronald";

let user = null;
let data = {};
let lastSelectedMember = null;
let currentInflowType = "S";

async function loadData() {
    try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {headers:{'X-Master-Key':MASTER_KEY}});
        const json = await res.json();
        data = json.record;

        const oldName = "OKULLU DAVID LAURANCE";
        const newName = "OKULLU DAVID LAURANCE";
        if(data[oldName]) {
            data[newName] = data[oldName];
            delete data[oldName];
            data.members = data.members.map(m => m === oldName ? newName : m);
        }

        if(!data.expenses) data.expenses = [];
        if(!data.investments) data.investments = [];
        if(!data.cashIn) data.cashIn = [];
        if(data.logo) document.getElementById("logoSlot").innerHTML = `<img src="${data.logo}">`;
        render();
    } catch (e) { console.error("Sync Error"); }
}

async function saveData() {
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method:'PUT', headers:{'Content-Type':'application/json','X-Master-Key':MASTER_KEY},
        body: JSON.stringify(data)
    });
    render();
}

function getMonthlyTarget(monthStr) {
    const year = parseInt(monthStr.split('-')[0]);
    const month = parseInt(monthStr.split('-')[1]);
    return (year === 2024 && month >= 2 && month <= 7) ? 80000 : 100000;
}

function calcArrearsAndFines(mName) {
    let totalArrears = 0;
    const today = new Date();
    const currentMonthStr = today.toISOString().slice(0, 7);
    let checkY = 2024, checkM = 2;

    while (checkY < today.getFullYear() || (checkY === today.getFullYear() && checkM <= today.getMonth() + 1)) {
        let mStr = `${checkY}-${String(checkM).padStart(2,'0')}`;
        let target = getMonthlyTarget(mStr);
        let contribs = data[mName].contributions.filter(c => c.month === mStr);
        let paid = contribs.reduce((a,b)=>a+Number(b.amt), 0);
        
        if (paid < target) {
            let monthBalance = target - paid;
            let penalty = 0;
            let onTime = contribs.some(c => parseInt(c.date.split('-')[2]) <= 10);
            if (!onTime) {
                if (mStr !== currentMonthStr) penalty = 15000;
                else if (today.getDate() >= 10) penalty = Math.min((Math.floor((today.getDate() - 10) / 7) + 1) * 5000, 15000);
            }
            totalArrears += (monthBalance + penalty);
        }
        checkM++; if(checkM > 12) { checkM = 1; checkY++; }
    }
    return totalArrears;
}

function getMemberLoanDebt(mName) {
    let debt = 0;
    data[mName].loans.filter(l => l.type === 'LOAN').forEach((loan, idx) => {
        let p = Number(loan.amt);
        let paid = data[mName].loans.filter(r => r.type === 'REPAYMENT' && r.loanId == (idx+1)).reduce((a, b) => a + Number(b.amt), 0);
        if (p - paid > 0) debt += (p - paid);
    });
    return debt;
}

function render() {
    const app = document.getElementById("app");
    if(!user) {
        let h = `<div class="card" style="text-align:center"><h2>Login</h2><div class="grid">`;
        data.members.forEach(m => h += `<button onclick="checkLogin('${m}')">${m}</button>`);
        app.innerHTML = h + `</div></div>`;
        return;
    }

    const isAdmin = user.name === PRIMARY_ADMIN || user.name === SECONDARY_ADMIN;
    const activeMember = (isAdmin && lastSelectedMember) ? lastSelectedMember : user.name;

    let grossSavings = 0, interestProfit = 0, activeLoans = 0;
    data.members.forEach(m => {
        data[m].contributions.forEach(c => grossSavings += Number(c.amt));
        data[m].loans.filter(l => l.type === 'LOAN').forEach((loan, idx) => {
            let p = Number(loan.amt), paid = data[m].loans.filter(r => r.type === 'REPAYMENT' && r.loanId == (idx+1)).reduce((a, b) => a + Number(b.amt), 0);
            if (p - paid > 0) activeLoans += (p - paid);
            if (paid > p) interestProfit += (paid - p);
        });
    });
    let sIn = data.cashIn.reduce((a,b)=>a+Number(b.amt), 0);
    let sOut = data.expenses.reduce((a,b)=>a+Number(b.amt), 0) + data.investments.reduce((a,b)=>a+Number(b.amt), 0);
    let netCash = (grossSavings + interestProfit + sIn) - (activeLoans + sOut);

    let html = `
        <div class="card" style="background:#111; color:#fff">
            <h1 style="margin:0; color:#B08D57">NET CASH: UGX ${netCash.toLocaleString()}</h1>
            <div class="grid" style="margin-top:10px">
                <div class="stat-box" style="background:#222; border-color:#444; color:#fff"><small>Gross Savings</small><br><strong>${grossSavings.toLocaleString()}</strong></div>
                <div class="stat-box" style="background:#222; border-color:#B08D57; color:#fff"><small>Interest Profit</small><br><strong>${interestProfit.toLocaleString()}</strong></div>
                <div class="stat-box" style="background:#222; border-color:#444; color:#fff"><small>Active Loans</small><br><strong>${activeLoans.toLocaleString()}</strong></div>
            </div>
        </div>`;

    if(isAdmin) {
        const nextLoanId = data[activeMember].loans.filter(l => l.type === 'LOAN').length + 1;
        html += `
        <div class="card" style="border:2px solid #B08D57">
            <h2>Admin Hub: Managing ${activeMember}</h2>
            <div class="grid">
                <div>
                    <h3>Inflow</h3>
                    <select id="mI" onchange="lastSelectedMember=this.value; render()">
                        ${data.members.map(m => `<option value="${m}" ${m === activeMember ? 'selected' : ''}>${m}</option>`).join('')}
                    </select>
                    <select id="tI" onchange="currentInflowType=this.value; render()">
                        <option value="S" ${currentInflowType==='S'?'selected':''}>Savings</option>
                        <option value="R" ${currentInflowType==='R'?'selected':''}>Loan Repayment</option>
                        <option value="C" ${currentInflowType==='C'?'selected':''}>Cash In / Donation</option>
                    </select>
                    ${currentInflowType === 'R' ? `<select id="lID">${data[activeMember].loans.filter(l=>l.type==='LOAN').map((l,i)=>`<option value="${i+1}">Repay L${i+1} (${l.date})</option>`).join('') || '<option disabled>No Loans</option>'}</select>` : (currentInflowType === 'S' ? `<input type="month" id="moI" value="${new Date().toISOString().slice(0,7)}">` : `<input type="text" id="descIn" placeholder="Description">`)}
                    <input type="date" id="daMan" value="${new Date().toISOString().split('T')[0]}">
                    <input type="number" id="amI" placeholder="Amount (UGX)">
                    <button class="gold" onclick="postInflow()">Post Inflow</button>
                </div>
                <div>
                    <h3>Outflow <small style="color:#B08D57; float:right">Next ID: Loan #${nextLoanId}</small></h3>
                    <select id="tO"><option value="L">Issue Loan #${nextLoanId}</option><option value="E">Expense</option><option value="I">Investment</option></select>
                    <input type="date" id="daOut" value="${new Date().toISOString().split('T')[0]}">
                    <input type="text" id="reO" placeholder="Description">
                    <input type="number" id="amO" placeholder="Amount (UGX)">
                    <button class="gold" onclick="postOutflow()">Post Outflow</button>
                </div>
            </div>
        </div>`;
    }

    let mySavings = data[activeMember].contributions.reduce((a,b)=>a+Number(b.amt), 0);
    let myDebt = getMemberLoanDebt(activeMember);
    let myArrears = calcArrearsAndFines(activeMember);

    html += `
        <div class="card">
            <h2>Ledger: ${activeMember}</h2>
            <div class="grid">
                <div class="stat-box"><strong>Savings:</strong> ${mySavings.toLocaleString()}</div>
                <div class="stat-box" style="background:#FFF9C4"><strong>Arrears + Fines:</strong> UGX ${myArrears.toLocaleString()}</div>
                <div class="stat-box" style="background:#FFEBEE"><strong>Debt:</strong> UGX ${myDebt.toLocaleString()}</div>
            </div>
            <h3 style="margin-top:20px">Timeline</h3>
            <table>
                <tr><th>Month</th><th>Amount</th><th>Status</th></tr>`;
    
    let cy = 2024, cm = 2; const now = new Date();
    while(cy < now.getFullYear() || (cy === now.getFullYear() && cm <= now.getMonth() + 1)) {
        let mStr = `${cy}-${String(cm).padStart(2,'0')}`;
        let paid = data[activeMember].contributions.filter(c => c.month === mStr).reduce((a,b)=>a+Number(b.amt), 0);
        let badge = paid >= getMonthlyTarget(mStr) ? '<span class="badge badge-comp">COMPLETE</span>' : (paid > 0 ? '<span class="badge badge-part">PARTIAL</span>' : '<span class="badge badge-pend">PENDING</span>');
        html += `<tr><td>${mStr}</td><td>${paid.toLocaleString()}</td><td>${badge}</td></tr>`;
        cm++; if(cm > 12) { cm = 1; cy++; }
    }
    
    html += `</table>
            <h3>Loan History</h3>
            <table>
                ${data[activeMember].loans.map((l, i) => `<tr><td>${l.date}</td><td>${l.type}</td><td>${l.type==='LOAN'?'Loan Disbursed':'Repay L'+l.loanId}</td><td>${Number(l.amt).toLocaleString()}</td></tr>`).join('')}
            </table>
        </div>
        <div class="card">
            <h2>General Activity</h2>
            <table>
                ${data.cashIn.map(c => `<tr><td>${c.date}</td><td>Cash In</td><td>${c.source}</td><td>${Number(c.amt).toLocaleString()}</td></tr>`).join('')}
                ${data.expenses.map(e => `<tr><td>${e.date}</td><td>Expense</td><td>${e.reason}</td><td>${Number(e.amt).toLocaleString()}</td></tr>`).join('')}
                ${data.investments.map(i => `<tr><td>${i.date}</td><td>Investment</td><td>${i.reason}</td><td>${Number(i.amt).toLocaleString()}</td></tr>`).join('')}
            </table>
        </div>`;

    if(isAdmin) {
        html += `<div class="card"><h2>Global Audit</h2><div style="overflow-x:auto"><table>
            ${data.members.map(mem => 
                data[mem].contributions.map((c,i)=>`<tr><td>${mem}</td><td>Savings</td><td>${c.month}</td><td>${c.amt}</td><td><button class="del" onclick="del('S','${mem}',${i})">X</button></td></tr>`).join('') +
                data[mem].loans.map((l,i)=>`<tr><td>${mem}</td><td>${l.type}</td><td>${l.amt}</td><td><button class="del" onclick="del('L','${mem}',${i})">X</button></td></tr>`).join('')
            ).join('')}
            ${data.cashIn.map((c,i)=>`<tr><td>System</td><td>Cash In</td><td>${c.source}</td><td>${c.amt}</td><td><button class="del" onclick="del('C','',${i})">X</button></td></tr>`).join('')}
        </table></div></div>`;
    }

    html += `<button onclick="user=null;render()">Logout</button>`;
    app.innerHTML = html;
}

function postInflow() {
    const m = document.getElementById("mI").value, t = currentInflowType, amt = Number(document.getElementById("amI").value), date = document.getElementById("daMan").value;
    if(t === 'S') {
        let mStr = document.getElementById("moI").value;
        if(data[m].contributions.some(c => c.month === mStr)) return alert("Month exists!");
        data[m].contributions.push({amt, date, month: mStr});
    } else if(t === 'R') {
        data[m].loans.push({amt, date, type:'REPAYMENT', loanId: document.getElementById("lID").value});
    } else if(t === 'C') {
        data.cashIn.push({amt, date, source: document.getElementById("descIn").value || "Donation"});
    }
    saveData();
}

function postOutflow() {
    const t = document.getElementById("tO").value, amt = Number(document.getElementById("amO").value), desc = document.getElementById("reO").value, m = lastSelectedMember || user.name, date = document.getElementById("daOut").value;
    if(t==='L') data[m].loans.push({amt, date, type:'LOAN'});
    else if(t==='E') data.expenses.push({amt, reason:desc, date});
    else if(t==='I') data.investments.push({amt, reason:desc, date});
    saveData();
}

function del(cat, mem, idx) { if(confirm("Delete?")){ if(cat==='S')data[mem].contributions.splice(idx,1); else if(cat==='L')data[mem].loans.splice(idx,1); else if(cat==='C')data.cashIn.splice(idx,1); saveData(); } }
function checkLogin(n) { let p = prompt("PIN:"); if(p===data[n].pin){user={name:n};render();}else alert("Error"); }
loadData();
</script>
</body>
</html>
