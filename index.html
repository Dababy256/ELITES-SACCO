<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elites SACCO Final Master</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body{font-family:'Segoe UI', sans-serif; background:#F3E9D2; margin:0; color:#111}
    header{background:#111; color:#fff; padding:15px; display:flex; align-items:center; gap:12px; border-bottom:4px solid #B08D57}
    #logoSlot img{height:55px; width:55px; border-radius:50%; border:2px solid #B08D57; background:#fff; object-fit:cover}
    .container{padding:16px; max-width:1100px; margin:auto}
    .card{background:#fff; padding:20px; border-radius:12px; margin-bottom:16px; box-shadow:0 4px 10px rgba(0,0,0,0.1)}
    h2{margin-top:0; color:#111; border-bottom:2px solid #B08D57; padding-bottom:8px}
    table{width:100%; border-collapse:collapse; font-size:11px; margin-bottom:15px}
    th,td{border:1px solid #eee; padding:8px; text-align:left}
    th{background:#B08D57; color:#000}
    button{padding:8px 12px; border:none; border-radius:6px; background:#111; color:#fff; cursor:pointer; font-weight:bold; margin:2px}
    button.gold{background:#B08D57; color:#000}
    button.del{background:#ff4d4d; color:white; padding:2px 6px; font-size:10px; border-radius:4px}
    input,select{padding:10px; width:100%; margin-bottom:10px; border:1px solid #ccc; border-radius:8px}
    .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px}
    .stat-box{padding:12px; border-radius:8px; background:#f9f9f9; border:1px solid #ddd; color:#111}
</style>
</head>
<body>

<header>
    <div id="logoSlot"></div>
    <div style="flex-grow:1"><strong>ELITES SACCO</strong><br><small id="userLabel">Master System</small></div>
</header>

<div class="container" id="app"></div>

<script>
const BIN_ID = "6971f3eb43b1c97be94154dc"; 
const MASTER_KEY = "$2a$10$83AEiP9GsrLhSQIC8.nuW.6QtHG5XVzJElaL67zasDR0h8BYGLsQu";
const PRIMARY_ADMIN = "Apule Gerald Humble";
const SECONDARY_ADMIN = "Ameny Ronald";

let user = null;
let data = {};
let lastSelectedMember = null;
let currentInflowType = "S";

async function loadData() {
    try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {headers:{'X-Master-Key':MASTER_KEY}});
        const json = await res.json();
        data = json.record;
        if(data.logo) document.getElementById("logoSlot").innerHTML = `<img src="${data.logo}">`;
        render();
    } catch (e) { console.error("Sync Error"); }
}

async function saveData() {
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method:'PUT', headers:{'Content-Type':'application/json','X-Master-Key':MASTER_KEY},
        body: JSON.stringify(data)
    });
    render();
}

function render() {
    const app = document.getElementById("app");
    if(!user) {
        let h = `<div class="card" style="text-align:center"><h2>Login</h2><div class="grid">`;
        data.members.forEach(m => h += `<button onclick="checkLogin('${m}')">${m}</button>`);
        app.innerHTML = h + `</div></div>`;
        return;
    }

    const isAdmin = user.name === PRIMARY_ADMIN || user.name === SECONDARY_ADMIN;
    const target = user.name; 
    const activeMemberForAdmin = lastSelectedMember || target;

    // --- TREASURY MATH (LOCKED) ---
    let grossSavingsTotal = 0, totalInterestEarned = 0, currentOutstandingLoans = 0, totalExpenses = 0, totalInvestments = 0;
    data.members.forEach(m => {
        data[m].contributions.forEach(c => grossSavingsTotal += Number(c.amt));
        let mLoans = data[m].loans.filter(l => l.type === 'LOAN');
        let mRepays = data[m].loans.filter(l => l.type === 'REPAYMENT');
        mLoans.forEach((loan, idx) => {
            let id = idx + 1;
            let principal = Number(loan.amt);
            let paid = mRepays.filter(r => r.loanId == id).reduce((a, b) => a + Number(b.amt), 0);
            let balance = principal - paid;
            if(balance > 0) currentOutstandingLoans += balance;
            if(paid > principal) totalInterestEarned += (paid - principal);
        });
    });
    data.expenses.forEach(e => totalExpenses += Number(e.amt));
    data.investments.forEach(i => totalInvestments += Number(i.amt));
    let totalOutflows = currentOutstandingLoans + totalExpenses + totalInvestments;
    let netCashResult = (grossSavingsTotal + totalInterestEarned) - totalOutflows;

    // PERSONAL DATA
    let myDebt = 0;
    data[target].loans.filter(l=>l.type==='LOAN').forEach((l, i) => {
        let paid = data[target].loans.filter(r => r.type==='REPAYMENT' && r.loanId == (i+1)).reduce((a,b)=>a+Number(b.amt),0);
        if((Number(l.amt)-paid) > 0) myDebt += (Number(l.amt)-paid);
    });

    // START HTML RENDERING
    let html = `
        <div class="card" style="background:#111; color:#fff">
            <h1 style="margin:0; color:#B08D57; font-size:24px">NET CASH: UGX ${netCashResult.toLocaleString()}</h1>
            <div class="grid" style="margin-top:10px">
                <div class="stat-box" style="background:#222; color:#fff; border:1px solid #444"><small>Gross Savings</small><br><strong>${grossSavingsTotal.toLocaleString()}</strong></div>
                <div class="stat-box" style="background:#222; color:#fff; border:1px solid #B08D57"><small>Interest Profit</small><br><strong>${totalInterestEarned.toLocaleString()}</strong></div>
                <div class="stat-box" style="background:#222; color:#fff; border:1px solid #444"><small>Outflows</small><br><strong>${totalOutflows.toLocaleString()}</strong></div>
            </div>
        </div>

        <div class="card">
            <h3>Account: ${target}</h3>
            <div class="grid">
                <div class="stat-box"><strong>Total Savings:</strong><br>UGX ${data[target].contributions.reduce((a,b)=>a+Number(b.amt),0).toLocaleString()}</div>
                <div class="stat-box" style="background:#FFEBEE"><strong>Active Loan Debt:</strong><br>UGX ${myDebt.toLocaleString()}</div>
            </div>
            <div style="margin-top:10px">
                <button class="gold" onclick="changePIN()">Change PIN</button>
                <button onclick="user=null;render()">Logout</button>
            </div>
        </div>`;

    if(isAdmin) {
        let nextLoanID = data[activeMemberForAdmin].loans.filter(l => l.type === 'LOAN').length + 1;
        html += `
        <div class="card" style="border:2px solid #B08D57">
            <h2>Admin Entry Hub</h2>
            <div class="grid">
                <div>
                    <h3>Inflow</h3>
                    <select id="mI" onchange="lastSelectedMember=this.value; render()">
                        ${data.members.map(m => `<option value="${m}" ${m === activeMemberForAdmin ? 'selected' : ''}>${m}</option>`).join('')}
                    </select>
                    <select id="tI" onchange="currentInflowType=this.value; render()">
                        <option value="S" ${currentInflowType==='S'?'selected':''}>Savings Contribution</option>
                        <option value="R" ${currentInflowType==='R'?'selected':''}>Loan Repayment</option>
                    </select>
                    ${currentInflowType === 'R' ? `
                        <select id="lID">
                            ${data[activeMemberForAdmin].loans.filter(l=>l.type==='LOAN').length > 0 
                                ? data[activeMemberForAdmin].loans.filter(l=>l.type==='LOAN').map((l,i)=>`<option value="${i+1}">Repay Loan ${i+1}</option>`).join('')
                                : `<option disabled>No Active Loans</option>`}
                        </select>` : `<input type="month" id="moI" value="2024-02">`}
                    <input type="date" id="daI" value="${new Date().toISOString().split('T')[0]}">
                    <input type="number" id="amI" placeholder="Amount">
                    <button class="gold" onclick="postInflow()">Post Inflow</button>
                </div>
                <div>
                    <h3>Outflow</h3>
                    <select id="tO" onchange="render()">
                        <option value="L">Loan Disbursed (Assigning: Loan ${nextLoanID})</option>
                        <option value="E">Expense</option>
                        <option value="I">Investment</option>
                    </select>
                    <input type="date" id="daO" value="${new Date().toISOString().split('T')[0]}">
                    <input type="text" id="reO" placeholder="Reference Note">
                    <input type="number" id="amO" placeholder="Amount">
                    <button class="gold" onclick="postOutflow()">Post Outflow</button>
                </div>
            </div>
        </div>`;
    }

    // PERSONAL LEDGERS (Separated & Positioned Below Admin)
    html += `
        <div class="card">
            <h2>Personal Savings History</h2>
            <table>
                <tr><th>Date</th><th>Month Ref</th><th>Amount</th></tr>
                ${data[target].contributions.map(c => `<tr><td>${c.date}</td><td>${c.month}</td><td>${Number(c.amt).toLocaleString()}</td></tr>`).join('')}
            </table>
        </div>
        
        <div class="card">
            <h2>Personal Loan & Repayment History</h2>
            <table>
                <tr><th>Date</th><th>Type</th><th>Reference</th><th>Amount</th></tr>
                ${data[target].loans.map(l => `<tr><td>${l.date}</td><td>${l.type}</td><td>${l.type==='REPAYMENT'?'Loan '+l.loanId:'New Disbursement'}</td><td>${Number(l.amt).toLocaleString()}</td></tr>`).join('')}
            </table>
        </div>`;

    if(isAdmin) {
        html += `
        <div class="card">
            <h2>Global Audit Ledger</h2>
            <div style="overflow-x:auto">
                <table>
                    <tr><th>Member</th><th>Type</th><th>Details</th><th>Amt</th><th>Action</th></tr>
                    ${data.members.map(m => `
                        ${data[m].contributions.map((c,i) => `<tr><td>${m}</td><td>Savings</td><td>${c.month}</td><td>${c.amt}</td><td><button class="del" onclick="del('S','${m}',${i})">X</button></td></tr>`).join('')}
                        ${data[m].loans.map((l,i) => `<tr><td>${m}</td><td>${l.type}</td><td>${l.type==='REPAYMENT'?'Loan '+l.loanId:'Loan'}</td><td>${l.amt}</td><td><button class="del" onclick="del('L','${m}',${i})">X</button></td></tr>`).join('')}
                    `).join('')}
                </table>
            </div>
        </div>`;
    }

    app.innerHTML = html;
}

function postInflow() {
    const m = document.getElementById("mI").value, t = currentInflowType, amt = Number(document.getElementById("amI").value);
    let date = document.getElementById("daI").value;
    lastSelectedMember = m;
    if(t === 'S') {
        data[m].contributions.push({amt, date, month:document.getElementById("moI").value});
    } else {
        const lIdSelect = document.getElementById("lID");
        if(lIdSelect && lIdSelect.value.includes("Loan")) {
            let actualId = lIdSelect.value.replace('Repay Loan ', '');
            data[m].loans.push({amt, date, type:'REPAYMENT', loanId: actualId});
        }
    }
    saveData();
}

function postOutflow() {
    const t = document.getElementById("tO").value, amt = Number(document.getElementById("amO").value), date = document.getElementById("daO").value, m = document.getElementById("mI").value;
    if(t==='L') data[m].loans.push({amt, date, type:'LOAN'});
    else if(t==='E') data.expenses.push({amt, reason:document.getElementById("reO").value, date});
    else if(t==='I') data.investments.push({amt, reason:document.getElementById("reO").value, date});
    saveData();
}

function del(cat, mem, idx) { if(confirm("Delete record?")){ if(cat==='S')data[mem].contributions.splice(idx,1); else data[mem].loans.splice(idx,1); saveData();}}
function changePIN() { let p = prompt("Enter 4-digit PIN:"); if(p && p.length===4){data[user.name].pin=p; saveData();} }
function checkLogin(n) { let p = prompt("PIN:"); if(p===data[n].pin){user={name:n};render();}else alert("Error"); }
loadData();
</script>
</body>
</html>
